services:
  - type: web
    name: loan-application-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: TELEGRAM_SUPER_ADMIN_IDS
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_POLLING
        value: "true"
      - key: INTEREST_RATE
        value: "5"
      - key: MIN_LOAN_AMOUNT
        value: "50000"
      - key: MAX_LOAN_AMOUNT
        value: "5000000"
      - key: DEFAULT_TERM_MONTHS
        value: "3"
      - key: DEV_SHOW_CODES
        value: "false"
      - key: SMS_PROVIDER
        value: "console"
