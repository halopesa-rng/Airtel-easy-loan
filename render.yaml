services:
  - type: web
    name: orange-maxit-botswana-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_CHAT_ID
        sync: false
      - key: APP_BASE_URL
        sync: false
