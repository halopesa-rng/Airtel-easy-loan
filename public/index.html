<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#087f4b"><link rel="apple-touch-icon" href="/icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O'LIVE TECH School Login</title><link rel="stylesheet" href="/styles.css?v=1.3.5"><link rel="stylesheet" href="/ui-polish.css?v=1.3.5"><script src="/tenant-brand.js" defer></script></head><body><main class="login"><div class="card login-card"><div class="logo-area"><img id="schoolLogo" class="logo-circle" src="/olive-tech-logo.svg" alt="O'LIVE TECH logo" style="object-fit:contain;background:#fff"><h1 id="loginSchoolName">School Management System</h1><p>Powered by O'LIVE TECH</p></div><div style="margin:0 0 14px"><label for="schoolId" style="display:block;font-weight:700;margin-bottom:6px">School ID</label><input id="schoolId" autocomplete="organization" placeholder="Enter your School ID (e.g. OLV-1234ABCD)" required style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box"><small id="schoolIdentityMsg" style="display:block;margin-top:5px;color:#667085">New school? <a href="/register">Register here</a>.</small></div><section id="choose"><h3>Select your account</h3><div class="role-grid" id="roles"></div><div id="chooseMsg"></div></section><section id="credentials" hidden><button class="change" onclick="changeRole()">← Change account</button><div class="selected">Signing in as: <b id="selectedLabel"></b></div><form id="form"><input id="username" autocomplete="username" placeholder="Username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button class="login-btn">LOGIN</button><div id="msg"></div></form></section><footer><span class="developer-number" id="developerNumber"></span><span>Platform provider: O'LIVE TECH</span></footer></div></main><script>
const roleData=[['admin','🔐','Admin','Full school management'],['director','📊','Director','School overview'],['principal','🏫','Principal','Academic management'],['secretary','📒','Secretary','Office & finance'],['teacher','👩‍🏫','Teacher','Marks & exams'],['ustadh','🕌','Ustadh','Tahfidh programme'],['patron','🏠','Patron / Boarding Master','Boarding & welfare'],['student','🎓','Student','My school records'],['parent','👨‍👩‍👧','Parent','Children & results'],['worker','🧑‍💼','Worker','School operations']];let selected='';
roles.innerHTML=roleData.map(r=>`<button class="role-card" onclick="selectRole('${r[0]}','${r[2]}')"><span>${r[1]}</span><b>${r[2]}</b><small>${r[3]}</small></button>`).join('');
function selectRole(role,label){selected=role;selectedLabel.textContent=label;choose.hidden=true;credentials.hidden=false;username.focus()}
function changeRole(){credentials.hidden=true;choose.hidden=false;form.reset();msg.textContent='';selected=''}
form.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in...';msg.className='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value,role:selected,school_id:schoolId.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');localStorage.gs_token=d.token;localStorage.gs_user=JSON.stringify(d.user);localStorage.olive_school_id=d.school_id||schoolId.value.trim();location.href='/'+d.user.role+'.html'}catch(e){msg.className='err';msg.textContent=e.message}};
</script><script>fetch('/api/platform/brand').then(r=>r.ok?r.json():null).then(c=>{if(c?.phone)document.getElementById('developerNumber').textContent=c.phone}).catch(()=>{});
async function loadSchoolIdentity(){const id=schoolId.value.trim();if(!id)return;schoolIdentityMsg.textContent='Checking school ID…';try{const r=await fetch('/api/school-config?school_id='+encodeURIComponent(id));const c=await r.json();if(!r.ok)throw Error(c.error||'School not found');loginSchoolName.textContent=c.school;document.title=c.school+' | O'LIVE TECH';schoolIdentityMsg.textContent='School: '+c.school+' • Status: '+String(c.status||'').replaceAll('_',' ');if(c.logo_url){const img=document.getElementById('schoolLogo');if(img)img.src=c.logo_url}}catch(e){schoolIdentityMsg.textContent=e.message}}schoolId.addEventListener('change',loadSchoolIdentity);schoolId.addEventListener('blur',loadSchoolIdentity);if(localStorage.olive_school_id){schoolId.value=localStorage.olive_school_id;loadSchoolIdentity()}
</script><script src="/pwa.js"></script></body></html>
