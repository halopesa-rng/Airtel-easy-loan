<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Congo Loan</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#222}header{background:#e7192d;color:white;padding:20px;font-size:22px;font-weight:800}.wrap{max-width:1000px;margin:20px auto;padding:0 14px}.card,.item{background:white;border:1px solid #e4e6ea;border-radius:14px;padding:18px;margin-bottom:14px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6d9de;border-radius:8px;margin:8px 0;font:inherit}button{padding:10px 14px;border:0;border-radius:8px;background:#e7192d;color:white;font-weight:700;margin:5px 5px 5px 0}button.alt{background:white;color:#e7192d;border:1px solid #e7192d}.muted{color:#68707b;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.status{font-weight:800;color:#e7192d}</style></head><body><header>Congo Loan · Administrator</header><main class="wrap"><section class="card" id="login"><h2>Administrator login</h2><p class="muted">Use the ADMIN_PASSWORD configured in Render environment variables.</p><form id="loginForm"><input id="password" type="password" required autocomplete="current-password" placeholder="Administrator password"><button>Sign in</button></form><p id="loginError" class="muted"></p></section><section id="dashboard" class="hidden"><div class="row"><h2>Applications</h2><button id="refresh" class="alt">Refresh list</button><button id="logout" class="alt">Log out</button></div><p class="muted">Approve or reject only after reviewing the application. Telegram notifications also provide Approve and Reject buttons.</p><div id="items"></div></section></main><script src="/admin.js"></script></body></html>
