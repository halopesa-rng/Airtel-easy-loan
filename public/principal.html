<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Management Oversight — your school</title><link rel="stylesheet" href="/styles.css?v=1.5.8"><link rel="stylesheet" href="/ui-polish.css?v=1.5.8"><style>.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{text-align:left;min-height:125px}.tile .icon{font-size:28px}.muted{color:#667085}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{margin:0}</style><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><header><b id="brand">your school — School Oversight</b><span id="user"></span><button onclick="location.href='/review-centre.html'">🔔 Review Centre</button><button onclick="logout()">Logout</button></header><main><section class="card"><h1 id="heading" style="margin:0">School Oversight</h1><p id="intro" class="muted">Select a module to inspect detailed records.</p></section><div id="tiles" class="tiles"></div><section id="detail" class="card" hidden><h2 id="title">Overview</h2><div id="body" class="muted">Choose a module above.</div></section><div style="padding:0 18px 18px"><button onclick="communication()">📢 Communication Centre</button></div></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user||!['director','principal'].includes(user.role))location.href='/';document.getElementById('user').textContent=user.full_name+' ('+user.role+')';function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||'Request failed');return d})}function downloadSelectedFeesReport(){const period=document.getElementById('feePeriod')?.value||'all';let url='/api/documents/fees?period='+encodeURIComponent(period);let name='fees-analysis.html';if(period==='monthly'){const m=document.getElementById('feeMonth')?.value;if(!m)return alert('Select a month first.');url+='&month='+encodeURIComponent(m);name='fees-'+m+'.html'}else if(period==='termly'){const y=document.getElementById('feeYear')?.value,t=document.getElementById('feeTerm')?.value;url+='&academic_year='+encodeURIComponent(y)+'&term='+encodeURIComponent(t);name='fees-'+t.replace(/\s+/g,'-').toLowerCase()+'-'+y+'.html'}downloadDoc(url,name)}function toggleFeePeriod(){const p=document.getElementById('feePeriod')?.value||'all';document.getElementById('feeMonth').style.display=p==='monthly'?'block':'none';document.getElementById('feeYear').style.display=p==='termly'?'block':'none';document.getElementById('feeTerm').style.display=p==='termly'?'block':'none'}
function logout(){localStorage.clear();location.href='/'}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function table(h,r){return '<div style="overflow:auto"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.join('')+'</table></div>'}async function downloadDoc(url,filename){try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename||'school-document.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200)}catch(e){alert(e.message)}}
const director=user.role==='director';document.getElementById('brand').textContent='your school — '+(director?'Director Analysis':'Principal Oversight');document.getElementById('heading').textContent=director?'Director School Intelligence':'Principal School Oversight';document.getElementById('intro').textContent=director?'School-wide analysis, finance, academics, operations and strategic oversight.':'Academic, learner, finance and operational oversight for the school.';
const mods=director?[['students','🎓','Students','Learner population and register'],['finance','💰','Finance','Fees, collection and expenditure'],['academics','📊','Academic Analysis','CBC performance and examinations'],['operations','🏫','Operations','Assets and school resources'],['documents','📄','Documents','Official school records'],['payroll','💼','Payroll','View payroll and payslips']]:[['students','🎓','Students','Learner register and class position'],['finance','💰','Finance Oversight','Fees and collection'],['academics','📚','Academic Oversight','CBC examinations and results'],['learning-areas','📘','Learning Areas','Add, edit and manage learning area codes'],['subject-reports','🧑‍🏫','Student Subject Reports','Approve, reject, delete and download learner reports'],['syllabus-coverage','📘','Syllabus Coverage & Plans','Review teacher syllabus coverage, challenges and plans'],['tafhid','🕌','Tahfidh Programme','View Tahfidh groups and assessment records'],['operations','🏫','Operations','Assets and school resources'],['documents','📄','Documents','Official school records'],['payroll','💼','Payroll','View payroll and payslips']];tiles.innerHTML=mods.map(m=>`<button class="card tile" onclick="openModule('${m[0]}')"><span class="icon">${m[1]}</span><b>${m[2]}</b><small>${m[3]}</small><span>Open details →</span></button>`).join('');
async function openModule(n){if(n==='tafhid')return location.href='/tahfidh.html';try{if(n==='students')await students();else if(n==='finance')await finance();else if(n==='academics')await academics();else if(n==='learning-areas')await learningAreas();else if(n==='subject-reports')return location.href='/subject-reports.html';else if(n==='syllabus-coverage')return location.href='/syllabus-coverage.html';else if(n==='operations')await operations();else if(n==='payroll')await payrollOffice();else await documents();tiles.hidden=true;document.querySelector('main>section.card').hidden=true;detail.hidden=false;detail.scrollIntoView({behavior:'auto',block:'start'});if(!body.querySelector('.gs-back'))body.insertAdjacentHTML('afterbegin','<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button>');}catch(e){body.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function backToDashboard(){detail.hidden=true;tiles.hidden=false;document.querySelector('main>section.card').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
async function students(){let d=await api('/api/students');title.textContent='Students';body.innerHTML='<div class="actions"><button onclick="downloadDoc(\'/api/documents/students\',\'student-register.html\')">Download Student Register</button></div>'+table(['Admission','Student','Class','Stream','Parent','Phone'],d.map(x=>`<tr><td>${esc(x.admission_no)}</td><td>${esc(x.full_name)}</td><td>${esc(x.class_name)}</td><td>${esc(x.stream)}</td><td>${esc(x.parent_name)}</td><td>${esc(x.parent_phone)}</td></tr>`))}
async function finance(){let [o,f]=await Promise.all([api('/api/analytics/overview'),api('/api/analytics/fees')]);title.textContent=director?'Director Financial Intelligence':'Principal Financial Oversight';body.innerHTML=`<div class="grid"><div class="card">Fees Charged<div class="stat">KSh ${o.feesCharged.toLocaleString()}</div></div><div class="card">Fees Paid<div class="stat">KSh ${o.feesPaid.toLocaleString()}</div></div><div class="card">Outstanding<div class="stat">KSh ${o.balance.toLocaleString()}</div></div><div class="card">Expenditure<div class="stat">KSh ${o.expenditure.toLocaleString()}</div></div></div><div class="actions"><div class="card" style="margin-top:14px"><h3>Download Fees Report</h3><div class="grid"><select id="feePeriod" onchange="toggleFeePeriod()"><option value="all">All Time</option><option value="monthly">Monthly</option><option value="termly">Termly</option></select><input id="feeMonth" type="month" style="display:none"><select id="feeYear" style="display:none"><option>2026</option><option>2027</option><option>2028</option></select><select id="feeTerm" style="display:none"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><button type="button" onclick="downloadSelectedFeesReport()">Download Fees Report</button></div><small class="muted">Choose all time, a month, or an academic term.</small></div><div class="card"><h3>Download Expenditure</h3><div class="grid"><select id="expPeriod"><option value="all">All</option><option value="daily">Specific Day</option><option value="monthly">Specific Month</option><option value="termly">Specific Term</option></select><input id="expDate" type="date"><input id="expMonth" type="month"><select id="expYear"><option>2026</option><option>2027</option></select><select id="expTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><button type="button" onclick="downloadExpenditureReport()">Download Expenditure Report</button></div></div></div>`+table(['Class','Students','Charged','Paid','Balance','Collection'],f.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${x.students}</td><td>KSh ${x.charged.toLocaleString()}</td><td>KSh ${x.paid.toLocaleString()}</td><td>KSh ${x.balance.toLocaleString()}</td><td>${x.charged?Math.round(x.paid/x.charged*100):0}%</td></tr>`))}
async function learningAreas(){try{const rows=await api('/api/subjects');title.textContent='Learning Areas';const form=`<div class="card"><h3>Add Learning Area</h3><p class="muted">Code is required and must be unique. These are the school learning areas used in CBC assessments.</p><form id="laf" class="grid"><input id="lac" placeholder="Code e.g. ENG" maxlength="20" required><input id="lan" placeholder="Learning area e.g. English Activities" required><input id="lal" placeholder="Applicable classes e.g. PP1, PP2, Grade 1, Grade 2, Grade 3"><input id="lam" type="number" min="1" value="100" placeholder="Maximum marks"><button>Add Learning Area</button></form></div>`;body.innerHTML=form+table(['Code','Learning Area','Applicable Classes','Max Marks','Actions'],rows.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(x.levels||'All classes')}</td><td>${x.max_marks||100}</td><td><button onclick="editLearningArea(${x.id})">Edit</button></td></tr>`));laf.onsubmit=async e=>{e.preventDefault();try{await api('/api/subjects',{method:'POST',body:JSON.stringify({code:lac.value.trim().toUpperCase(),name:lan.value.trim(),levels:lal.value.trim(),max_marks:Number(lam.value||100)})});alert('Learning area added successfully.');learningAreas()}catch(err){alert(err.message)}}}catch(e){body.innerHTML='<div class="err">Unable to load learning areas: '+esc(e.message)+'</div>'}}async function editLearningArea(id){try{const x=(await api('/api/subjects')).find(a=>Number(a.id)===Number(id));if(!x)return alert('Learning area not found.');const code=prompt('Learning area code:',x.code||'');if(code===null)return;const name=prompt('Learning area name:',x.name||'');if(name===null)return;const levels=prompt('Applicable classes:',x.levels||'');if(levels===null)return;const max=prompt('Maximum marks:',x.max_marks||100);if(max===null)return;await api('/api/subjects/'+id,{method:'PATCH',body:JSON.stringify({code:code.trim().toUpperCase(),name:name.trim(),levels:levels.trim(),max_marks:Number(max)})});alert('Learning area updated successfully.');learningAreas()}catch(e){alert(e.message)}}async function deleteLearningArea(id){if(user.role!=='principal')return alert('Only the principal can delete a learning area here.');if(!confirm('Delete this learning area? Existing marks and assignments using it will also be removed.'))return;try{await api('/api/subjects/'+id,{method:'DELETE'});learningAreas()}catch(e){alert(e.message)}}
async function academics(){let e=await api('/api/exams');title.textContent=director?'Director Academic Intelligence':'Principal Academic Oversight';const canManage=['director','principal'].includes(user.role);const form=canManage?`<div class="card"><h3>Manage Examinations</h3><form id="examForm" class="grid"><input id="examName" placeholder="Exam name" required><select id="examTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><input id="examYear" type="number" value="${new Date().getFullYear()}" required><input id="examDate" type="date"><button type="submit">Add Examination</button></form></div>`:'';body.innerHTML=form+table(['Exam','Term','Year','Date','Actions'],e.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.term)}</td><td>${x.academic_year}</td><td>${esc(x.exam_date||'—')}</td><td><button onclick="examA(${x.id})">View Analysis</button>${canManage?` <button onclick="editExam(${x.id})">Edit</button> <button onclick="deleteExam(${x.id})">Delete</button>`:''}</td></tr>`));if(canManage){examForm.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/exams',{method:'POST',body:JSON.stringify({name:examName.value.trim(),term:examTerm.value,academic_year:examYear.value,exam_date:examDate.value||null})});alert('Examination added successfully.');academics()}catch(err){alert(err.message)}}}}async function editExam(id){const e=(await api('/api/exams')).find(x=>Number(x.id)===Number(id));if(!e)return alert('Exam not found');const name=prompt('Exam name:',e.name);if(name===null)return;const term=prompt('Term:',e.term||'');if(term===null)return;const year=prompt('Academic year:',e.academic_year||'');if(year===null)return;const date=prompt('Exam date (YYYY-MM-DD, optional):',e.exam_date||'');if(date===null)return;try{await api('/api/exams/'+id,{method:'PATCH',body:JSON.stringify({name:name.trim(),term:term.trim(),academic_year:Number(year),exam_date:date||null})});alert('Examination updated successfully.');academics()}catch(err){alert(err.message)}}async function deleteExam(id){if(!confirm('Delete this examination? Any marks linked to it will also be deleted. This cannot be undone.'))return;try{await api('/api/exams/'+id,{method:'DELETE'});alert('Examination deleted.');academics()}catch(err){alert(err.message)}}async function examA(id){let d=await api('/api/analytics/exams/'+id);body.innerHTML=table(['Class','Students','Average','EE','ME','AE','BE'],d.byClass.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${x.students}</td><td>${x.average}</td><td>${x.ee}</td><td>${x.me}</td><td>${x.ae}</td><td>${x.be}</td></tr>`))+table(['Learning Area','Entries','Average','EE','ME','AE','BE'],d.bySubject.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.entries}</td><td>${x.average}</td><td>${x.ee}</td><td>${x.me}</td><td>${x.ae}</td><td>${x.be}</td></tr>`))}
async function operations(){let d=await api('/api/assets');title.textContent='School Operations & Assets';body.innerHTML='<div class="actions"><button onclick="downloadDoc(\'/api/documents/assets\',\'assets-register.html\')">Download Assets Register</button></div>'+table(['Code','Asset','Category','Qty','Condition','Location','Value'],d.map(x=>'<tr><td>'+esc(x.asset_code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.category)+'</td><td>'+x.quantity+'</td><td>'+esc(x.condition)+'</td><td>'+esc(x.location)+'</td><td>KSh '+Number(x.purchase_value||0).toLocaleString()+'</td></tr>'))}
async function payrollOffice(){try{const periods=await api('/api/payroll/periods');if(user.role==='director'){body.innerHTML='<h3>Payroll Approval & Publication</h3><p class="muted">Review prepared payrolls before approving and publishing them live to staff.</p>'+table(['Period','Status','Action'],periods.map(x=>'<tr><td>'+x.payroll_year+'-'+String(x.payroll_month).padStart(2,'0')+'</td><td>'+esc(x.status)+'</td><td><button onclick="openPayrollOffice('+x.id+')">Review</button> <button onclick="downloadDoc(\'/api/documents/payroll/'+x.id+'\',\'payroll-'+x.payroll_year+'-'+x.payroll_month+'.html\')">Download</button> '+(x.status==='submitted'?'<button onclick="approvePayroll('+x.id+')">Approve & Publish</button><button class="danger" onclick="rejectPayroll('+x.id+')">Reject</button>':'')+(x.status==='approved'?'<button onclick="markPayrollPaid('+x.id+')">Mark Paid</button>':'')+'</td></tr>'));}else{const staff=await api('/api/payroll/staff');const opts=staff.filter(x=>x.active).map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+' — '+esc(x.role)+'</option>').join('');body.innerHTML='<h3>Prepare Payroll</h3><p class="muted">Principal may prepare payroll and submit it to the Director.</p><form id="ppf" class="grid"><select id="pps">'+opts+'</select><input id="ppb" type="number" min="0" placeholder="Basic salary"><input id="pph" type="number" min="0" placeholder="House allowance"><input id="ppt" type="number" min="0" placeholder="Transport allowance"><input id="ppo" type="number" min="0" placeholder="Other allowance"><input id="pptax" type="number" min="0" placeholder="Tax / PAYE"><input id="ppp" type="number" min="0" placeholder="Pension / NSSF"><input id="ppd" type="number" min="0" placeholder="Other deduction"><button>Save Salary Profile</button></form><form id="ppr" class="grid"><input id="ppy" type="number" value="'+new Date().getFullYear()+'"><select id="ppm">'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+new Date(2000,i,1).toLocaleString(undefined,{month:'long'})+'</option>').join('')+'</select><button>Prepare Payroll</button></form>'+table(['Period','Status','Action'],periods.map(x=>'<tr><td>'+x.payroll_year+'-'+String(x.payroll_month).padStart(2,'0')+'</td><td>'+esc(x.status)+'</td><td><button onclick="openPayrollOffice('+x.id+')">Open</button> '+(x.status==='draft'?'<button onclick="submitPayrollOffice('+x.id+')">Submit to Director</button>':'')+'</td></tr>'));const $=id=>document.getElementById(id);$('pps').onchange=()=>{const x=staff.find(z=>Number(z.id)===Number($('pps').value));if(x){$('ppb').value=x.basic_salary||0;$('pph').value=x.house_allowance||0;$('ppt').value=x.transport_allowance||0;$('ppo').value=x.other_allowance||0;$('pptax').value=x.tax_deduction||0;$('ppp').value=x.pension_deduction||0;$('ppd').value=x.other_deduction||0}};$('pps').dispatchEvent(new Event('change'));$('ppf').onsubmit=async e=>{e.preventDefault();await api('/api/payroll/staff',{method:'POST',body:JSON.stringify({staff_id:$('pps').value,basic_salary:$('ppb').value,house_allowance:$('pph').value,transport_allowance:$('ppt').value,other_allowance:$('ppo').value,tax_deduction:$('pptax').value,pension_deduction:$('ppp').value,other_deduction:$('ppd').value})});payrollOffice()};$('ppr').onsubmit=async e=>{e.preventDefault();await api('/api/payroll/run',{method:'POST',body:JSON.stringify({year:$('ppy').value,month:$('ppm').value})});payrollOffice()}}}catch(e){body.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function submitPayrollOffice(id){await api('/api/payroll/periods/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'submitted'})});payrollOffice()}
async function approvePayroll(id){if(!confirm('Approve and publish this payroll live to staff?'))return;await api('/api/payroll/periods/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'approved'})});alert('Payroll approved and published live.');payrollOffice()}
async function rejectPayroll(id){const note=prompt('Reason for rejecting this payroll:');if(note===null)return;await api('/api/payroll/periods/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'rejected',director_note:note||'Rejected by Director'})});alert('Payroll rejected and returned to the preparation stage.');payrollOffice()}
async function markPayrollPaid(id){await api('/api/payroll/periods/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'paid'})});payrollOffice()}
async function openPayrollOffice(id){const d=await api('/api/payroll/periods/'+id);body.innerHTML='<button class="gs-back" onclick="payrollOffice()">← Back to Payroll</button><h3>Payroll '+d.period.payroll_year+'-'+String(d.period.payroll_month).padStart(2,'0')+'</h3><p><b>Status:</b> '+esc(d.period.status)+'</p>'+table(['Staff','Role','Gross','Deductions','Net','Status'],d.entries.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.role)+'</td><td>KSh '+Number(x.gross_pay).toLocaleString()+'</td><td>KSh '+Number(x.total_deductions).toLocaleString()+'</td><td>KSh '+Number(x.net_pay).toLocaleString()+'</td><td>'+esc(x.status)+'</td></tr>'))}
async function documents(){title.textContent='Official School Documents';body.innerHTML='<div class="actions"><button onclick="downloadDoc(\'/api/documents/students\',\'student-register.html\')">Student Register</button><button onclick="downloadDoc(\'/api/documents/fees\',\'fees-analysis.html\')">Fees Analysis</button><button onclick="downloadDoc(\'/api/documents/expenditures\',\'expenditure-report.html\')">Expenditure Report</button></div><p class="muted">Official documents are generated in the school format.</p>'}
async function communication(){
 const rows=await api('/api/communications');
 const classes=await api('/api/classes').catch(()=>[]);
 shell('Communication Centre',`<div class="card"><h3>Communication Centre</h3><p class="muted">Send relevant announcements directly to the selected group. Students and parents only see messages addressed to them or their class/audience.</p><form id="commForm" class="grid"><input id="commTitle" placeholder="Message title" required><select id="commAudience"><option value="all">Everyone</option><option value="students">All Students</option><option value="parents">All Parents</option><option value="staff">All Staff</option><option value="teachers">Teachers</option><option value="support">Support Staff</option><option value="class">Specific Class</option><option value="role">Specific Role</option></select><select id="commValue" style="display:none"></select><textarea id="commMessage" placeholder="Write your message..." required style="grid-column:1/-1;min-height:120px"></textarea><button>Send Communication</button></form></div>`+table(['Date','Title','Audience','Sender','Action'],rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.title)}</td><td>${esc(x.audience_type)} ${x.audience_value?': '+esc(x.audience_value):''}</td><td>${esc(x.sender||'')}</td><td><button class="mini danger" onclick="deleteCommunication(${x.id})">Delete</button></td></tr>`)));
 commAudience.onchange=()=>{const a=commAudience.value;commValue.style.display=['class','role'].includes(a)?'block':'none';if(a==='class')commValue.innerHTML=classes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(a==='role')commValue.innerHTML=['student','parent','teacher','ustadh','worker','secretary','principal','director','admin'].map(x=>`<option value="${x}">${x}</option>`).join('');};
 commForm.onsubmit=async ev=>{ev.preventDefault();const a=commAudience.value;await api('/api/communications',{method:'POST',body:JSON.stringify({title:commTitle.value,message:commMessage.value,audience_type:a,audience_value:['class','role'].includes(a)?commValue.value:null})});alert('Communication sent successfully.');communication()}
}
async function deleteCommunication(id){if(confirm('Delete this communication?')){await api('/api/communications/'+id,{method:'DELETE'});communication()}}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='feePeriod')toggleFeePeriod()});async function myPayroll(){try{const d=await api('/api/payroll/my');const target=typeof shell==='function'?shell:null;if(target){target('My Payroll','View your own live payroll status.',`<div class="card"><h3>${esc(d.staff.full_name)}</h3>${table(['Month','Gross','Deductions','Net','Status','Payslip'],d.entries.map(x=>`<tr><td>${x.payroll_year}-${String(x.payroll_month).padStart(2,'0')}</td><td>KSh ${Number(x.gross_pay||0).toLocaleString()}</td><td>KSh ${Number(x.total_deductions||0).toLocaleString()}</td><td><b>KSh ${Number(x.net_pay||0).toLocaleString()}</b></td><td>${esc(x.status||x.period_status||'—')}</td><td><button onclick="downloadDoc('/api/documents/payslip/${x.id}','my-payslip-${x.payroll_year}-${x.payroll_month}.html')">Download</button></td></tr>`))}</div>`)}else{alert('Payroll module is available from Staff Workspace.')}}catch(e){alert(e.message)}}
function downloadExpenditureReport(){const p=document.getElementById('expPeriod')?.value||'all';let u='/api/documents/expenditures?period='+encodeURIComponent(p),n='expenditure-report.html';if(p==='daily'){const d=document.getElementById('expDate').value;if(!d)return alert('Select a day.');u+='&date='+d;n='expenditure-'+d+'.html'}else if(p==='monthly'){const m=document.getElementById('expMonth').value;if(!m)return alert('Select a month.');u+='&month='+m;n='expenditure-'+m+'.html'}else if(p==='termly'){u+='&academic_year='+document.getElementById('expYear').value+'&term='+encodeURIComponent(document.getElementById('expTerm').value);n='expenditure-'+document.getElementById('expTerm').value+'-'+document.getElementById('expYear').value+'.html'}downloadDoc(u,n)}
function downloadAttendanceReport(){const p=document.getElementById('attPeriod')?.value||'daily';let u='/api/documents/staff-attendance?period='+p,n='attendance-register.html';if(p==='daily'){u+='&date='+document.getElementById('attDate').value;n='attendance-'+document.getElementById('attDate').value+'.html'}else if(p==='monthly'){u+='&month='+document.getElementById('attMonth').value;n='attendance-'+document.getElementById('attMonth').value+'.html'}else{u+='&academic_year='+document.getElementById('attYear').value+'&term='+encodeURIComponent(document.getElementById('attTerm').value);n='attendance-'+document.getElementById('attTerm').value+'-'+document.getElementById('attYear').value+'.html'}downloadDoc(u,n)}
