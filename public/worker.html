<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Workspace — your school</title><link rel="stylesheet" href="/styles.css?v=1.3.9"><link rel="stylesheet" href="/ui-polish.css?v=1.3.9"><style>body{background:#f4f8f6}.wrap{max-width:1000px;margin:20px auto;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce7e2;border-radius:16px;padding:20px;box-shadow:0 6px 18px rgba(20,50,40,.06)}button{border:0;border-radius:9px;padding:11px 15px;background:#08623d;color:#fff;font-weight:700}button.card{background:#fff!important;color:#172033!important;-webkit-text-fill-color:#172033!important;text-align:left}button.card b,button.card small{color:inherit!important;-webkit-text-fill-color:inherit!important}.secondary{background:#087fa8}.danger{background:#b42318}.muted{color:#667085}.ok{color:#087443;font-weight:700}.err{color:#b42318;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:9px;border:1px solid #dbe4e0;text-align:left}th{background:#e9f4ef}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:11px;border:1px solid #ccd8d3;border-radius:8px}</style><link rel="stylesheet" href="/dashboard-polish.css?v=1.15.0"><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Staff Workspace</b><span id="user"></span><button onclick="logout()">Logout</button></header><main class="wrap"><div class="card"><h1>Staff Workspace</h1><p class="muted">Request leave, receive Director approval, download your approved leave-out letter, and sign in/out every school day.</p></div><div class="grid"><button class="card" onclick="attendance()">🕘<br><b>Daily Sign In / Out</b><br><small>Record when you arrive and leave school</small></button><button class="card" onclick="leave()">📄<br><b>Leave Out</b><br><small>Submit leave request to the Director</small></button><button class="card" onclick="communication()">📢<br><b>Communication Centre</b><br><small>View live school messages for staff</small></button><button class="card" onclick="location.href='/calendar'">📅<br><b>School Calendar</b><br><small>View live school events and dates</small></button><button class="card" onclick="payroll()">💼<br><b>My Payroll</b><br><small>View your live salary and payroll status</small></button></div><section id="panel" class="card" hidden style="margin-top:16px"><h2>Welcome</h2><p>Select a module above.</p></section></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user||!['worker','teacher','secretary','admin','principal','director'].includes(user.role))location.href='/';document.getElementById('user').textContent=(user.full_name||'Staff')+' ('+user.role+')';
function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d})}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logout(){localStorage.clear();location.href='/'}function openPanel(){document.querySelector('main>.card').hidden=true;document.querySelector('.grid').hidden=true;panel.hidden=false;panel.scrollIntoView({behavior:'auto',block:'start'})}function backToDashboard(){panel.hidden=true;document.querySelector('main>.card').hidden=false;document.querySelector('.grid').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}async function downloadDoc(url,filename){try{const sep=url.includes("?")?"&":"?";const u=url+sep+"download=1&download_token="+encodeURIComponent(token)+(filename?"&download_name="+encodeURIComponent(filename):"");window.open(u, "_blank", "noopener")}catch(e){alert(e.message)}}
async function attendance(){openPanel();const rows=await api('/api/staff-attendance/my');panel.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button>'+'<h2>Daily Sign In / Out</h2><p class="muted">Sign in immediately after arriving and sign out when leaving.</p><div class="actions"><button onclick="checkIn()">✓ Sign In Now</button><button class="secondary" onclick="checkOut()">↪ Sign Out Now</button></div><div style="margin-top:18px;overflow:auto"><table><tr><th>Date</th><th>Sign In</th><th>Sign Out</th></tr>'+rows.map(x=>`<tr><td>${esc(x.attendance_date)}</td><td>${x.check_in?new Date(x.check_in).toLocaleTimeString():'—'}</td><td>${x.check_out?new Date(x.check_out).toLocaleTimeString():'—'}</td></tr>`).join('')+'</table></div>';panel.scrollIntoView({behavior:'auto',block:'start'})}async function checkIn(){try{await api('/api/staff-attendance/check-in',{method:'POST'});alert('Signed in successfully.');attendance()}catch(e){alert(e.message)}}async function checkOut(){try{await api('/api/staff-attendance/check-out',{method:'POST'});alert('Signed out successfully.');attendance()}catch(e){alert(e.message)}}
async function leave(){openPanel();const rows=await api('/api/leave-requests');panel.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button>'+'<h2>Leave Out Request</h2><form id="lf" class="grid"><div class="field"><label>Leave type</label><select id="lt"><option>Annual Leave</option><option>Sick Leave</option><option>Personal Leave</option><option>Emergency Leave</option><option>Other</option></select></div><div class="field"><label>Start date</label><input id="ls" type="date" required></div><div class="field"><label>End date</label><input id="le" type="date" required></div><div class="field" style="grid-column:1/-1"><label>Reason</label><textarea id="lr" required placeholder="Explain the reason for your leave request"></textarea></div><button>Submit to Director</button></form><h3 style="margin-top:22px">My Requests</h3><div style="overflow:auto"><table><tr><th>Type</th><th>Dates</th><th>Status</th><th>Director note</th><th>Letter</th></tr>'+rows.map(x=>`<tr><td>${esc(x.leave_type)}</td><td>${esc(x.start_date)} to ${esc(x.end_date)}</td><td><b>${esc(x.status)}</b></td><td>${esc(x.director_note||'—')}</td><td>${x.status==='approved'?`<button onclick="downloadDoc('/api/documents/leave/${x.id}','approved-leave-out-letter.html')">Download Approved Letter</button>`:'—'}</td></tr>`).join('')+'</table></div>';panel.scrollIntoView({behavior:'auto',block:'start'});lf.onsubmit=async e=>{e.preventDefault();await api('/api/leave-requests',{method:'POST',body:JSON.stringify({leave_type:lt.value,start_date:ls.value,end_date:le.value,reason:lr.value})});alert('Leave request sent to the Director.');leave()}}
async function communication(){openPanel();try{const rows=await api('/api/communications');panel.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button><h2>Communication Centre</h2><p class="muted">Live school messages relevant to staff.</p>'+(rows.length?rows.map(c=>`<div class="card"><h3>${esc(c.title||'School Communication')}</h3><p class="muted">${new Date(c.created_at).toLocaleString()} · ${esc(c.sender||'School Administration')}</p><p>${esc(c.message).replace(/\n/g,'<br>')}</p></div>`).join(''):'<div class="muted">No school messages yet.</div>')}catch(e){panel.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button><p class="err">'+esc(e.message)+'</p>'}}
async function payroll(){openPanel();try{const d=await api('/api/payroll/my');panel.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button><h2>My Payroll</h2><p class="muted">Live payroll records for '+esc(d.staff.full_name||'Staff')+'. You can view only your own payroll.</p><div style="overflow:auto"><table><tr><th>Month</th><th>Gross</th><th>Deductions</th><th>Net Pay</th><th>Status</th><th>Payslip</th></tr>'+d.entries.map(x=>`<tr><td>${x.payroll_year}-${String(x.payroll_month).padStart(2,'0')}</td><td>KSh ${Number(x.gross_pay||0).toLocaleString()}</td><td>KSh ${Number(x.total_deductions||0).toLocaleString()}</td><td><b>KSh ${Number(x.net_pay||0).toLocaleString()}</b></td><td>${esc(x.status||x.period_status||'—')}</td><td><button onclick="downloadDoc('/api/documents/payslip/${x.id}','my-payslip-${x.payroll_year}-${x.payroll_month}.html')">Download</button></td></tr>`).join('')+'</table></div>'}catch(e){panel.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button><p class="err">'+esc(e.message)+'</p>'}}
</script><script src="/app-navigation.js?v=1.7.5"></script><script src="/navigation-templates.js?v=1.7.5"></script><script src="/online-module.js?v=1.6.0"></script></body></html>
