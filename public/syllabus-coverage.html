<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syllabus Coverage & Plans — your school</title><link rel="stylesheet" href="/styles.css?v=1.8.6"><link rel="stylesheet" href="/ui-polish.css?v=1.8.6"><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><style>
body{background:#f4f8f7}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.hero,.panel{background:#fff;border:1px solid #dfe7e3;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1720330a;margin-bottom:16px}.hero h1{margin:0 0 6px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;color:#344054}input,select,textarea{display:block;width:100%;margin-top:6px;box-sizing:border-box}textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#08623d;color:#fff}.btn.light{background:#eaf3ef;color:#075f3c}.btn.warn{background:#b54708;color:#fff}.btn.danger{background:#b42318;color:#fff}.bar{height:13px;background:#e5ece8;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#0a7a4b;width:0}.report{border:1px solid #dfe7e3;border-radius:13px;padding:14px;margin:10px 0}.report-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2f1}.status.approved{background:#e7f5ee;color:#075f3c}.status.rejected{background:#fdecec;color:#b42318}.status.pending{background:#fff4e5;color:#8a4b08}.small{font-size:12px}.error{color:#b42318}.ok{color:#075f3c;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Syllabus Coverage & Plans</b><span id="user"></span><button onclick="logout()">Logout</button></header><main class="wrap"><section class="hero"><h1>Syllabus Coverage & Teaching Plans</h1><p id="intro" class="muted">Subject teachers record syllabus progress, pending areas, challenges and their teaching plan for each assigned learning area and class.</p></section><div id="content"></div></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');let assignmentRows=[];let coverageReports=[];if(!token||!user||!['teacher','admin','director','principal','secretary'].includes(user.role))location.href='/';document.getElementById('user').textContent=(user.full_name||'')+' ('+(user.role||'')+')';
function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||'Request failed');return d})}function logout(){localStorage.clear();location.href='/'}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function download(id,name){try{const r=await fetch('/api/documents/syllabus-coverage/'+id+'?download=1',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name||'syllabus-coverage.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert(e.message)}}
function status(s){return '<span class="status '+esc(s)+'">'+esc(s)+'</span>'}
async function teacher(){const [as,reports]=await Promise.all([api('/api/syllabus-coverage/assignments'),api('/api/syllabus-coverage')]);assignmentRows=as;coverageReports=reports;content.innerHTML=`<section class="panel"><h2>Write Coverage Report</h2><p class="muted">One report is maintained per assigned learning area, class, term and academic year. Submitting an existing report updates it and sends it back for review.</p><form id="f"><div class="grid"><label>Assigned learning area / class<select id="assignment" required><option value="">Select assignment</option>${as.map(a=>`<option value="${a.id}">${esc(a.subject_name)} (${esc(a.subject_code)}) — ${esc(a.class_name)}</option>`).join('')}</select></label><label>Term<select id="term" required><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select></label><label>Academic year<input id="year" type="number" min="2000" max="2100" value="${new Date().getFullYear()}" required></label><label>Syllabus coverage (%)<input id="coverage" type="number" min="0" max="100" step="0.1" value="0" required><div class="bar"><i id="bar"></i></div><div class="small muted">Enter the approximate percentage of the planned syllabus completed.</div></label><label class="full">Topics / strands covered<textarea id="covered" placeholder="List the strands, topics or units already taught."></textarea></label><label class="full">Topics / strands pending<textarea id="pending" placeholder="List what remains to be taught or completed."></textarea></label><label>Challenges / gaps<textarea id="challenges" placeholder="Time, attendance, resources, learner gaps, timetable issues, etc."></textarea></label><label>Teaching plan / next steps<textarea id="plans" placeholder="What will you teach next and how will you complete the remaining syllabus?"></textarea></label><label>Resources needed<textarea id="resources" placeholder="Books, teaching aids, ICT, materials or support needed."></textarea></label><label>Target completion date<input id="target" type="date"></label><label class="full">Teacher comment<textarea id="comment" placeholder="Additional professional comments or recommendations."></textarea></label></div><div class="actions" style="margin-top:14px"><button class="btn" type="submit">Save & Submit for Review</button><span id="msg" class="muted"></span></div></form></section><section class="panel"><h2>My Reports</h2>${list(reports,true)}</section>`;const form=document.getElementById('f'),assignmentEl=document.getElementById('assignment'),termEl=document.getElementById('term'),yearEl=document.getElementById('year'),coverageEl=document.getElementById('coverage'),barEl=document.getElementById('bar');assignmentEl.onchange=loadExisting;termEl.onchange=loadExisting;yearEl.onchange=loadExisting;coverageEl.oninput=()=>barEl.style.width=Math.max(0,Math.min(100,Number(coverageEl.value)||0))+'%';form.onsubmit=e=>{e.preventDefault();submit()};coverageEl.oninput()}
async function loadExisting(){const a=Number(document.getElementById('assignment').value);if(!a)return;const asg=assignmentRows.find(x=>Number(x.id)===a);if(!asg)return;const row=coverageReports.find(r=>Number(r.subject_id)===Number(asg.subject_id)&&String(r.class_name).trim().toLowerCase()===String(asg.class_name).trim().toLowerCase()&&String(r.term).trim().toLowerCase()===String(document.getElementById('term').value).trim().toLowerCase()&&Number(r.academic_year)===Number(document.getElementById('year').value));const coverageEl=document.getElementById('coverage'),barEl=document.getElementById('bar');if(row){coverageEl.value=row.coverage_percent||0;document.getElementById('covered').value=row.topics_covered||'';document.getElementById('pending').value=row.topics_pending||'';document.getElementById('challenges').value=row.challenges||'';document.getElementById('plans').value=row.plans||'';document.getElementById('resources').value=row.resources_needed||'';document.getElementById('target').value=(row.target_completion_date||'').slice(0,10);document.getElementById('comment').value=row.teacher_comment||'';barEl.style.width=(Number(coverageEl.value)||0)+'%';document.getElementById('msg').textContent='Existing '+row.status+' report loaded.'}else{coverageEl.value=0;barEl.style.width='0%';['covered','pending','challenges','plans','resources','target','comment'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});document.getElementById('msg').textContent='New report for the selected learning area, term and year.'}}
async function submit(){const msgEl=document.getElementById('msg');msgEl.textContent='Saving…';try{const r=await api('/api/syllabus-coverage',{method:'POST',body:JSON.stringify({assignment_id:assignment.value,term:term.value,academic_year:year.value,coverage_percent:coverage.value,topics_covered:covered.value,topics_pending:pending.value,challenges:challenges.value,plans:plans.value,resources_needed:resources.value,target_completion_date:target.value,teacher_comment:comment.value})});msgEl.className='ok';msgEl.textContent='Report submitted for review.';await teacher()}catch(e){msgEl.className='error';msgEl.textContent=e.message}}
function list(rows,teacherMode){if(!rows.length)return '<p class="muted">No syllabus coverage reports submitted yet.</p>';return rows.map(r=>`<article class="report"><div class="report-head"><div><b>${esc(r.subject_name)}</b> <span class="muted">(${esc(r.subject_code||'')})</span><div class="muted small">${esc(r.class_name)} · ${esc(r.term)} · ${esc(r.academic_year)} · Teacher: ${esc(r.teacher_name)}</div></div><div>${status(r.status)} <b style="margin-left:8px">${Number(r.coverage_percent||0).toFixed(0)}%</b></div></div><details style="margin-top:10px"><summary>View report</summary><p><b>Covered:</b><br>${esc(r.topics_covered||'—').replace(/\n/g,'<br>')}</p><p><b>Pending:</b><br>${esc(r.topics_pending||'—').replace(/\n/g,'<br>')}</p><p><b>Challenges:</b><br>${esc(r.challenges||'—').replace(/\n/g,'<br>')}</p><p><b>Plan:</b><br>${esc(r.plans||'—').replace(/\n/g,'<br>')}</p><p><b>Resources:</b> ${esc(r.resources_needed||'—')}<br><b>Target:</b> ${esc(r.target_completion_date||'—')}</p><p><b>Teacher comment:</b><br>${esc(r.teacher_comment||'—').replace(/\n/g,'<br>')}</p>${r.review_note?`<p><b>Review note:</b> ${esc(r.review_note)}</p>`:''}</details><div class="actions" style="margin-top:10px">${r.status==='approved'?`<button class="btn light" onclick="download(${r.id},'${esc(r.subject_name)}-${esc(r.class_name)}-syllabus-coverage.pdf')">Download</button>`:''}${teacherMode&&r.status!=='approved'?`<button class="btn light" onclick="editReport(${r.id})">Edit / Resubmit</button>`:''}${!teacherMode&&['admin','director','principal'].includes(user.role)&&r.status!=='approved'?`<button class="btn" onclick="review(${r.id},'approved')">Approve</button>`:''}${!teacherMode&&['admin','director','principal'].includes(user.role)&&r.status!=='rejected'?`<button class="btn warn" onclick="review(${r.id},'rejected')">Reject</button>`:''}${!teacherMode&&['admin','director','principal'].includes(user.role)?`<button class="btn danger" onclick="del(${r.id})">Delete</button>`:''}</div></article>`).join('')}
async function editReport(id){const rows=await api('/api/syllabus-coverage');const r=rows.find(x=>Number(x.id)===Number(id));if(!r)return;const as=await api('/api/syllabus-coverage/assignments');const a=as.find(x=>Number(x.subject_id)===Number(r.subject_id)&&String(x.class_name).trim().toLowerCase()===String(r.class_name).trim().toLowerCase());if(a){assignment.value=a.id;term.value=r.term;year.value=r.academic_year;coverage.value=r.coverage_percent;covered.value=r.topics_covered||'';pending.value=r.topics_pending||'';challenges.value=r.challenges||'';plans.value=r.plans||'';resources.value=r.resources_needed||'';target.value=(r.target_completion_date||'').slice(0,10);comment.value=r.teacher_comment||'';bar.style.width=(Number(r.coverage_percent)||0)+'%';window.scrollTo({top:0,behavior:'smooth'})}}
async function review(id,status){let note='';if(status==='rejected'){note=prompt('Reason for rejection:')||'';if(!note.trim())return}try{await api('/api/syllabus-coverage/'+id,{method:'PATCH',body:JSON.stringify({status,review_note:note})});admin()}catch(e){alert(e.message)}}async function del(id){if(confirm('Delete this syllabus coverage report permanently?')){await api('/api/syllabus-coverage/'+id,{method:'DELETE'});admin()}}
async function admin(){const rows=await api('/api/syllabus-coverage');content.innerHTML=`<section class="panel"><div class="actions"><h2 style="margin-right:auto">Syllabus Coverage Reports</h2><button class="btn light" onclick="admin()">Refresh</button></div><p class="muted">Review syllabus progress and the plans submitted by subject teachers.</p>${list(rows,false)}</section>`}
async function init(){try{if(user.role==='teacher')return teacher();return admin()}catch(e){content.innerHTML='<section class="panel"><p class="error">'+esc(e.message)+'</p><button class="btn light" onclick="init()">Retry</button></section>'}}init();
</script><script src="/app-navigation.js?v=1.7.5"></script><script src="/navigation-templates.js?v=1.7.5"></script></body></html>
