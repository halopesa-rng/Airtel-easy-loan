<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Management — your school</title><link rel="stylesheet" href="/styles.css?v=1.5.8"><link rel="stylesheet" href="/ui-polish.css?v=1.5.8"><style>.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile{border:1px solid #dbe4ea;background:#fff;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}.tile .icon{font-size:28px}.tile small{color:#667085}.back{background:#0879a6;margin-bottom:12px}.detail{min-height:160px}.muted{color:#667085}.danger{background:#b42318}.success{background:#16803c}.mini{font-size:13px;padding:8px 10px}.payroll-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.payroll-card{background:linear-gradient(135deg,#0b63ce,#084b9b)!important;color:#fff!important;border:0!important;border-radius:16px!important;padding:18px!important;box-shadow:0 8px 22px rgba(11,99,206,.18)}.payroll-card .label{font-size:12px;opacity:.86;font-weight:700}.payroll-card .value{font-size:25px;font-weight:900;margin-top:7px}.payroll-card .sub{font-size:11px;opacity:.82;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions>*{margin:0}</style><link rel="stylesheet" href="/dashboard-polish.css?v=1.4.0"><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Admin Management</b><span id="user"></span><button onclick="location.href='/review-centre.html'">🔔 Review Centre</button><button onclick="logout()">Logout</button></header><main><section class="card hero"><div><h1 style="margin:0">School Management Control</h1><p class="muted">Open a module to manage or review the school. Detailed tools load only when selected.</p></div><div id="quick"></div></section><div id="tiles" class="tiles"></div><section id="detail" class="card detail" hidden><h2 id="title">Admin Control Centre</h2><p id="body" class="muted">Choose a module above.</p></section></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user||user.role!=='admin')location.href='/';document.getElementById("user").textContent=user.full_name+' (Admin)';function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(r.status===401){localStorage.clear();location.href='/';throw Error('Session expired. Please sign in again.')}if(!r.ok)throw Error(d.error||('Request failed ('+r.status+')'));return d})}function downloadSelectedFeesReport(){const period=document.getElementById('feePeriod')?.value||'all';let url='/api/documents/fees?period='+encodeURIComponent(period);let name='fees-analysis.html';if(period==='monthly'){const m=document.getElementById('feeMonth')?.value;if(!m)return alert('Select a month first.');url+='&month='+encodeURIComponent(m);name='fees-'+m+'.html'}else if(period==='termly'){const y=document.getElementById('feeYear')?.value,t=document.getElementById('feeTerm')?.value;url+='&academic_year='+encodeURIComponent(y)+'&term='+encodeURIComponent(t);name='fees-'+t.replace(/\s+/g,'-').toLowerCase()+'-'+y+'.html'}downloadDoc(url,name)}function toggleFeePeriod(){const p=document.getElementById('feePeriod')?.value||'all';document.getElementById('feeMonth').style.display=p==='monthly'?'block':'none';document.getElementById('feeYear').style.display=p==='termly'?'block':'none';document.getElementById('feeTerm').style.display=p==='termly'?'block':'none'}
function logout(){localStorage.clear();location.href='/'}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function table(h,rows){return '<div style="overflow:auto"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.join('')+'</table></div>'}async function downloadDoc(url,filename){try{const sep=url.includes("?")?"&":"?";const r=await fetch(url+sep+"download=1",{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename||'school-document.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert(e.message)}}
function downloadSelectedTermReport(){const st=document.getElementById("rs")?.value,y=document.getElementById("termReportYear")?.value,t=document.getElementById("termReportTerm")?.value;if(!st||!y||!t)return alert("Select a student, academic year and term first.");downloadDoc("/api/documents/term-report/"+encodeURIComponent(st)+"?download=html&academic_year="+encodeURIComponent(y)+"&term="+encodeURIComponent(t),"term-report-"+t.replace(/\s+/g,"-").toLowerCase()+"-"+y+".pdf")} 
const modules=[['users','👥','Users','Accounts, roles and access'],['students','🎓','Students','Register, parent links and classes'],['academics','📝','Academics','Exams and CBC assessments'],['learning-areas','📘','Learning Areas','Add, edit and manage learning area codes'],['assignments','👩‍🏫','Teacher Assignments','Subject/class responsibilities'],['exam-bank','📚','Exam Bank','CBC question bank'],['exam-resources','📎','Exam Files','Review, approve and archive exam papers'],['subject-reports','🧑‍🏫','Student Subject Reports','Review, approve, reject, delete and download learner reports'],['syllabus-coverage','📘','Syllabus Coverage & Plans','Review teacher syllabus coverage, challenges and plans'],['tafhid','🕌','Tahfidh Programme','Halaqahs, Ustadhs, learners and Tahfidh marks'],['fees','💰','Finance','Fees and expenditure oversight'],['expenditure-requests','💳','Expenditure Requests','Send payment requests to the Director'],['leave','📄','My Leave Out','Request leave and download approval'],['attendance','🕘','My Sign In / Out','Daily staff attendance'],['payroll','💼','Professional Payroll','Staff salaries, deductions, payroll runs and payslips'],['cleanup','🧹','Test Data Cleanup','Remove data entered during testing while preserving accounts'],['documents','📄','School Documents','Download official school records'],['assets','🏫','Assets','School property and resources'],['communication','📢','Communication','Send targeted messages to students, parents and staff'],['audit','🛡️','Activity Log','System actions and accountability'],['readiness','✅','Production Readiness','System status, mode and final checks'],['subscription','💳','Subscription','View invoice and pay developer subscription via Till 1677484']];tiles.innerHTML=modules.map(m=>`<button class="tile" onclick="openModule('${m[0]}')"><span class="icon">${m[1]}</span><b>${m[2]}</b><small>${m[3]}</small><span>Open details →</span></button>`).join('');
async function examResources(){let [r,p]=await Promise.all([api('/api/exam-resources'),api('/api/exam-resources/purchases')]);shell('Exam Files & Resource Store','Review teacher-submitted exam papers, approve/reject/delete/download them and manage KSh 100 student download payments.',table(['Exam','Class','Learning Area','Uploader','Status','Actions'],r.map(x=>`<tr><td>${esc(x.title)}<br><small>${esc(x.original_filename)}</small></td><td>${esc(x.class_name)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.uploader)}</td><td>${esc(x.status)}</td><td><button class="mini" onclick="downloadDoc('/api/exam-resources/${x.id}/download','${esc(x.original_filename)}')">Download</button> ${x.status!=='approved'?`<button class="mini success" onclick="reviewResource(${x.id},'approved')">Approve</button>`:''} ${x.status!=='rejected'?`<button class="mini" onclick="reviewResource(${x.id},'rejected')">Reject</button>`:''} <button class="mini danger" onclick="deleteResource(${x.id})">Delete</button></td></tr>`))+`<h3 style="margin-top:18px">Student download payments</h3>`+table(['Student','Exam','Amount','Method','Reference','Status','Action'],p.map(x=>`<tr><td>${esc(x.student_name)} (${esc(x.admission_no)})</td><td>${esc(x.title)}</td><td>KSh ${Number(x.amount).toLocaleString()}</td><td>${esc(x.payment_method||'—')}</td><td>${esc(x.reference||'—')}</td><td>${esc(x.status)}</td><td>${x.status==='pending'?`<button class="mini success" onclick="reviewPurchase(${x.id},'paid')">Approve Payment</button><button class="mini danger" onclick="reviewPurchase(${x.id},'rejected')">Reject</button>`:'—'}</td></tr>`)))}
async function reviewResource(id,status){await api('/api/exam-resources/'+id,{method:'PATCH',body:JSON.stringify({status,review_note:status==='rejected'?(prompt('Reason')||'Rejected by reviewer'):''})});examResources()}
async function deleteResource(id){if(confirm('Delete this exam file permanently?')){await api('/api/exam-resources/'+id,{method:'DELETE'});examResources()}}
async function reviewPurchase(id,status){await api('/api/exam-resources/purchases/'+id,{method:'PATCH',body:JSON.stringify({status,review_note:status==='rejected'?(prompt('Reason')||'Payment rejected'):''})});examResources()}
async function load(){try{let d=await api('/api/dashboard');quick.innerHTML=`<span class="muted">${d.students} students · ${d.exams} exams · KSh ${d.fees_received.toLocaleString()} received</span>`}catch(e){quick.textContent=e.message}}load();
function shell(title,html){const detail=document.getElementById('detail');document.getElementById('title').textContent=title;document.getElementById('body').innerHTML='<button type="button" class="gs-back" onclick="backToDashboard()">← Back to dashboard</button>'+html;document.getElementById('tiles').hidden=true;document.querySelector('.hero').hidden=true;detail.hidden=false;}
function backToDashboard(){document.getElementById('detail').hidden=true;document.getElementById('tiles').hidden=false;document.querySelector('.hero').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
async function openModule(n){if(n==='tafhid'){location.href='/tahfidh.html';return}if(n==='subscription'){location.href='/subscription.html';return}try{if(n==='users')return users();if(n==='learning-areas')return learningAreas();if(n==='students')return students();if(n==='academics')return academics();if(n==='assignments')return assignments();if(n==='exam-bank')return examBank();if(n==='exam-resources')return examResources();if(n==='subject-reports')return location.href='/subject-reports.html';if(n==='syllabus-coverage')return location.href='/syllabus-coverage.html';if(n==='fees')return fees();if(n==='expenditure-requests')return expenditureRequests();if(n==='leave')return leave();if(n==='attendance')return attendance();if(n==='payroll')return payroll();if(n==='cleanup')return cleanup();if(n==='documents')return documents();if(n==='assets')return assets();if(n==='communication')return communication();if(n==='audit')return audit();if(n==='readiness')return readiness()}catch(e){shell('Error',`<p class="err">${esc(e.message)}</p>`)}}
async function users(){let d=await api('/api/users');shell('User Management',`<div class="card"><h3>Create account</h3><form id="uf" class="grid"><input id="un" placeholder="Username" required><input id="pw" type="password" placeholder="Password" required><input id="fn" placeholder="Full name" required><select id="rl">${[['admin','Admin'],['director','Director'],['principal','Principal'],['secretary','Secretary'],['teacher','Teacher'],['ustadh','Ustadh'],['patron','Patron / Boarding Master'],['student','Student'],['parent','Parent'],['worker','Worker']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><input id="ph" placeholder="Phone"><input id="em" placeholder="Email"><button>Create User</button></form></div>`+table(['Name','Username','Role','Status','Actions'],d.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${x.active?'Active':'Inactive'}</td><td><button class="mini" onclick="toggleUser(${x.id},${x.active})">${x.active?'Deactivate':'Activate'}</button> <button class="mini" onclick="resetPass(${x.id})">Password</button> ${x.id!==user.id?'<button class="mini danger" data-id="'+x.id+'" onclick="deleteUser(this.dataset.id)">Delete</button>':''}</td></tr>`)));uf.onsubmit=async e=>{e.preventDefault();const btn=uf.querySelector('button[type=submit],button:last-child');try{if(btn)btn.disabled=true;await api('/api/users',{method:'POST',body:JSON.stringify({username:un.value.trim(),password:pw.value,full_name:fn.value.trim(),role:rl.value,phone:ph.value.trim(),email:em.value.trim()})});alert(`${rl.options[rl.selectedIndex].text} account created successfully.`);uf.reset();users()}catch(err){alert(err.message)}finally{if(btn)btn.disabled=false}}}
async function toggleUser(id,a){await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:!a})});users()}async function resetPass(id){let p=prompt('Enter new password');if(p){await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({password:p})});alert('Password changed')}}async function deleteUser(id){if(confirm('Delete this account?')){await api('/api/users/'+id,{method:'DELETE'});users()}}
async function students(){let [d,c]=await Promise.all([api('/api/students'),api('/api/classes')]);const classOpts=c.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');const form=`<div class="card"><h3>Register Student</h3><form id="sf" class="grid"><input id="sa" placeholder="Admission No." required><input id="sn" placeholder="Student full name" required><input id="sass" placeholder="Assessment No."><input id="sbc" placeholder="Birth Certificate No."><select id="sc" required><option value="">Select class</option>${classOpts}</select><input id="ss" placeholder="Stream"><select id="sg"><option value="">Gender</option><option>Male</option><option>Female</option></select><input id="sd" type="date" title="Date of birth"><input id="spn" placeholder="Parent / Guardian name"><input id="spp" placeholder="Parent / Guardian phone"><button type="submit">Add Student</button></form></div>`;const rows=x=>x.map(y=>`<tr><td>${esc(y.admission_no)}</td><td><b>${esc(y.full_name)}</b><br><small>${esc(y.assessment_number||'')} · ${esc(y.birth_certificate_number||'')}</small></td><td>${esc(y.class_name)}</td><td>${esc(y.stream||'')}</td><td>${esc(y.parent_name||'')}<br>${esc(y.parent_phone||'')}</td><td><button class="mini" onclick="editStudent(${y.id})">Edit</button> <button class="mini danger" onclick="delStudent(${y.id})">Delete</button></td></tr>`);shell('Student Management',form+`<div class="actions"><input id="sq" placeholder="Search name/admission" style="max-width:300px"><select id="classFilter"><option value="">All classes</option>${classOpts}</select><button type="button" onclick="downloadDoc('/api/documents/students','whole-school-register.html')">Download Whole School Register</button><button type="button" onclick="downloadClassRegister()">Download Class Register</button></div><div id="studentTable">${table(['Admission','Student / IDs','Class','Stream','Parent / Contact','Actions'],rows(d))}</div>`);sf.onsubmit=async e=>{e.preventDefault();try{await api('/api/students',{method:'POST',body:JSON.stringify({admission_no:sa.value.trim(),full_name:sn.value.trim(),assessment_number:sass.value.trim(),birth_certificate_number:sbc.value.trim(),class_name:sc.value,stream:ss.value.trim(),gender:sg.value,date_of_birth:sd.value,parent_name:spn.value.trim(),parent_phone:spp.value.trim()})});alert('Student registered successfully.');students()}catch(err){alert(err.message)}};async function refresh(){let q=sq.value.trim(),cl=classFilter.value;let url='/api/students?q='+encodeURIComponent(q);if(cl)url+='&class_name='+encodeURIComponent(cl);let x=await api(url);studentTable.innerHTML=table(['Admission','Student / IDs','Class','Stream','Parent / Contact','Actions'],rows(x))}sq.oninput=refresh;classFilter.onchange=refresh;window.downloadClassRegister=()=>{const cl=classFilter.value;if(!cl)return alert('Select a class first.');downloadDoc('/api/documents/class-register?class_name='+encodeURIComponent(cl),cl.replace(/\s+/g,'-').toLowerCase()+'-class-register.html')};window.editStudent=async id=>{const x=await api('/api/students/'+id);const fields=[['Admission No.','admission_no'],['Student name','full_name'],['Assessment No.','assessment_number'],['Birth Certificate No.','birth_certificate_number'],['Class','class_name'],['Stream','stream'],['Gender','gender'],['Date of birth','date_of_birth'],['Parent / Guardian name','parent_name'],['Parent / Guardian phone / Link ID','parent_phone']];const v={};for(const [label,key] of fields){const val=prompt(label+':',x[key]||'');if(val===null)return;v[key]=val.trim()}try{await api('/api/students/'+id,{method:'PATCH',body:JSON.stringify(v)});alert('Student updated successfully.');students()}catch(e){alert(e.message)}}}
async function learningAreas(){try{const rows=await api('/api/subjects');const form=`<div class="card"><h3>Add Learning Area</h3><p class="muted">Use the learning areas from the school programme. Code is required and must be unique.</p><form id="laf" class="grid"><input id="lac" placeholder="Code e.g. ENG" maxlength="20" required><input id="lan" placeholder="Learning area e.g. English Activities" required><input id="lal" placeholder="Applicable classes e.g. PP1, PP2, Grade 1, Grade 2, Grade 3"><input id="lam" type="number" min="1" value="100" placeholder="Maximum marks"><button>Add Learning Area</button></form></div>`;const tr=rows.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(x.levels||'All classes')}</td><td>${x.max_marks||100}</td><td><button class="mini" onclick="editLearningArea(${x.id})">Edit</button> <button class="mini danger" onclick="deleteLearningArea(${x.id})">Delete</button></td></tr>`);shell('Learning Areas',form+table(['Code','Learning Area','Applicable Classes','Max Marks','Actions'],tr));laf.onsubmit=async e=>{e.preventDefault();try{await api('/api/subjects',{method:'POST',body:JSON.stringify({code:lac.value.trim().toUpperCase(),name:lan.value.trim(),levels:lal.value.trim(),max_marks:Number(lam.value||100)})});alert('Learning area added successfully.');learningAreas()}catch(err){alert(err.message)}}}catch(e){shell('Learning Areas','<div class="err">Unable to load learning areas: '+esc(e.message)+'</div>')}}async function editLearningArea(id){try{const x=(await api('/api/subjects')).find(a=>Number(a.id)===Number(id));if(!x)return alert('Learning area not found.');const code=prompt('Learning area code:',x.code||'');if(code===null)return;const name=prompt('Learning area name:',x.name||'');if(name===null)return;const levels=prompt('Applicable classes:',x.levels||'');if(levels===null)return;const max=prompt('Maximum marks:',x.max_marks||100);if(max===null)return;await api('/api/subjects/'+id,{method:'PATCH',body:JSON.stringify({code:code.trim().toUpperCase(),name:name.trim(),levels:levels.trim(),max_marks:Number(max)})});alert('Learning area updated successfully.');learningAreas()}catch(e){alert(e.message)}}async function deleteLearningArea(id){if(!confirm('Delete this learning area? Existing marks and assignments using it will also be removed.'))return;try{await api('/api/subjects/'+id,{method:'DELETE'});learningAreas()}catch(e){alert(e.message)}}
async function academics(){const e=await api('/api/exams');const form=`<div class="card"><h3>Manage Examinations</h3><form id="examForm" class="grid"><input id="examName" placeholder="Exam name e.g. Term 2 Assessment" required><select id="examTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><input id="examYear" type="number" value="${new Date().getFullYear()}" min="2000" required><input id="examDate" type="date"><button type="submit">Add Examination</button></form><p class="muted">Admin can create, edit and delete examinations. Existing marks remain linked to the examination unless the examination itself is deleted.</p></div>`;const rows=e.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.term||'')}</td><td>${x.academic_year||''}</td><td>${esc(x.exam_date||'—')}</td><td><button class="mini" onclick="editExam(${x.id})">Edit</button> <button class="mini" onclick="analyticsExam(${x.id})">Analysis</button> <button class="mini danger" onclick="deleteExam(${x.id})">Delete</button></td></tr>`);shell('Academics & Examination Management',form+table(['Exam','Term','Year','Exam Date','Actions'],rows)||'<p class="muted">No examinations have been created.</p>');examForm.onsubmit=async ev=>{ev.preventDefault();try{await api('/api/exams',{method:'POST',body:JSON.stringify({name:examName.value.trim(),term:examTerm.value,academic_year:examYear.value,exam_date:examDate.value||null})});alert('Examination added successfully.');academics()}catch(err){alert(err.message)}}}async function editExam(id){const x=await api('/api/exams');const e=x.find(a=>Number(a.id)===Number(id));if(!e)return alert('Exam not found');const name=prompt('Exam name:',e.name);if(name===null)return;const term=prompt('Term (Term 1, Term 2 or Term 3):',e.term||'');if(term===null)return;const year=prompt('Academic year:',e.academic_year||new Date().getFullYear());if(year===null)return;const date=prompt('Exam date (YYYY-MM-DD, optional):',e.exam_date||'');if(date===null)return;try{await api('/api/exams/'+id,{method:'PATCH',body:JSON.stringify({name:name.trim(),term:term.trim(),academic_year:Number(year),exam_date:date||null})});alert('Examination updated successfully.');academics()}catch(err){alert(err.message)}}async function deleteExam(id){if(!confirm('Delete this examination? Any marks linked to it will also be deleted. This cannot be undone.'))return;try{await api('/api/exams/'+id,{method:'DELETE'});alert('Examination deleted.');academics()}catch(err){alert(err.message)}}
async function analyticsExam(id){let d=await api('/api/analytics/exams/'+id);shell('Exam Analysis',table(['Class','Students','Marks','Average','EE','ME','AE','BE'],d.byClass.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${x.students}</td><td>${x.marks}</td><td>${x.average}</td><td>${x.ee}</td><td>${x.me}</td><td>${x.ae}</td><td>${x.be}</td></tr>`))+table(['Learning Area','Entries','Average','EE','ME','AE','BE'],d.bySubject.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.entries}</td><td>${x.average}</td><td>${x.ee}</td><td>${x.me}</td><td>${x.ae}</td><td>${x.be}</td></tr>`)))}
async function assignments(){let [a,t,s,c]=await Promise.all([api('/api/teacher-assignments'),api('/api/users'),api('/api/subjects'),api('/api/classes')]);let teachers=t.filter(x=>x.role==='teacher');shell('Teacher Assignments',`<div class="card"><h3>Assign responsibility</h3><form id="af" class="grid"><select id="at">${teachers.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select><select id="ac">${c.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="atype"><option value="subject">Subject Teacher</option><option value="class_teacher">Class Teacher</option></select><select id="as"><option value="">Select learning area</option>${s.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select><button>Save Assignment</button></form><p class="muted">A subject teacher can enter marks only for the assigned learning area and class. A class teacher can download result slips and class merit lists.</p></div>`+table(['Teacher','Type','Class','Learning Area','Action'],a.map(x=>`<tr><td>${esc(x.teacher_name)}</td><td>${esc(x.assignment_type)}</td><td>${esc(x.class_name)}</td><td>${esc(x.subject_name||'—')}</td><td><button class="mini danger" onclick="removeAssignment(${x.id})">Remove</button></td></tr>`)));atype.onchange=()=>{as.disabled=atype.value==='class_teacher';if(as.disabled)as.value=''};af.onsubmit=async e=>{e.preventDefault();await api('/api/teacher-assignments',{method:'POST',body:JSON.stringify({teacher_id:at.value,class_name:ac.value,assignment_type:atype.value,subject_id:as.value||null})});assignments()}}
async function removeAssignment(id){if(confirm('Remove assignment?')){await api('/api/teacher-assignments/'+id,{method:'DELETE'});assignments()}}
async function examBank(){let [q,s,c]=await Promise.all([api('/api/exam-bank'),api('/api/subjects'),api('/api/classes')]);shell('Exam Bank',`<div class="card"><h3>Add CBC Question</h3><form id="qf" class="grid"><select id="qs">${s.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select><select id="qc">${c.map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="qt" placeholder="Term"><input id="topic" placeholder="Topic"><select id="qtype"><option>Short Answer</option><option>Multiple Choice</option><option>Structured</option><option>Practical</option></select><input id="marks" type="number" min="1" value="1" placeholder="Marks"><textarea id="qq" placeholder="Question" required style="grid-column:1/-1;min-height:90px"></textarea><input id="oa" placeholder="Option A"><input id="ob" placeholder="Option B"><input id="oc" placeholder="Option C"><input id="od" placeholder="Option D"><input id="ans" placeholder="Answer"><button>Add to Exam Bank</button></form></div>`+table(['Class','Learning Area','Topic','Type','Question','Marks','Action'],q.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.topic)}</td><td>${esc(x.question_type)}</td><td>${esc(x.question_text)}</td><td>${x.marks}</td><td><button class="mini danger" onclick="deleteQuestion(${x.id})">Delete</button></td></tr>`)));qf.onsubmit=async e=>{e.preventDefault();await api('/api/exam-bank',{method:'POST',body:JSON.stringify({subject_id:qs.value,class_name:qc.value,term:qt.value,topic:topic.value,question_type:qtype.value,question_text:qq.value,option_a:oa.value,option_b:ob.value,option_c:oc.value,option_d:od.value,answer:ans.value,marks:marks.value})});examBank()}}
async function deleteQuestion(id){if(confirm('Delete question?')){await api('/api/exam-bank/'+id,{method:'DELETE'});examBank()}}

async function expenditureRequests(){const d=await api('/api/expenditure-requests');shell('Expenditure Requests',`<div class="card"><h3>Send Payment Request to Director</h3><p class="muted">Do not make the payment until the Director approves the request.</p><form id="xf" class="grid"><input id="xc" placeholder="Category"><input id="xd" placeholder="Description" required><input id="xa" type="number" placeholder="Amount" required><select id="xm"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Cheque</option></select><button>Send to Director</button></form></div>`+table(['Date','Category','Description','Amount','Method','Status','Action'],d.map(x=>`<tr><td>${esc(x.requested_date)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td>KSh ${Number(x.amount).toLocaleString()}</td><td>${esc(x.payment_method)}</td><td>${esc(x.status)}</td><td>${x.status==='approved'?`<button onclick="payReq(${x.id})">Make / Record Payment</button>`:'—'}</td></tr>`)));xf.onsubmit=async e=>{e.preventDefault();await api('/api/expenditure-requests',{method:'POST',body:JSON.stringify({category:xc.value,description:xd.value,amount:xa.value,payment_method:xm.value})});alert('Request sent to Director.');expenditureRequests()}}async function payReq(id){const ref=prompt('Payment reference/receipt (optional):')||'';await api('/api/expenditure-requests/'+id+'/pay',{method:'POST',body:JSON.stringify({reference:ref})});alert('Payment recorded.');expenditureRequests()}
async function leave(){const d=await api('/api/leave-requests');shell('My Leave Out',`<form id="lf" class="grid"><select id="lt"><option>Annual Leave</option><option>Sick Leave</option><option>Personal Leave</option><option>Emergency Leave</option><option>Other</option></select><input id="ls" type="date" required><input id="le" type="date" required><textarea id="lr" placeholder="Reason" required style="grid-column:1/-1"></textarea><button>Submit to Director</button></form>`+table(['Type','Dates','Status','Letter'],d.map(x=>`<tr><td>${esc(x.leave_type)}</td><td>${esc(x.start_date)} to ${esc(x.end_date)}</td><td>${esc(x.status)}</td><td>${x.status==='approved'?`<button onclick="downloadDoc('/api/documents/leave/${x.id}','approved-leave-out-letter.html')">Download Letter</button>`:'—'}</td></tr>`)));lf.onsubmit=async e=>{e.preventDefault();await api('/api/leave-requests',{method:'POST',body:JSON.stringify({leave_type:lt.value,start_date:ls.value,end_date:le.value,reason:lr.value})});alert('Leave request sent.');leave()}}
async function attendance(){const d=await api('/api/staff-attendance/my');shell('My Sign In / Out',`<div class="actions"><button onclick="checkIn()">✓ Sign In Now</button><button onclick="checkOut()">↪ Sign Out Now</button></div>`+table(['Date','Sign In','Sign Out'],d.map(x=>`<tr><td>${esc(x.attendance_date)}</td><td>${x.check_in?new Date(x.check_in).toLocaleTimeString():'—'}</td><td>${x.check_out?new Date(x.check_out).toLocaleTimeString():'—'}</td></tr>`)))}async function checkIn(){try{await api('/api/staff-attendance/check-in',{method:'POST'});alert('Signed in.');attendance()}catch(e){alert(e.message)}}async function checkOut(){try{await api('/api/staff-attendance/check-out',{method:'POST'});alert('Signed out.');attendance()}catch(e){alert(e.message)}}
async function fees(){let [o,f]=await Promise.all([api('/api/analytics/overview'),api('/api/analytics/fees')]);shell('Finance & Fees',`<div class="grid"><div class="card">Charged<div class="stat">KSh ${o.feesCharged.toLocaleString()}</div></div><div class="card">Paid<div class="stat">KSh ${o.feesPaid.toLocaleString()}</div></div><div class="card">Outstanding<div class="stat">KSh ${o.balance.toLocaleString()}</div></div><div class="card">Expenditure<div class="stat">KSh ${o.expenditure.toLocaleString()}</div></div></div><div class="actions"><button onclick="downloadDoc('/api/documents/fees','school-fees-analysis.html')">Download Fees Analysis</button><button onclick="downloadDoc('/api/documents/expenditures','school-expenditure-report.html')">Download Expenditure Report</button></div>`+table(['Class','Students','Charged','Paid','Balance'],f.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${x.students}</td><td>KSh ${x.charged.toLocaleString()}</td><td>KSh ${x.paid.toLocaleString()}</td><td>KSh ${x.balance.toLocaleString()}</td></tr>`)))}
async function documents(){let [e,c,s]=await Promise.all([api('/api/exams'),api('/api/classes'),api('/api/students')]);shell('Official School Documents',`<div class="card"><h3>General school documents</h3><div class="actions"><button onclick="downloadDoc('/api/documents/students','whole-school-register.html')">Whole School Register</button><button onclick="downloadDoc('/api/documents/fees','fees-analysis.html')">Fees Analysis</button><button onclick="downloadDoc('/api/documents/expenditures','expenditure-report.html')">Expenditure Report</button><button onclick="downloadDoc('/api/secretary/fees-document','fees-payment-records.html')">Fees Payment Records</button></div></div><div class="card"><h3>Class merit list</h3><div class="grid"><select id="de">${e.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.term)} ${x.academic_year}</option>`).join('')}</select><select id="dc">${c.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button onclick="downloadDoc('/api/documents/merit/'+de.value+'?class_name='+encodeURIComponent(dc.value),'merit-list.html')">Download Class Merit List</button></div></div><div class="card"><h3>Student CBC result slip</h3><div class="grid"><select id="re">${e.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.term)} ${x.academic_year}</option>`).join('')}</select><select id="rs">${s.map(x=>`<option value="${x.id}">${esc(x.admission_no)} — ${esc(x.full_name)} — ${esc(x.class_name)}</option>`).join('')}</select><button onclick="downloadDoc('/api/documents/result/'+re.value+'/'+rs.value,'result-slip.html')">Download Result Slip</button></div><div class="grid" style="margin-top:10px"><input id="termReportYear" type="number" min="2000" max="2100" value="${new Date().getFullYear()}" placeholder="Academic year"><select id="termReportTerm"><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select><button onclick="downloadSelectedTermReport()">Print Full Term Report</button></div><p class="muted" style="margin:8px 0 0">Choose the academic year and Term 1, Term 2 or Term 3. The report combines Opener, Mid and End assessments for that term.</p></div>`)}
async function payroll(){try{const periods=await api('/api/payroll/periods');shell('Staff Payroll — View Only','<p class="muted">Admin can view and download payroll. Preparation and approval are handled by the Secretary/Principal and Director.</p>'+table(['Period','Status','Action'],periods.map(x=>`<tr><td>${x.payroll_year}-${String(x.payroll_month).padStart(2,'0')}</td><td>${esc(x.status)}</td><td><button onclick="openPayroll(${x.id})">View</button> <button onclick="downloadDoc('/api/documents/payroll/${x.id}','payroll-${x.payroll_year}-${x.payroll_month}.html')">Download</button></td></tr>`)))}catch(e){shell('Payroll',`<p class="err">${esc(e.message)}</p>`)}}
async function openPayroll(id){const d=await api('/api/payroll/periods/'+id);const rows=d.entries.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.role)}${x.staff_category?' — '+esc(x.staff_category):''}</td><td>KSh ${Number(x.gross_pay).toLocaleString()}</td><td>KSh ${Number(x.total_deductions).toLocaleString()}</td><td><b>KSh ${Number(x.net_pay).toLocaleString()}</b></td><td>${esc(x.status)}</td><td>${x.status!=='paid'?`<button onclick="editPayrollEntry(${x.id})">Edit</button>`:''} <button onclick="downloadDoc('/api/documents/payslip/${x.id}','payslip-${x.id}.html')">Payslip</button></td></tr>`).join('');shell('Payroll — '+d.period.payroll_year+'-'+String(d.period.payroll_month).padStart(2,'0'),'<div class="actions"><button onclick="downloadDoc(\'/api/documents/payroll/'+id+'\',\'payroll-'+d.period.payroll_year+'-'+d.period.payroll_month+'.html\')">Download Payroll</button></div>'+table(['Staff','Role','Gross','Deductions','Net','Status','Actions'],rows));}
async function editPayrollEntry(id){const d=await api('/api/payroll/periods');let found=null;for(const p of d){const x=await api('/api/payroll/periods/'+p.id);found=x.entries.find(e=>Number(e.id)===Number(id));if(found)break}if(!found)return alert('Payroll entry not found');const v={};for(const k of ['basic_salary','house_allowance','transport_allowance','other_allowance','tax_deduction','pension_deduction','other_deduction']){const n=prompt(k.replaceAll('_',' ')+':',found[k]);if(n===null)return;v[k]=Number(n)}const notes=prompt('Payroll note (optional):',found.notes||'')||'';await api('/api/payroll/entries/'+id,{method:'PATCH',body:JSON.stringify({...v,notes})});alert('Payroll entry updated.');openPayroll(found.period_id)}
async function setPayrollStatus(id,status){if(!confirm(`Set payroll status to ${status}?`))return;await api('/api/payroll/periods/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});payroll()}
async function cleanup(){try{const st=await api('/api/system/status');const locked=st.mode==='production';shell('Test Data Cleanup',`<div class="card"><h3>Remove testing data</h3><div class="status-banner ${locked?'danger':'success'}"><b>System mode: ${esc(st.mode.toUpperCase())}</b><p>${locked?'Cleanup is locked because Production Mode is active.':'Demo/Test Mode is active. Cleanup is available to Admin.'}</p></div><p class="muted">User accounts are never deleted by this tool. In Production Mode the cleanup endpoint is disabled.</p><div class="grid">${[['students','Student records','students'],['marks','Student marks','marks'],['fees','Fee payments','fees'],['charges','Fee charges','charges'],['exams','Examinations','exams'],['attendance','Staff attendance','attendance'],['expenditures','Expenditures','expenditures'],['leave','Leave requests','leave'],['exam_bank','Exam bank questions','exam_bank'],['exam_resources','Exam files','exam_resources'],['purchases','Exam file purchases','purchases'],['announcements','Announcements','announcements'],['assets','Assets','assets'],['payroll','Payroll records','payroll'],['reports','Subject reports','reports'],['tafhid','Tahfidh programme','tafhid'],['assignments','Teacher assignments','assignments']].map(x=>`<label><input type="checkbox" class="cleanup-item" value="${x[2]}" ${locked?'disabled':''}> ${x[1]}</label>`).join('')}</div><p><input id="cleanupConfirm" placeholder="Type DELETE TEST DATA exactly" style="width:100%;padding:10px" ${locked?'disabled':''}></p><div class="actions"><button class="danger" onclick="clearTestData()" ${locked?'disabled':''}>Permanently Remove Selected Data</button><button onclick="toggleMode('${locked?'demo':'production'}')">${locked?'Switch to Demo/Test Mode':'Enable Production Mode'}</button></div></div>`)}catch(e){shell('Test Data Cleanup','<p class="err">'+esc(e.message)+'</p>')}}
async function toggleMode(mode){if(mode==='production'&&!confirm('Enable Production Mode? Test-data deletion will be disabled until you switch back to Demo/Test Mode.'))return;try{const r=await api('/api/system/mode',{method:'PATCH',body:JSON.stringify({mode})});alert(r.message);cleanup()}catch(e){alert(e.message)}}
async function clearTestData(){const items=[...document.querySelectorAll('.cleanup-item:checked')].map(x=>x.value);if(!items.length)return alert('Select at least one category.');if(cleanupConfirm.value!=='DELETE TEST DATA')return alert('Type DELETE TEST DATA exactly.');if(!confirm('This permanently removes the selected data. Continue?'))return;try{const r=await api('/api/system/clear-test-data',{method:'POST',body:JSON.stringify({tables:items,confirmation:cleanupConfirm.value})});alert(r.message);cleanup()}catch(e){alert(e.message)}}
async function readiness(){try{const s=await api('/api/system/status');const c=s.counts;const checks=[['Database connection',true,'Connected'],['User accounts',c.users>0,`${c.users} accounts`],['Student records',true,`${c.students} records`],['Examinations',true,`${c.exams} exams`],['Marks',true,`${c.marks} marks`],['Fees',true,`${c.fees+c.charges} fee records/charges`],['Payroll',true,`${c.payroll} payroll entries`],['Communication',true,`${c.communications} messages`],['Tahfidh',true,`${c.tafhid} assessments`],['Production lock',s.mode==='production',s.mode==='production'?'Enabled':'Demo/Test mode']];shell('Production Readiness',`<div class="card"><h3>your school v${esc(s.version)}</h3><p class="muted">Final system health and production controls.</p>${table(['Check','Status','Details'],checks.map(x=>`<tr><td>${esc(x[0])}</td><td><b>${x[1]?'READY':'ATTENTION'}</b></td><td>${esc(x[2])}</td></tr>`))}</div><div class="card"><h3>Operational controls</h3><p><b>School payment number:</b> ${esc(s.payment_number)}</p><p><b>Developer contact:</b> ${esc(s.developer_number)}</p><p class="muted">Before live use: confirm database backups, verify role permissions, clear test data in Demo/Test Mode, then enable Production Mode.</p><button onclick="toggleMode('${s.mode==='production'?'demo':'production'}')">${s.mode==='production'?'Switch to Demo/Test Mode':'Enable Production Mode'}</button></div>`)}catch(e){shell('Production Readiness','<p class="err">'+esc(e.message)+'</p>')}}
async function assets(){let d=await api('/api/assets');shell('Asset Management',table(['Code','Asset','Category','Qty','Condition','Location','Value','Action'],d.map(x=>`<tr><td>${esc(x.asset_code)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${x.quantity}</td><td>${esc(x.condition)}</td><td>${esc(x.location)}</td><td>KSh ${Number(x.purchase_value||0).toLocaleString()}</td><td><button class="mini danger" onclick="delAsset(${x.id})">Delete</button></td></tr>`)))}async function delAsset(id){if(confirm('Delete asset?')){await api('/api/assets/'+id,{method:'DELETE'});assets()}}async function audit(){let d=await api('/api/audit');shell('Activity Log',table(['Date','User','Action','Details'],d.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.full_name)}</td><td>${esc(x.action)}</td><td>${esc(x.details)}</td></tr>`)))}
async function communication(){
 try{
  const [rows,classes]=await Promise.all([api('/api/communications'),api('/api/classes').catch(()=>[])]);
  shell('Communication Centre',`<div class="card"><h3>📢 Communication Centre</h3><p class="muted">Send targeted school messages. Recipients only see communications relevant to their account, class or role.</p><form id="commForm" class="grid"><input id="commTitle" placeholder="Message title" required><select id="commAudience"><option value="all">Everyone</option><option value="students">All Students</option><option value="parents">All Parents</option><option value="staff">All Staff</option><option value="teachers">Teachers</option><option value="support">Support Staff</option><option value="class">Specific Class</option><option value="role">Specific Role</option></select><select id="commValue" style="display:none"></select><textarea id="commMessage" placeholder="Write your message..." required style="grid-column:1/-1;min-height:120px"></textarea><button type="submit">Send Communication</button></form></div>`+table(['Date','Title','Audience','Sender','Action'],rows.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.title)}</td><td>${esc(x.audience_type)} ${x.audience_value?': '+esc(x.audience_value):''}</td><td>${esc(x.sender||'')}</td><td><button type="button" class="mini danger" onclick="deleteCommunication(${x.id})">Delete</button></td></tr>`)));
  const form=document.getElementById('commForm'), title=document.getElementById('commTitle'), audience=document.getElementById('commAudience'), value=document.getElementById('commValue'), message=document.getElementById('commMessage');
  audience.onchange=()=>{const a=audience.value;value.style.display=['class','role'].includes(a)?'block':'none';if(a==='class')value.innerHTML=classes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');else if(a==='role')value.innerHTML=['student','parent','teacher','ustadh','patron','worker','secretary','principal','director','admin'].map(x=>`<option value="${x}">${x}</option>`).join('');else value.innerHTML='';};
  form.onsubmit=async ev=>{ev.preventDefault();const a=audience.value;const payload={title:title.value.trim(),message:message.value.trim(),audience_type:a,audience_value:['class','role'].includes(a)?value.value:null};if(!payload.title||!payload.message)return alert('Enter a title and message.');if(['class','role'].includes(a)&&!payload.audience_value)return alert('Select a specific audience.');try{await api('/api/communications',{method:'POST',body:JSON.stringify(payload)});alert('Communication sent successfully.');communication()}catch(err){alert(err.message)}};
 }catch(e){shell('Communication Centre',`<div class="card"><h3>Communication Centre could not be loaded</h3><p class="err">${esc(e.message)}</p><button onclick="communication()">Retry</button></div>`)}
}
async function deleteCommunication(id){if(confirm('Delete this communication?')){await api('/api/communications/'+id,{method:'DELETE'});communication()}}
