<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secretary Office — your school</title><link rel="stylesheet" href="/styles.css?v=1.5.8"><link rel="stylesheet" href="/ui-polish.css?v=1.5.8"><link rel="stylesheet" href="/dashboard-polish.css?v=1.15.0"><style>.gs-payroll-float{position:fixed;right:18px;bottom:18px;z-index:9999;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#0b63ce;color:#fff;padding:12px 16px;font-weight:800}</style><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Secretary Office</b><span id="user"></span><button onclick="location.href='/review-centre.html'">🔔 Review Centre</button><button onclick="logout()">Logout</button></header><main><section class="card gs-page-hero"><h1 style="margin:0">Secretary Office</h1><p class="muted">Open a work area below. Detailed records load only when selected.</p></section><div id="stats" class="grid"></div><div class="gs-dashboard-nav secretary-nav"><button class="gs-dashboard-card" onclick="show('students')"><span class="gs-icon">🎓</span><span class="gs-title">Student Register</span><span class="gs-desc">Learners, classes and parent details</span><span class="gs-open">Open register →</span></button><button class="gs-dashboard-card" onclick="location.href='/secretary-fees.html'"><span class="gs-icon">💰</span><span class="gs-title">Fees Office</span><span class="gs-desc">Charges, payments and balances</span><span class="gs-open">Open fees →</span></button><button class="gs-dashboard-card" onclick="show('expenditures')"><span class="gs-icon">📒</span><span class="gs-title">Expenditures</span><span class="gs-desc">Record and review school spending</span><span class="gs-open">Open expenditures →</span></button><button class="gs-dashboard-card" onclick="show('learning-areas')"><span class="gs-icon">📘</span><span class="gs-title">Learning Areas</span><span class="gs-desc">Add and maintain learning area names and codes</span><span class="gs-open">Open learning areas →</span></button><button class="gs-dashboard-card" onclick="location.href='/syllabus-coverage.html'"><span class="gs-icon">📋</span><span class="gs-title">Syllabus Coverage</span><span class="gs-desc">View teacher syllabus coverage and plans</span><span class="gs-open">Open coverage reports →</span></button><button class="gs-dashboard-card" onclick="show('analytics')"><span class="gs-icon">📊</span><span class="gs-title">School Analytics</span><span class="gs-desc">Fees, academics and class position</span><span class="gs-open">Open analytics →</span></button><button class="gs-dashboard-card" onclick="show('exam-resources')"><span class="gs-icon">📎</span><span class="gs-title">Exam Files</span><span class="gs-desc">Approve, reject, download and manage exam papers</span><span class="gs-open">Open exam files →</span></button><button class="gs-dashboard-card" onclick="location.href='/tahfidh.html'"><span class="gs-icon">🕌</span><span class="gs-title">Tahfidh Programme</span><span class="gs-desc">View Tahfidh groups and monthly/end-term records</span><span class="gs-open">Open Tafhid →</span></button><button class="gs-dashboard-card" onclick="show('leave')"><span class="gs-icon">📄</span><span class="gs-title">Leave Out</span><span class="gs-desc">Request leave from the Director</span><span class="gs-open">Open leave →</span></button><button class="gs-dashboard-card" onclick="show('attendance')"><span class="gs-icon">🕘</span><span class="gs-title">Staff Sign In / Out</span><span class="gs-desc">Record your daily arrival and departure</span><span class="gs-open">Open attendance →</span></button><button class="gs-dashboard-card" onclick="show('documents')"><span class="gs-icon">📄</span><span class="gs-title">Official Documents</span><span class="gs-desc">School records and print-ready reports</span><span class="gs-open">Open documents →</span></button><button class="gs-dashboard-card" onclick="show('payroll')"><span class="gs-icon">💼</span><span class="gs-title">Payroll Office</span><span class="gs-desc">Prepare salary profiles and submit payroll to Director</span><span class="gs-open">Open payroll →</span></button><button class="gs-dashboard-card" onclick="show('assets')"><span class="gs-icon">🏫</span><span class="gs-title">Assets Register</span><span class="gs-desc">View and download school assets</span><span class="gs-open">Open assets →</span></button><button class="gs-dashboard-card" onclick="location.href='/whatsapp.html'"><span class="gs-icon">💬</span><span class="gs-title">WhatsApp</span><span class="gs-desc">Message parents and guardians directly</span><span class="gs-open">Open WhatsApp →</span></button><button class="gs-dashboard-card" onclick="show('communication')"><span class="gs-icon">📢</span><span class="gs-title">Communication Centre</span><span class="gs-desc">View live school communications</span><span class="gs-open">Open communication →</span></button><button class="gs-dashboard-card" onclick="show('calendar')"><span class="gs-icon">📅</span><span class="gs-title">School Calendar</span><span class="gs-desc">View live school events</span><span class="gs-open">Open calendar →</span></button></div><section class="card gs-detail-panel gs-collapsed"><h2 id="title">Secretary Office</h2><div id="body">Manage office records efficiently.</div></section></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user||user.role!=='secretary')location.href='/';document.getElementById('user').textContent=user.full_name+' ('+user.role+')';function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d})}function downloadSelectedFeesReport(){const period=document.getElementById('feePeriod')?.value||'all';let url='/api/documents/fees?period='+encodeURIComponent(period);let name='fees-analysis.html';if(period==='monthly'){const m=document.getElementById('feeMonth')?.value;if(!m)return alert('Select a month first.');url+='&month='+encodeURIComponent(m);name='fees-'+m+'.html'}else if(period==='termly'){const y=document.getElementById('feeYear')?.value,t=document.getElementById('feeTerm')?.value;url+='&academic_year='+encodeURIComponent(y)+'&term='+encodeURIComponent(t);name='fees-'+t.replace(/\s+/g,'-').toLowerCase()+'-'+y+'.html'}downloadDoc(url,name)}function toggleFeePeriod(){const p=document.getElementById('feePeriod')?.value||'all';document.getElementById('feeMonth').style.display=p==='monthly'?'block':'none';document.getElementById('feeYear').style.display=p==='termly'?'block':'none';document.getElementById('feeTerm').style.display=p==='termly'?'block':'none'}
function logout(){localStorage.clear();location.href='/'}async function downloadDoc(url,filename){try{const sep=url.includes("?")?"&":"?";const r=await fetch(url+sep+"download=1",{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename||'school-document.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert(e.message)}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function table(h,r){return '<div style="overflow:auto"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.join('')+'</table></div>'}
async function loadStats(){let d=await api('/api/secretary/summary');stats.innerHTML=`<div class="card">Students<div class="stat">${d.students}</div></div><div class="card">Fees Received<div class="stat">KSh ${d.fees_received.toLocaleString()}</div></div><div class="card">Expenditure<div class="stat">KSh ${d.expenditure.toLocaleString()}</div></div>`}loadStats();
async function show(n){const detail=document.querySelector('.gs-detail-panel');detail.classList.remove('gs-collapsed');document.querySelector('.gs-page-hero').hidden=true;document.querySelector('.secretary-nav').hidden=true;stats.hidden=true;title.textContent={students:'Student Register',fees:'Fees Office',expenditures:'Expenditure Office',analytics:'Zeraki-style School Analytics','learning-areas':'Learning Areas',documents:'Official Downloads',payroll:'Payroll Office',communication:'Communication Centre',calendar:'School Calendar'}[n]||n;body.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button><span class="muted">Loading...</span>';detail.scrollIntoView({behavior:'auto',block:'start'});try{if(n==='learning-areas')return await learningAreas();if(n==='students')return await students();if(n==='fees')return await fees();if(n==='expenditures')return await expenditures();if(n==='analytics')return await analytics();if(n==='exam-resources')return await examResources();if(n==='subject-reports')return location.href='/subject-reports.html';if(n==='leave')return await leave();if(n==='attendance')return await attendance();if(n==='assets')return await assets();if(n==='payroll')return await payrollOffice();if(n==='communication')return await communication();if(n==='calendar')return await calendarOffice();return await documents()}catch(e){body.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back to dashboard</button><div class="card err"><b>Unable to open this module.</b><p>'+esc(e.message)+'</p><button onclick="show(\'${n}\')">Retry</button></div>'}}
function backToDashboard(){const detail=document.querySelector('.gs-detail-panel');detail.classList.add('gs-collapsed');document.querySelector('.gs-page-hero').hidden=false;document.querySelector('.secretary-nav').hidden=false;stats.hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
async function learningAreas(){try{const rows=await api('/api/subjects');body.innerHTML=`<div class="card"><h3>Add Learning Area</h3><p class="muted">Code is required and must be unique. Use the school's CBC learning areas.</p><form id="laf" class="grid"><input id="lac" placeholder="Code e.g. ENG" maxlength="20" required><input id="lan" placeholder="Learning area e.g. English Activities" required><input id="lal" placeholder="Applicable classes e.g. PP1, PP2, Grade 1, Grade 2, Grade 3"><input id="lam" type="number" min="1" value="100" placeholder="Maximum marks"><button>Add Learning Area</button></form></div>`+table(['Code','Learning Area','Applicable Classes','Max Marks','Action'],rows.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.name)}</td><td>${esc(x.levels||'All classes')}</td><td>${x.max_marks||100}</td><td><button onclick="editLearningArea(${x.id})">Edit</button></td></tr>`));laf.onsubmit=async e=>{e.preventDefault();try{await api('/api/subjects',{method:'POST',body:JSON.stringify({code:lac.value.trim().toUpperCase(),name:lan.value.trim(),levels:lal.value.trim(),max_marks:Number(lam.value||100)})});alert('Learning area added successfully.');learningAreas()}catch(err){alert(err.message)}}}catch(e){body.innerHTML='<div class="card err"><b>Unable to load Learning Areas.</b><p>'+esc(e.message)+'</p></div>'}}async function editLearningArea(id){try{const x=(await api('/api/subjects')).find(a=>Number(a.id)===Number(id));if(!x)return alert('Learning area not found.');const code=prompt('Learning area code:',x.code||'');if(code===null)return;const name=prompt('Learning area name:',x.name||'');if(name===null)return;const levels=prompt('Applicable classes:',x.levels||'');if(levels===null)return;const max=prompt('Maximum marks:',x.max_marks||100);if(max===null)return;await api('/api/subjects/'+id,{method:'PATCH',body:JSON.stringify({code:code.trim().toUpperCase(),name:name.trim(),levels:levels.trim(),max_marks:Number(max)})});alert('Learning area updated successfully.');learningAreas()}catch(e){alert(e.message)}}
async function students(){let d=await api('/api/secretary/students');body.innerHTML='<div class="actions"><input id="sq" placeholder="Search student/admission"><button onclick="downloadDoc(\'/api/documents/students\',\'student-register.html\')">Download Register</button></div>'+table(['Admission','Student','Class','Parent','Phone','Statement'],d.map(x=>`<tr><td>${esc(x.admission_no)}</td><td>${esc(x.full_name)}</td><td>${esc(x.class_name)}</td><td>${esc(x.parent_name)}</td><td>${esc(x.parent_phone)}</td><td><button onclick="downloadDoc('/api/documents/student/${x.id}','student-fees-statement.html')">Download</button></td></tr>`));sq.oninput=async()=>{let d=await api('/api/secretary/students?q='+encodeURIComponent(sq.value));body.querySelector('table').outerHTML=table(['Admission','Student','Class','Parent','Phone','Statement'],d.map(x=>`<tr><td>${esc(x.admission_no)}</td><td>${esc(x.full_name)}</td><td>${esc(x.class_name)}</td><td>${esc(x.parent_name)}</td><td>${esc(x.parent_phone)}</td><td><button onclick="downloadDoc('/api/documents/student/${x.id}','student-fees-statement.html')">Download</button></td></tr>`))}}
async function fees(){let [s,students,entries]=await Promise.all([api('/api/fees/summary'),api('/api/secretary/students'),api('/api/secretary/fees-entries')]);const studentOpts=students.map(x=>`<option value="${x.id}">${esc(x.admission_no)} — ${esc(x.full_name)}</option>`).join('');body.innerHTML=`<div class="grid"><div class="card">Charged<div class="stat">KSh ${s.charged.toLocaleString()}</div></div><div class="card">Paid<div class="stat">KSh ${s.paid.toLocaleString()}</div></div><div class="card">Outstanding<div class="stat">KSh ${s.balance.toLocaleString()}</div></div></div><div class="card"><h3>Record Student Fee Charge</h3><form id="cf" class="grid"><select id="cs" required>${studentOpts}</select><select id="cpt"><option value="monthly">Monthly</option><option value="termly">Termly</option></select><input id="cm" type="month"><select id="cy"><option>${new Date().getFullYear()}</option><option>${new Date().getFullYear()+1}</option></select><select id="ct"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><input id="ca" type="number" min="1" placeholder="Amount" required><input id="cd" placeholder="Description"><button>Add Charge</button></form></div><div class="card"><h3>Record Fee Payment</h3><form id="pf" class="grid"><select id="ps" required>${studentOpts}</select><input id="pa" type="number" min="1" placeholder="Amount" required><select id="pm"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Cheque</option></select><input id="pr" placeholder="Reference / receipt"><button>Record Payment</button></form></div><div class="card"><h3>Download Fees Report</h3><div class="grid"><select id="feePeriod"><option value="all">All Time</option><option value="monthly">Specific Month</option><option value="termly">Specific Term</option></select><input id="feeMonth" type="month"><select id="feeYear"><option>${new Date().getFullYear()}</option><option>${new Date().getFullYear()+1}</option></select><select id="feeTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><button type="button" onclick="downloadSelectedFeesReport()">Download</button></div></div><h3>Fees Ledger — live</h3>`+table(['Date','Student','Class','Type','Period','Description','Amount','Action'],entries.map(x=>`<tr><td>${new Date(x.transaction_date).toLocaleDateString()}</td><td>${esc(x.full_name)}</td><td>${esc(x.class_name)}</td><td>${x.entry_type}</td><td>${esc(x.period_type||x.term||'')}</td><td>${esc(x.description||'')}</td><td>KSh ${Number(x.amount).toLocaleString()}</td><td><button class="mini" onclick='editFee(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button> <button class="mini danger" onclick="deleteFee('${x.entry_type}',${x.id})">Delete</button></td></tr>`));cpt.onchange=()=>{cm.style.display=cpt.value==='monthly'?'block':'none';ct.style.display=cpt.value==='termly'?'block':'none';};cpt.dispatchEvent(new Event('change'));cf.onsubmit=async e=>{e.preventDefault();await api('/api/fees/charges',{method:'POST',body:JSON.stringify({student_id:cs.value,amount:ca.value,period_type:cpt.value,fee_month:cm.value,academic_year:cy.value,term:ct.value,description:cd.value})});alert('Fee charge recorded live.');fees();loadStats()};pf.onsubmit=async e=>{e.preventDefault();await api('/api/fees/payments',{method:'POST',body:JSON.stringify({student_id:ps.value,amount:pa.value,payment_method:pm.value,reference:pr.value})});alert('Fee payment recorded live.');fees();loadStats()}}
async function editFee(x){const amount=prompt('Amount:',x.amount);if(amount===null)return;const description=prompt('Description:',x.description||'');if(description===null)return;try{await api(x.entry_type==='charge'?'/api/fees/charges/'+x.id:'/api/fees/records/'+x.id,{method:'PATCH',body:JSON.stringify({amount:Number(amount),description})});alert('Fee record updated.');fees();loadStats()}catch(e){alert(e.message)}}
async function deleteFee(type,id){if(!confirm('Delete this fee record?'))return;try{await api(type==='charge'?'/api/fees/charges/'+id:'/api/fees/records/'+id,{method:'DELETE'});fees();loadStats()}catch(e){alert(e.message)}}
function downloadSelectedFeesReport(){const p=document.getElementById('feePeriod').value;let u='/api/documents/fees?period='+encodeURIComponent(p),n='fees-report.html';if(p==='monthly'){if(!feeMonth.value)return alert('Select a month.');u+='&month='+encodeURIComponent(feeMonth.value);n='fees-'+feeMonth.value+'.html'}else if(p==='termly'){u+='&academic_year='+encodeURIComponent(feeYear.value)+'&term='+encodeURIComponent(feeTerm.value);n='fees-'+feeTerm.value+'-'+feeYear.value+'.html'}downloadDoc(u,n)}

async function assets(){const d=await api('/api/assets');body.innerHTML='<div class="actions"><button onclick="downloadDoc(\'/api/documents/assets\',\'assets-register.html\')">Download Assets Register</button></div>'+table(['Code','Asset','Category','Qty','Condition','Location','Value','Status'],d.map(x=>`<tr><td>${esc(x.asset_code)}</td><td>${esc(x.name)}</td><td>${esc(x.category||'')}</td><td>${x.quantity}</td><td>${esc(x.condition||'')}</td><td>${esc(x.location||'')}</td><td>KSh ${Number(x.purchase_value||0).toLocaleString()}</td><td>${esc(x.status||'')}</td></tr>`))}
async function expenditures(){let d=await api('/api/expenditure-requests');body.innerHTML=`<div class="card"><h3>Request Expenditure Payment</h3><p class="muted">Submit to Director. Any edit after submission returns the request to <b>Pending</b> and requires Director re-approval.</p><form id="xf" class="grid"><input id="xc" placeholder="Category"><input id="xd" placeholder="Description" required><input id="xa" type="number" placeholder="Amount" required><input id="xdate" type="date"><select id="xm"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Cheque</option></select><button>Send Request to Director</button></form></div><div class="card"><h3>Download Expenditure</h3><div class="grid"><select id="expPeriod"><option value="all">All</option><option value="daily">Specific Day</option><option value="monthly">Specific Month</option><option value="termly">Specific Term</option></select><input id="expDate" type="date"><input id="expMonth" type="month"><select id="expYear"><option>${new Date().getFullYear()}</option><option>${new Date().getFullYear()+1}</option></select><select id="expTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select><button type="button" onclick="downloadExpenditureReport()">Download</button></div></div>`+table(['Date','Category','Description','Amount','Method','Status','Action'],d.map(x=>`<tr><td>${esc(x.requested_date)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td>KSh ${Number(x.amount).toLocaleString()}</td><td>${esc(x.payment_method)}</td><td>${esc(x.status)}</td><td>${x.status==='approved'?`<button onclick="payRequest(${x.id})">Record Payment</button>`:''} ${x.status!=='paid'?`<button class="mini" onclick='editExpenditure(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button><button class="mini danger" onclick="deleteExpenditure(${x.id})">Delete</button>`:''}</td></tr>`));xf.onsubmit=async e=>{e.preventDefault();await api('/api/expenditure-requests',{method:'POST',body:JSON.stringify({category:xc.value,description:xd.value,amount:xa.value,payment_method:xm.value,requested_date:xdate.value||undefined})});alert('Expenditure request sent to Director.');expenditures()}}
async function editExpenditure(x){const description=prompt('Description:',x.description);if(description===null)return;const amount=prompt('Amount:',x.amount);if(amount===null)return;try{await api('/api/expenditure-requests/'+x.id,{method:'PATCH',body:JSON.stringify({description,amount:Number(amount),category:x.category,payment_method:x.payment_method,requested_date:x.requested_date})});alert('Updated and returned to Pending for Director re-approval.');expenditures()}catch(e){alert(e.message)}}
async function deleteExpenditure(id){if(confirm('Delete this expenditure request?')){try{await api('/api/expenditure-requests/'+id,{method:'DELETE'});expenditures()}catch(e){alert(e.message)}}}
function downloadExpenditureReport(){const p=expPeriod.value;let u='/api/documents/expenditures?period='+encodeURIComponent(p),n='expenditure-report.html';if(p==='daily'){if(!expDate.value)return alert('Select a day.');u+='&date='+encodeURIComponent(expDate.value);n='expenditure-'+expDate.value+'.html'}else if(p==='monthly'){if(!expMonth.value)return alert('Select a month.');u+='&month='+encodeURIComponent(expMonth.value);n='expenditure-'+expMonth.value+'.html'}else if(p==='termly'){u+='&academic_year='+encodeURIComponent(expYear.value)+'&term='+encodeURIComponent(expTerm.value);n='expenditure-'+expTerm.value+'-'+expYear.value+'.html'}downloadDoc(u,n)}

async function payRequest(id){const ref=prompt('Enter payment reference/receipt number (optional):')||'';await api('/api/expenditure-requests/'+id+'/pay',{method:'POST',body:JSON.stringify({reference:ref})});alert('Payment recorded.');expenditures();loadStats()}
async function leave(){const rows=await api('/api/leave-requests');body.innerHTML=`<div class="card"><h3>Leave Out Request</h3><form id="lf" class="grid"><select id="lt"><option>Annual Leave</option><option>Sick Leave</option><option>Personal Leave</option><option>Emergency Leave</option><option>Other</option></select><input id="ls" type="date" required><input id="le" type="date" required><textarea id="lr" placeholder="Reason for leave" required style="grid-column:1/-1;min-height:90px"></textarea><button>Submit to Director</button></form></div>`+table(['Type','Dates','Status','Director Note','Letter'],rows.map(x=>`<tr><td>${esc(x.leave_type)}</td><td>${esc(x.start_date)} to ${esc(x.end_date)}</td><td>${esc(x.status)}</td><td>${esc(x.director_note||'—')}</td><td>${x.status==='approved'?`<button onclick="downloadDoc('/api/documents/leave/${x.id}','approved-leave-out-letter.html')">Download Approved Letter</button>`:'—'}</td></tr>`));lf.onsubmit=async e=>{e.preventDefault();await api('/api/leave-requests',{method:'POST',body:JSON.stringify({leave_type:lt.value,start_date:ls.value,end_date:le.value,reason:lr.value})});alert('Leave request sent to Director.');leave()}}
async function attendance(){let rows=await api('/api/staff-attendance/my');body.innerHTML=`<div class="card"><h3>Daily Sign In / Out</h3><div class="actions"><button onclick="checkIn()">✓ Sign In Now</button><button onclick="checkOut()">↪ Sign Out Now</button></div></div>`+table(['Date','Sign In','Sign Out'],rows.map(x=>`<tr><td>${esc(x.attendance_date)}</td><td>${x.check_in?new Date(x.check_in).toLocaleTimeString():'—'}</td><td>${x.check_out?new Date(x.check_out).toLocaleTimeString():'—'}</td></tr>`))}async function checkIn(){try{await api('/api/staff-attendance/check-in',{method:'POST'});alert('Signed in successfully.');attendance()}catch(e){alert(e.message)}}async function checkOut(){try{await api('/api/staff-attendance/check-out',{method:'POST'});alert('Signed out successfully.');attendance()}catch(e){alert(e.message)}}
async function analytics(){let [o,f]=await Promise.all([api('/api/analytics/overview'),api('/api/analytics/fees')]);body.innerHTML=`<div class="grid"><div class="card">Collection Rate<div class="stat">${o.feesCharged?Math.round(o.feesPaid/o.feesCharged*100):0}%</div></div><div class="card">Outstanding<div class="stat">KSh ${o.balance.toLocaleString()}</div></div><div class="card">Expenditure<div class="stat">KSh ${o.expenditure.toLocaleString()}</div></div><div class="card">Marks Average<div class="stat">${o.averageMarks.toFixed(1)}</div></div></div>`+table(['Class','Students','Charged','Paid','Balance','Collection %'],f.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${x.students}</td><td>KSh ${x.charged.toLocaleString()}</td><td>KSh ${x.paid.toLocaleString()}</td><td>KSh ${x.balance.toLocaleString()}</td><td>${x.charged?Math.round(x.paid/x.charged*100):0}%</td></tr>`))}
async function examResources(){
 let r=await api('/api/exam-resources');
 let p=await api('/api/exam-resources/purchases');
 const rows=r.map(x=>'<tr><td>'+esc(x.title)+'<br><small>'+esc(x.original_filename)+'</small></td><td>'+esc(x.class_name)+'</td><td>'+esc(x.subject_name)+'</td><td>'+esc(x.uploader)+'</td><td>'+esc(x.status)+'</td><td><button onclick="downloadDoc(\'/api/exam-resources/'+x.id+'/download\',\''+esc(x.original_filename)+'\')">Download</button> '+(x.status!=='approved'?'<button class="success" onclick="reviewER('+x.id+',\'approved\')">Approve</button>':'')+' '+(x.status!=='rejected'?'<button onclick="reviewER('+x.id+',\'rejected\')">Reject</button>':'')+' <button class="danger" onclick="deleteER('+x.id+')">Delete</button></td></tr>');
 const pay=p.map(x=>'<tr><td>'+esc(x.student_name)+' ('+esc(x.admission_no)+')</td><td>'+esc(x.title)+'</td><td>KSh '+Number(x.amount).toLocaleString()+'</td><td>'+esc(x.reference||'—')+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='pending'?'<button class="success" onclick="reviewPurchaseS('+x.id+',\'paid\')">Approve</button><button class="danger" onclick="reviewPurchaseS('+x.id+',\'rejected\')">Reject</button>':'—')+'</td></tr>');
 body.innerHTML='<div class="card"><h3>Exam Files Review</h3><p class="muted">Teacher uploads arrive here for approval. Approved files become available to students in the matching class for KSh 100.</p></div>'+table(['Exam','Class','Learning Area','Uploader','Status','Actions'],rows)+'<h3 style="margin-top:18px">Student download payments</h3>'+table(['Student','Exam','Amount','Reference','Status','Action'],pay);
}
async function reviewER(id,status){await api('/api/exam-resources/'+id,{method:'PATCH',body:JSON.stringify({status,review_note:status==='rejected'?(prompt('Reason')||'Rejected by reviewer'):''})});examResources()}
async function deleteER(id){if(confirm('Delete this exam file?')){await api('/api/exam-resources/'+id,{method:'DELETE'});examResources()}}
async function reviewPurchaseS(id,status){await api('/api/exam-resources/purchases/'+id,{method:'PATCH',body:JSON.stringify({status,review_note:status==='rejected'?(prompt('Reason')||'Payment rejected'):''})});examResources()}

async function payrollOffice(){try{const [staff,periods]=await Promise.all([api('/api/payroll/staff'),api('/api/payroll/periods')]);const opts=staff.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.full_name)} — ${esc(x.role)}${x.staff_category?' — '+esc(x.staff_category):''}</option>`).join('');body.innerHTML=`<div class="card"><h3>Prepare Payroll</h3><p class="muted">Secretary prepares salary profiles and payroll, then submits it to the Director. The Director alone approves and publishes it live.</p><form id="sp" class="grid"><select id="sps" required>${opts}</select><input id="spb" type="number" min="0" placeholder="Basic salary"><input id="sph" type="number" min="0" placeholder="House allowance"><input id="spt" type="number" min="0" placeholder="Transport allowance"><input id="spo" type="number" min="0" placeholder="Other allowance"><input id="sptax" type="number" min="0" placeholder="Tax / PAYE"><input id="spp" type="number" min="0" placeholder="Pension / NSSF"><input id="spd" type="number" min="0" placeholder="Other deduction"><input id="spbank" placeholder="Bank name"><input id="spacc" placeholder="Account number"><button>Save Salary Profile</button></form></div><div class="card"><h3>Generate / Prepare Monthly Payroll</h3><form id="spr" class="grid"><input id="spy" type="number" value="${new Date().getFullYear()}" min="2000"><select id="spm">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===new Date().getMonth()+1?'selected':''}>${new Date(2000,i,1).toLocaleString(undefined,{month:'long'})}</option>`).join('')}</select><button>Prepare Payroll</button></form></div>`+table(['Period','Status','Action'],periods.map(x=>`<tr><td>${x.payroll_year}-${String(x.payroll_month).padStart(2,'0')}</td><td>${esc(x.status)}</td><td><button onclick="openSecretaryPayroll(${x.id})">Open</button> <button onclick="downloadDoc('/api/documents/payroll/${x.id}','payroll-${x.payroll_year}-${x.payroll_month}.html')">Download</button> ${x.status==='draft'?`<button onclick="submitPayroll(${x.id})">Submit to Director</button>`:''}</td></tr>`));const $=id=>document.getElementById(id);$('sps').onchange=()=>{const x=staff.find(z=>Number(z.id)===Number($('sps').value));if(x){$('spb').value=x.basic_salary||0;$('sph').value=x.house_allowance||0;$('spt').value=x.transport_allowance||0;$('spo').value=x.other_allowance||0;$('sptax').value=x.tax_deduction||0;$('spp').value=x.pension_deduction||0;$('spd').value=x.other_deduction||0;$('spbank').value=x.bank_name||'';$('spacc').value=x.account_number||''}};$('sps').dispatchEvent(new Event('change'));$('sp').onsubmit=async e=>{e.preventDefault();await api('/api/payroll/staff',{method:'POST',body:JSON.stringify({staff_id:$('sps').value,basic_salary:$('spb').value,house_allowance:$('sph').value,transport_allowance:$('spt').value,other_allowance:$('spo').value,tax_deduction:$('sptax').value,pension_deduction:$('spp').value,other_deduction:$('spd').value,bank_name:$('spbank').value,account_number:$('spacc').value})});alert('Salary profile saved.');payrollOffice()};$('spr').onsubmit=async e=>{e.preventDefault();const r=await api('/api/payroll/run',{method:'POST',body:JSON.stringify({year:$('spy').value,month:$('spm').value})});alert(`Payroll prepared for ${r.staff_count} staff members.`);payrollOffice()} }catch(e){alert(e.message)}}
async function submitPayroll(id){if(!confirm('Submit this payroll to the Director for approval?'))return;await api('/api/payroll/periods/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'submitted'})});alert('Payroll submitted to Director for approval.');payrollOffice()}
async function openSecretaryPayroll(id){try{const d=await api('/api/payroll/periods/'+id);body.innerHTML='<button class="gs-back" onclick="payrollOffice()">← Back to Payroll</button><h3>Payroll '+d.period.payroll_year+'-'+String(d.period.payroll_month).padStart(2,'0')+'</h3><p><b>Status:</b> '+esc(d.period.status)+'</p>'+table(['Staff','Role','Gross','Deductions','Net','Status'],d.entries.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.role)+'</td><td>KSh '+Number(x.gross_pay).toLocaleString()+'</td><td>KSh '+Number(x.total_deductions).toLocaleString()+'</td><td>KSh '+Number(x.net_pay).toLocaleString()+'</td><td>'+esc(x.status)+'</td></tr>'))}catch(e){body.innerHTML='<button class="gs-back" onclick="payrollOffice()">← Back to Payroll</button><p class="err">'+esc(e.message)+'</p>'}}

async function communication(){try{const rows=await api('/api/communications');body.innerHTML=`<div class="card"><h3>Communication Centre</h3><p class="muted">Live school communications. New messages appear when you refresh this module.</p></div>`+(rows.length?rows.map(x=>`<div class="card"><b>${esc(x.title)}</b><p class="muted">${new Date(x.created_at).toLocaleString()} · ${esc(x.sender||'School Administration')} · ${esc(x.audience_type||'all')}</p><p>${esc(x.message).replace(/\n/g,'<br>')}</p></div>`).join(''):'<div class="empty">No communications have been posted yet.</div>')}catch(e){body.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back</button><div class="err">Unable to load Communication Centre: '+esc(e.message)+'</div>'}}
async function calendarOffice(){try{const rows=await api('/api/calendar');body.innerHTML=`<div class="card"><h3>School Calendar</h3><p class="muted">Live school events and dates.</p></div>`+(rows.length?table(['Date','Event','Time','Category','Location','Description'],rows.map(x=>`<tr><td>${esc(x.event_date)}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.start_time||'—')}${x.end_time?' – '+esc(x.end_time):''}</td><td>${esc(x.category||'')}</td><td>${esc(x.location||'—')}</td><td>${esc(x.description||'—')}</td></tr>`)):'<div class="empty">No calendar events have been posted yet.</div>')}catch(e){body.innerHTML='<button class="gs-back" onclick="backToDashboard()">← Back</button><div class="err">Unable to load School Calendar: '+esc(e.message)+'</div>'}}
function documents(){body.innerHTML='<h3>Official School Documents</h3><div class="actions"><button onclick="downloadDoc(\'/api/documents/students\',\'student-register.html\')">Student Register</button><button onclick="downloadDoc(\'/api/documents/fees\',\'fees-analysis.html\')">Fees Analysis</button><button onclick="downloadDoc(\'/api/documents/expenditures\',\'expenditure-report.html\')">Expenditure Report</button></div><p>Documents use the school heading and are print-ready.</p>'}
async function myPayroll(){try{const d=await api('/api/payroll/my');const target=typeof shell==='function'?shell:null;if(target){target('My Payroll','View your own live payroll status.',`<div class="card"><h3>${esc(d.staff.full_name)}</h3>${table(['Month','Gross','Deductions','Net','Status','Payslip'],d.entries.map(x=>`<tr><td>${x.payroll_year}-${String(x.payroll_month).padStart(2,'0')}</td><td>KSh ${Number(x.gross_pay||0).toLocaleString()}</td><td>KSh ${Number(x.total_deductions||0).toLocaleString()}</td><td><b>KSh ${Number(x.net_pay||0).toLocaleString()}</b></td><td>${esc(x.status||x.period_status||'—')}</td><td><button onclick="downloadDoc('/api/documents/payslip/${x.id}','my-payslip-${x.payroll_year}-${x.payroll_month}.html')">Download</button></td></tr>`))}</div>`)}else{alert('Payroll module is available from Staff Workspace.')}}catch(e){alert(e.message)}}
</script><a href="/secretary-fees.html" style="display:inline-block;background:#0879a6;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;margin:6px">💰 Download Fees Records</a><button type="button" class="gs-payroll-float" onclick="myPayroll()">💼 My Payroll</button><script src="/app-navigation.js?v=1.7.5"></script><script src="/navigation-templates.js?v=1.7.5"></script><script src="/online-module.js?v=1.6.0"></script></body></html>
