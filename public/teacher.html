<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Workspace — your school</title>
<link rel="stylesheet" href="/styles.css?v=1.8.6"><link rel="stylesheet" href="/ui-polish.css?v=1.8.6">
<style>
:root{--green:#08623d;--green2:#0a7a4b;--ink:#172033;--muted:#667085;--line:#dfe7e3;--soft:#f4f8f6}
body{background:linear-gradient(180deg,#f4f8f7 0%,#eef3f7 100%)}
header{padding:16px 22px;box-shadow:0 2px 12px #0002;position:sticky;top:0;z-index:10}
main{max-width:1180px;margin:24px auto;padding:0 16px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.hero h1{font-size:clamp(28px,5vw,42px);margin:0 0 6px}.hero p{margin:0;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:7px;background:#e7f5ee;color:#075f3c;border:1px solid #cce7d9;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:15px;margin:18px 0}.teacher-tile{appearance:none;border:1px solid var(--line);background:#fff!important;color:var(--ink)!important;text-align:left;min-height:155px;padding:20px;border-radius:18px;box-shadow:0 5px 18px #1720330c;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:.18s ease;cursor:pointer}.teacher-tile:hover{transform:translateY(-3px);border-color:#9bcdb7;box-shadow:0 9px 24px #17203318}.teacher-tile:active{transform:translateY(0)}.teacher-tile .icon{font-size:31px;line-height:1}.teacher-tile b{font-size:18px;margin-top:12px}.teacher-tile small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:4px}.teacher-tile .open{color:var(--green);font-size:13px;font-weight:800;margin-top:12px}
.detail{min-height:240px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap}.section-head h2{margin:0}.muted{color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.actions>*{margin:0}.btn-light{background:#eaf3ef!important;color:#075f3c!important}.danger{background:#b42318!important}.mini{padding:8px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:14px 0}.statbox{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:14px}.statbox span{display:block;color:var(--muted);font-size:12px}.statbox strong{font-size:24px;color:var(--green)}
.scope{background:#f7fbf9;border:1px solid #d8e9e0;border-radius:12px;padding:12px;margin:12px 0}.scope strong{color:#075f3c}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.panel h3{margin-top:0}.barrow{display:grid;grid-template-columns:70px 1fr 45px;gap:8px;align-items:center;margin:9px 0;font-size:13px}.bar{height:10px;background:#e5ece8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green2);border-radius:99px}.upload-box{border:2px dashed #b9d7c8;background:#f7fbf9;border-radius:14px;padding:16px}.hint{font-size:12px;color:var(--muted)}
input[type=file]{padding:9px;background:#fff}.file-label{font-weight:700;color:#075f3c;display:block;margin-bottom:6px}
.marks-entry{max-width:1050px}.mark-controls{display:grid;grid-template-columns:1fr 1.35fr auto;gap:12px;align-items:end;margin-top:14px}.mark-controls label{font-size:12px;font-weight:800;color:#344054}.mark-controls select{display:block;width:100%;margin-top:6px}.primary-action{background:var(--green)!important;color:#fff!important;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;white-space:nowrap}.primary-action:disabled{opacity:.65;cursor:wait}.mark-sheet{margin-top:16px}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:#f7fbf9;border:1px solid #d8e9e0;border-radius:12px;padding:12px 14px;margin-bottom:10px}.sheet-head strong{display:block;color:#075f3c}.sheet-head span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.cbc-note{font-size:11px!important;background:#e7f5ee;padding:6px 9px;border-radius:999px;color:#075f3c!important}.mark-input{width:92px!important;text-align:center;font-weight:800}.comment-input{min-width:140px}.save-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.loading-state,.empty-state,.error-state{padding:28px 18px;text-align:center;border:1px solid var(--line);border-radius:14px;background:#fbfdfc}.empty-icon{font-size:32px}.empty-state h3,.error-state strong{margin:8px 0;color:var(--ink)}.error-state p{color:#b42318}.error-state .btn-light{margin-top:8px}
@media(max-width:760px){.mark-controls{grid-template-columns:1fr}.primary-action{width:100%}.save-row{align-items:stretch;flex-direction:column}.sheet-head{align-items:flex-start}.mark-input{width:76px!important}.comment-input{min-width:110px}}

@media(max-width:650px){.teacher-tile{min-height:135px}.grid2{grid-template-columns:1fr}.hero{align-items:flex-start}header{position:static}}
</style>
<link rel="stylesheet" href="/dashboard-polish.css?v=1.15.0"><style>.gs-payroll-float{position:fixed;right:18px;bottom:18px;z-index:9999;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#0b63ce;color:#fff;padding:12px 16px;font-weight:800}</style><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head>
<body>
<header><b>your school — Teacher Workspace</b><span id="user"></span><button onclick="logout()">Logout</button></header>
<main>
<section class="card hero">
  <div><h1>Teacher Workspace</h1><p>Manage only the classes and learning areas assigned to you.</p></div>
  <div class="badge">✓ Assignment-controlled access</div>
</section>
<div id="tiles" class="tiles"></div>
<section id="detail" class="card detail" hidden><div class="section-head"><div><h2 id="title">Your Teaching Centre</h2><p id="subtitle" class="muted">Choose a module below to begin.</p></div></div><div id="body" style="margin-top:18px"></div></section>
</main>
<script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');
if(!token||!user||user.role!=='teacher')location.href='/';
document.getElementById('user').textContent=user.full_name+' (Teacher)';
const tilesEl=document.getElementById('tiles'),bodyEl=document.getElementById('body'),titleEl=document.getElementById('title'),subtitleEl=document.getElementById('subtitle');
let assignments=[],exams=[],subjects=[],classes=[];
function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||'Request failed');return d})}
function logout(){localStorage.clear();location.href='/'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function table(h,rows){const body=Array.isArray(rows)?rows.join(''):(rows==null?'':String(rows));return '<div style="overflow:auto"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+body+'</table></div>'}
async function downloadDoc(url,filename){try{const sep=url.includes("?")?"&":"?";const r=await fetch(url+sep+"download=1",{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename||'school-document.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert(e.message)}}
async function init(){[assignments,exams,subjects,classes]=await Promise.all([api('/api/teacher-assignments'),api('/api/exams'),api('/api/subjects'),api('/api/classes')]);renderTiles()}
function renderTiles(){const subjectA=assignments.filter(x=>x.assignment_type==='subject');const classA=assignments.filter(x=>x.assignment_type==='class_teacher');const classCount=new Set(assignments.map(x=>x.class_name)).size;tilesEl.innerHTML=[
 ['📝','Enter Marks','Enter marks for your assigned subject and class','Open a simple learner mark sheet','marks'],
 ['📊','Exam Analytics','Grade and subject performance','Only your assigned scope','analysis'],
 ['🏆','Class Merit List','Rank learners in your class','Class-teacher access only','merit'],
 ['📄','Result Slips','Download professional CBC slips','Your assigned class','results'],
 ['📚','Exam Bank','Upload exam papers and manage assessment resources','Loading your live exam-bank records…','exam-resources'],
 ['🎓','My Class Register','Register and maintain learners in your assigned class','Add, edit, delete and download your class register','students'],
 ['🧑‍🏫','Student Subject Reports','Write strand-based learner strength and support reports','Submit for administration approval','subject-reports'],
 ['📘','Syllabus Coverage & Plans','Report syllabus progress, pending areas, challenges and teaching plans','Loading your live coverage reports…','syllabus-coverage'],

 ['📝','Question Bank','Create and manage CBC assessment questions','Your assigned learning areas & classes','exam-bank'],
 ['👩‍🏫','My Assignments',`${subjectA.length} subject assignment${subjectA.length===1?'':'s'} · ${classA.length} class teacher assignment${classA.length===1?'':'s'}`,'Your current teaching scope','assignments'],
 ['📄','Leave Out','Request leave from the Director','Download approved leave-out letter','leave'],
 ['📢','Communication Centre','Read live school messages sent to your role or all staff','School-wide communication','communication'],
 ['📅','School Calendar','View live academic and school events','Published school calendar','calendar'],
 ['🕘','Staff Sign In / Out','Record your daily arrival and departure','Your attendance history','attendance']
 ].map(x=>`<button class="teacher-tile" data-module="${x[4]}" onclick="show('${x[4]}')"><span class="icon">${x[0]}</span><div><b>${x[1]}</b><small>${x[2]}</small><small class="live-tile-detail">${x[3]}</small></div><span class="open">Open module →</span></button>`).join('');refreshLiveAcademicTiles()}
async function refreshLiveAcademicTiles(){
  const examTile=tilesEl.querySelector('[data-module="exam-bank"] .live-tile-detail');
  const coverageTile=tilesEl.querySelector('[data-module="syllabus-coverage"] .live-tile-detail');
  try{const q=await api('/api/exam-bank');const pending=q.filter(x=>x.status==='pending').length,approved=q.filter(x=>x.status==='approved').length; if(examTile)examTile.textContent=`Live: ${q.length} questions · ${approved} approved · ${pending} awaiting review`;}catch(e){if(examTile)examTile.textContent='Live records unavailable — open to retry';}
  try{const r=await api('/api/syllabus-coverage');const pending=r.filter(x=>x.status==='pending').length,approved=r.filter(x=>x.status==='approved').length;const avg=r.length?r.reduce((a,x)=>a+Number(x.coverage_percent||0),0)/r.length:0;if(coverageTile)coverageTile.textContent=`Live: ${r.length} reports · ${approved} approved · ${pending} awaiting review · ${avg.toFixed(0)}% avg coverage`;}catch(e){if(coverageTile)coverageTile.textContent='Live records unavailable — open to retry';}
}
function shell(t,s,h){const detail=document.getElementById('detail');titleEl.textContent=t;subtitleEl.textContent=s;bodyEl.innerHTML='<button type="button" class="gs-back" onclick="backToDashboard()">← Back to dashboard</button>'+h;tilesEl.hidden=true;document.querySelector('.hero').hidden=true;detail.hidden=false;detail.scrollIntoView({behavior:'auto',block:'start'});}
function backToDashboard(){document.getElementById('detail').hidden=true;tilesEl.hidden=false;document.querySelector('.hero').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}
async function show(n){try{await init();const handlers={marks,analysis,merit,results,'exam-resources':examResources,'exam-bank':examBank,'subject-reports':()=>location.href='/subject-reports.html','syllabus-coverage':()=>location.href='/syllabus-coverage.html',students,tafhid:()=>location.href='/tahfidh.html',assignments:myAssignments,leave,attendance,communication,calendar};const handler=handlers[n];if(typeof handler!=='function')throw new Error('Module is unavailable: '+n);await handler()}catch(e){shell('Module error','Please contact the administrator if this continues',`<p class="err">${esc(e.message)}</p>`)}}
function assignmentOptions(){return assignments.filter(x=>x.assignment_type==='subject').map(x=>`<option value="${x.subject_id}" data-class="${esc(x.class_name)}" data-label="${esc(x.subject_name)} — ${esc(x.class_name)}">${esc(x.subject_name)} — ${esc(x.class_name)}</option>`).join('')}
function marks(){
  const subjectA=assignments.filter(x=>x.assignment_type==='subject');
  const options=subjectA.map((x,i)=>`<option value="${x.subject_id}" data-class="${esc(x.class_name)}" data-label="${esc(x.subject_name)} — ${esc(x.class_name)}">${esc(x.subject_name)} — ${esc(x.class_name)}</option>`).join('');
  shell('Enter Marks','Select your assigned subject and class, then enter marks directly for the learners.',`<div class="marks-entry">
    <div class="scope"><strong>Your assigned subjects:</strong> ${subjectA.map(x=>esc(x.subject_name)+' — '+esc(x.class_name)).join(' · ')||'No subject assignment has been created yet.'}</div>
    ${subjectA.length?`<div class="mark-controls"><label>Assessment<select id="markExam">${exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.term)} ${x.academic_year}</option>`).join('')}</select></label><label>Assigned subject & class<select id="markAssignment">${options}</select></label><button class="primary-action" onclick="loadStudentsForMarks()">Open Learners →</button></div><div id="markTable" class="mark-sheet"></div>`:`<div class="empty-state"><div class="empty-icon">📝</div><h3>No subject assignment yet</h3><p>Ask the administrator to assign you a learning area and class.</p></div>`}
  </div>`);
  if(subjectA.length&&exams.length) setTimeout(loadStudentsForMarks,0);
}
setTimeout(()=>{try{if(document.getElementById('markAssignment')&&assignments.some(x=>x.assignment_type==='subject'))loadStudentsForMarks()}catch(e){}},0);
async function loadStudentsForMarks(){
  const opt=markAssignment?.options[markAssignment.selectedIndex];
  if(!opt)return;
  const className=opt.dataset.class;
  const subjectName=opt.dataset.label||'Assigned subject';
  markTable.innerHTML='<div class="loading-state">Loading assigned learners…</div>';
  try{
    let [st,m]=await Promise.all([api('/api/students?subject_id='+encodeURIComponent(markAssignment.value)),api('/api/marks?exam_id='+encodeURIComponent(markExam.value)+'&subject_id='+encodeURIComponent(markAssignment.value))]);
    st=st.filter(x=>String(x.class_name||'').trim().toLowerCase()===className.toLowerCase());
    const by=new Map(m.map(x=>[String(x.student_id),x]));
    if(!st.length){markTable.innerHTML=`<div class="empty-state"><div class="empty-icon">👥</div><h3>No learners found</h3><p>No learners are currently registered in ${esc(className)}.</p></div>`;return;}
    markTable.innerHTML=`<div class="sheet-head"><div><strong>${esc(subjectName)}</strong><span>${st.length} learner${st.length===1?'':'s'} · ${esc(className)}</span></div><span class="cbc-note">EE 80–100 · ME 60–79 · AE 40–59 · BE 0–39</span></div>${table(['#','Admission','Learner','Marks /100','Teacher comment'],st.map((x,i)=>{const old=by.get(String(x.id));return `<tr><td>${i+1}</td><td>${esc(x.admission_no)}</td><td><b>${esc(x.full_name)}</b></td><td><input class="mval mark-input" data-id="${x.id}" type="number" min="0" max="100" step="1" value="${old?.marks??''}" inputmode="numeric" placeholder="—"></td><td><input class="mcomment comment-input" data-id="${x.id}" value="${esc(old?.teacher_comment||'')}" placeholder="Optional"></td></tr>`}).join(''))}<div class="save-row"><span id="markStatus" class="hint">Enter marks for any learners, then save.</span><button class="primary-action" onclick="saveManualMarks('${className.replace(/'/g,"\\'")}')">Save Marks</button></div>`;
  }catch(e){markTable.innerHTML=`<div class="error-state"><strong>Unable to load learners</strong><p>${esc(e.message)}</p><button class="btn-light" onclick="loadStudentsForMarks()">Try again</button></div>`}
}
async function saveManualMarks(className){
  const entries=[...document.querySelectorAll('.mval')].map(x=>({student_id:x.dataset.id,marks:x.value,teacher_comment:document.querySelector('.mcomment[data-id="'+x.dataset.id+'"]').value})).filter(x=>x.marks!=='');
  const invalid=entries.some(x=>!Number.isFinite(Number(x.marks))||Number(x.marks)<0||Number(x.marks)>100);
  if(invalid)return alert('Marks must be between 0 and 100.');
  if(!entries.length)return alert('Enter at least one mark.');
  const btn=document.querySelector('.save-row .primary-action');if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{await api('/api/marks/bulk',{method:'POST',body:JSON.stringify({exam_id:markExam.value,subject_id:markAssignment.value,class_name:className,entries})});const st=document.getElementById('markStatus');if(st)st.textContent=`✓ ${entries.length} mark${entries.length===1?'':'s'} saved successfully.`;loadStudentsForMarks()}catch(e){const st=document.getElementById('markStatus');if(st)st.textContent=e.message;if(btn){btn.disabled=false;btn.textContent='Save Marks'}}
}
function downloadTemplate(){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,admission_no,marks,teacher_comment%0A, ,';a.download='green-star-marks-template.csv';a.click()}
async function uploadCsv(){const file=csvFile.files[0];const opt=markAssignment.options[markAssignment.selectedIndex];if(!file||!opt)return alert('Select an assignment and CSV file first.');const text=await file.text();const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length<2)return alert('CSV has no learner rows.');const headers=lines[0].split(',').map(x=>x.trim().toLowerCase());const ai=headers.indexOf('admission_no'),mi=headers.indexOf('marks'),ci=headers.indexOf('teacher_comment');if(ai<0||mi<0)return alert('CSV must contain admission_no and marks columns.');const students=await api('/api/students');const className=opt.dataset.class;const byAdm=new Map(students.filter(x=>String(x.class_name||'').trim().toLowerCase()===className.toLowerCase()).map(x=>[String(x.admission_no).trim().toLowerCase(),x]));const entries=[];let skipped=0;for(const line of lines.slice(1)){const cols=line.split(',');const st=byAdm.get(String(cols[ai]||'').trim().toLowerCase());const marks=Number(cols[mi]);if(!st||!Number.isFinite(marks)||marks<0||marks>100){skipped++;continue}entries.push({student_id:st.id,marks,teacher_comment:ci>=0?cols.slice(ci).join(',').trim():''})}if(!entries.length)return alert('No valid rows matched your assigned class.');await api('/api/marks/bulk',{method:'POST',body:JSON.stringify({exam_id:markExam.value,subject_id:markAssignment.value,class_name:className,entries})});csvStatus.textContent=`Uploaded ${entries.length} learner(s). ${skipped} row(s) skipped.`}
function analysis(){shell('Exam Analytics','Review CBC performance within your assigned teaching scope.',`<div class="grid"><select id="analysisExam">${exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.term)} ${x.academic_year}</option>`).join('')}</select><button onclick="runAnalysis()">Analyse Exam</button></div><div id="analysisOut" style="margin-top:15px"></div>`)}
async function runAnalysis(){const d=await api('/api/analytics/exams/'+analysisExam.value);const c=d.byClass.reduce((a,x)=>a+Number(x.marks||0),0),avg=d.byClass.length?d.byClass.reduce((a,x)=>a+Number(x.average||0),0)/d.byClass.length:0;const grade=d.byClass.reduce((a,x)=>{a.EE+=Number(x.ee||0);a.ME+=Number(x.me||0);a.AE+=Number(x.ae||0);a.BE+=Number(x.be||0);return a},{EE:0,ME:0,AE:0,BE:0});analysisOut.innerHTML=`<div class="stats"><div class="statbox"><span>Assigned classes</span><strong>${d.byClass.length}</strong></div><div class="statbox"><span>Marks recorded</span><strong>${c}</strong></div><div class="statbox"><span>Average</span><strong>${avg.toFixed(1)}%</strong></div><div class="statbox"><span>Top CBC level</span><strong>${Object.entries(grade).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}</strong></div></div><div class="grid2"><div class="panel"><h3>Grade Breakdown</h3>${['EE','ME','AE','BE'].map(k=>{const total=Object.values(grade).reduce((a,b)=>a+b,0)||1,p=(grade[k]/total)*100;return `<div class="barrow"><b>${k}</b><div class="bar"><i style="width:${p}%"></i></div><span>${grade[k]}</span></div>`}).join('')}</div><div class="panel"><h3>Subject Breakdown</h3>${d.bySubject.map(x=>`<div class="barrow"><b title="${esc(x.name)}">${esc(x.name).slice(0,12)}</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(x.average||0)))}%"></i></div><span>${Number(x.average||0).toFixed(1)}%</span></div>`).join('')||'<p class="muted">No subject data in this assessment.</p>'}</div></div>${table(['Class','Learners','Marks','Average','EE','ME','AE','BE'],d.byClass.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${x.students}</td><td>${x.marks}</td><td>${Number(x.average).toFixed(1)}%</td><td>${x.ee}</td><td>${x.me}</td><td>${x.ae}</td><td>${x.be}</td></tr>`))}`}
function classTeacherClasses(){return [...new Set(assignments.filter(x=>x.assignment_type==='class_teacher').map(x=>x.class_name))]}
function merit(){const ct=classTeacherClasses();shell('Class Merit List','Generate the ranking for a class assigned to you as class teacher.',`<div class="scope"><strong>Class-teacher classes:</strong> ${ct.map(esc).join(' · ')||'No class-teacher assignment yet.'}</div><div class="grid"><select id="meritExam">${exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.term)} ${x.academic_year}</option>`).join('')}</select><select id="meritClass">${ct.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button onclick="loadMerit()">View Merit</button><button class="btn-light" onclick="downloadMerit()">Download</button></div><div id="meritOut" style="margin-top:15px"></div>`)}
async function loadMerit(){const d=await api('/api/results/'+meritExam.value+'/class/'+encodeURIComponent(meritClass.value));meritOut.innerHTML=table(['Position','Admission','Learner','Class','Subjects','Total','Average'],d.map(x=>`<tr><td><b>${x.position}</b></td><td>${esc(x.admission_no)}</td><td>${esc(x.full_name)}</td><td>${esc(x.class_name)}</td><td>${x.subjects}</td><td>${Number(x.total).toFixed(0)}</td><td>${Number(x.average).toFixed(1)}%</td></tr>`))}
function downloadMerit(){if(!meritClass.value)return alert('Select a class.');downloadDoc('/api/documents/merit/'+meritExam.value+'?class_name='+encodeURIComponent(meritClass.value),'green-star-class-merit-list.html')}
function results(){const ct=classTeacherClasses();shell('Result Slips','Download result slips or print a complete term report for learners in your assigned class.',`<div class="grid"><select id="resultExam">${exams.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.term)} ${x.academic_year}</option>`).join('')}</select><select id="resultClass">${ct.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button onclick="loadResults()">Load Learners</button></div><div class="grid" style="margin-top:10px"><input id="teacherTermYear" type="number" min="2000" max="2100" value="${new Date().getFullYear()}" placeholder="Academic year"><select id="teacherTerm"><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select></div><p class="muted" style="margin:8px 0 0">The term selector controls the Full Term Report. The report includes Opener, Mid and End assessments for the selected term.</p><div id="resultOut" style="margin-top:15px"></div>`)}
async function loadResults(){const d=await api('/api/results/'+resultExam.value+'/class/'+encodeURIComponent(resultClass.value));resultOut.innerHTML=table(['Learner','Admission','Average','Position','Action'],d.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.admission_no)}</td><td>${Number(x.average).toFixed(1)}%</td><td>${x.position}</td><td><button class="mini" onclick="downloadDoc('/api/documents/result/${resultExam.value}/${x.id}','green-star-result-slip.html')">Result Slip</button> <button class="mini" onclick="downloadTeacherTermReport(${x.id})">Full Term Report</button></td></tr>`))}
function downloadTeacherTermReport(studentId){const y=document.getElementById('teacherTermYear')?.value,t=document.getElementById('teacherTerm')?.value;if(!y||!t)return alert('Select an academic year and term first.');downloadDoc('/api/documents/term-report/'+studentId+'?download=html&academic_year='+encodeURIComponent(y)+'&term='+encodeURIComponent(t)+'&download_token='+encodeURIComponent(token),'green-star-'+t.replace(/\s+/g,'-').toLowerCase()+'-term-report.html')}
async function examBank(){const subjectA=assignments.filter(x=>x.assignment_type==='subject');let q=await api('/api/exam-bank');shell('Exam Bank','Create, review and delete questions only for your assigned learning areas and classes.',`<div class="scope"><strong>Question-bank scope:</strong> ${subjectA.map(x=>esc(x.subject_name)+' — '+esc(x.class_name)).join(' · ')||'No subject assignment yet.'}</div><div class="panel"><h3>Add CBC Question</h3><form id="qf" class="grid"><select id="qbAssign">${assignmentOptions()}</select><input id="qTerm" placeholder="Term"><input id="qTopic" placeholder="Topic"><select id="qType"><option>Short Answer</option><option>Multiple Choice</option><option>Structured</option><option>Practical</option></select><input id="qMarks" type="number" min="1" value="1"><textarea id="qText" placeholder="Question" required style="grid-column:1/-1;min-height:90px"></textarea><input id="qA" placeholder="Option A"><input id="qB" placeholder="Option B"><input id="qC" placeholder="Option C"><input id="qD" placeholder="Option D"><input id="qAns" placeholder="Answer"><button>Add Question</button></form></div><div style="margin-top:14px">${table(['Class','Learning Area','Topic','Type','Question','Marks','Action'],q.map(x=>`<tr><td>${esc(x.class_name)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.topic||'—')}</td><td>${esc(x.question_type)}</td><td>${esc(x.question_text)}</td><td>${x.marks}</td><td>${Number(x.created_by)===Number(user.id)?`<button class="mini danger" onclick="deleteQuestion(${x.id})">Delete</button>`:'—'}</td></tr>`))}</div>`);qf.onsubmit=async e=>{e.preventDefault();const o=qbAssign.options[qbAssign.selectedIndex];await api('/api/exam-bank',{method:'POST',body:JSON.stringify({subject_id:qbAssign.value,class_name:o.dataset.class,term:qTerm.value,topic:qTopic.value,question_type:qType.value,question_text:qText.value,option_a:qA.value,option_b:qB.value,option_c:qC.value,option_d:qD.value,answer:qAns.value,marks:qMarks.value})});examBank()}}
async function deleteQuestion(id){if(confirm('Delete this question?')){await api('/api/exam-bank/'+id,{method:'DELETE'});examBank()}}
async function examResources(){const subjectA=assignments.filter(x=>x.assignment_type==='subject');let rows=await api('/api/exam-resources');shell('Exam Bank — Upload Exam Papers','Upload exam papers only for your assigned subject and class. Every upload is sent to the Admin Director and Secretary for approval before students can access it.',`<div class="scope"><b>Upload scope:</b> ${subjectA.map(x=>esc(x.subject_name)+' — '+esc(x.class_name)).join(' · ')||'No subject assignment yet.'}</div><div class="upload-box"><form id="erf" class="grid"><select id="erAssign" required>${assignmentOptions()}</select><input id="erTitle" placeholder="Exam title" required><input id="erTerm" placeholder="Term"><input id="erYear" type="number" placeholder="Academic year" value="${new Date().getFullYear()}"><input id="erDesc" placeholder="Description"><input id="erFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip" required><button class="primary-action">Upload for Approval</button></form><p class="hint">Maximum 10 MB. PDF, Word, PowerPoint, Excel and ZIP files are supported. Only your assigned subject/class can be selected.</p></div><div style="margin-top:14px">${table(['Exam','Class','Learning Area','File','Status','Review'],rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.class_name)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.original_filename)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${esc(x.review_note||'—')}</td></tr>`))}</div>`);erf.onsubmit=async e=>{e.preventDefault();const o=erAssign.options[erAssign.selectedIndex],file=erFile.files[0];if(!file)return alert('Select an exam file.');if(file.size>10*1024*1024)return alert('Exam file must be 10 MB or smaller.');const b64=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]||'');fr.onerror=reject;fr.readAsDataURL(file)});const r=await fetch('/api/exam-resources',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({subject_id:erAssign.value,class_name:o.dataset.class,title:erTitle.value,term:erTerm.value,academic_year:erYear.value,description:erDesc.value,original_filename:file.name,mime_type:file.type||'application/octet-stream',file_base64:b64})});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');alert('Exam uploaded for approval.');examResources()}}
function myAssignments(){const rows=assignments.map(x=>`<tr><td>${x.assignment_type==='class_teacher'?'Class Teacher':'Subject Teacher'}</td><td>${esc(x.class_name)}</td><td>${esc(x.subject_name||'All learning areas')}</td><td><span class="badge">Active</span></td></tr>`);shell('My Assignments','These responsibilities are set by the administrator and control what you can enter or download.',table(['Role','Class','Learning Area','Status'],rows)||'<p class="muted">No assignments yet.</p>')}
async function communication(){const rows=await api('/api/communications');shell('Communication Centre','Live school messages relevant to you.',`${rows.length?rows.map(c=>`<div class="card"><h3>${esc(c.title||'School Communication')}</h3><p class="muted">${new Date(c.created_at).toLocaleString()} · ${esc(c.sender||'School Administration')}</p><p>${esc(c.message).replace(/\n/g,'<br>')}</p></div>`).join(''):'<div class="empty-state">No school communications have been sent to you yet.</div>'}`)}
function calendar(){location.href='/calendar'}
init().catch(e=>shell('Teacher setup error','Please ask the administrator to check your assignments',`<p class="err">${esc(e.message)}</p>`));

async function students(){const classes=await api('/api/my/class-teacher-classes');if(!classes.length){shell('My Class Register','No class-teacher assignment has been given to your account.',`<div class="empty-state"><div class="empty-icon">🎓</div><h3>No class assigned</h3><p>Ask administration to assign you as a class teacher first.</p></div>`);return}let active=classes[0],d=await api('/api/students?class_name='+encodeURIComponent(active));const opts=classes.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');const rows=x=>x.map(y=>`<tr><td>${esc(y.admission_no)}</td><td><b>${esc(y.full_name)}</b><br><small>Ass: ${esc(y.assessment_number||'—')} · Birth Cert: ${esc(y.birth_certificate_number||'—')}</small></td><td>${esc(y.gender||'')}</td><td>${esc(y.stream||'')}</td><td>${esc(y.parent_phone||'')}</td><td><button class="mini" onclick="teacherEditStudent(${y.id})">Edit</button> <button class="mini danger" onclick="teacherDeleteStudent(${y.id})">Delete</button></td></tr>`);const render=()=>{bodyEl.querySelector('#teacherRegisterTable').innerHTML=table(['Admission','Student / IDs','Gender','Stream','Contact','Actions'],rows(d))};shell('My Class Register','Maintain learners for your assigned class only.',`<div class="card"><h3>Register Student</h3><form id="tsf" class="grid"><select id="tsc" required>${opts}</select><input id="tsa" placeholder="Admission No." required><input id="tsn" placeholder="Student full name" required><input id="tsass" placeholder="Assessment No."><input id="tsbc" placeholder="Birth Certificate No."><input id="tss" placeholder="Stream"><select id="tsg"><option value="">Gender</option><option>Male</option><option>Female</option></select><input id="tsdob" type="date"><input id="tspn" placeholder="Parent / Guardian name"><input id="tspp" placeholder="Parent / Guardian phone"><button type="submit">Add Student</button></form></div><div class="actions"><select id="tsfilter">${opts}</select><button type="button" onclick="downloadTeacherRegister()">Download Class Register</button></div><div id="teacherRegisterTable">${table(['Admission','Student / IDs','Gender','Stream','Contact','Actions'],rows(d))}</div>`);tsfilter.value=active;tsfilter.onchange=async()=>{active=tsfilter.value;d=await api('/api/students?class_name='+encodeURIComponent(active));render()};tsf.onsubmit=async e=>{e.preventDefault();try{await api('/api/students',{method:'POST',body:JSON.stringify({admission_no:tsa.value.trim(),full_name:tsn.value.trim(),assessment_number:tsass.value.trim(),birth_certificate_number:tsbc.value.trim(),class_name:tsc.value,stream:tss.value.trim(),gender:tsg.value,date_of_birth:tsdob.value,parent_name:tspn.value.trim(),parent_phone:tspp.value.trim()})});alert('Student registered successfully.');students()}catch(err){alert(err.message)}};window.downloadTeacherRegister=()=>downloadDoc('/api/documents/class-register?class_name='+encodeURIComponent(tsfilter.value),tsfilter.value.replace(/\s+/g,'-').toLowerCase()+'-class-register.html');window.teacherEditStudent=async id=>{const x=await api('/api/students/'+id);const fields=[['Admission No.','admission_no'],['Student name','full_name'],['Assessment No.','assessment_number'],['Birth Certificate No.','birth_certificate_number'],['Stream','stream'],['Gender','gender'],['Date of birth','date_of_birth'],['Parent / Guardian name','parent_name'],['Parent / Guardian phone / Link ID','parent_phone']];const v={};for(const [label,key] of fields){const val=prompt(label+':',x[key]||'');if(val===null)return;v[key]=val.trim()}try{await api('/api/students/'+id,{method:'PATCH',body:JSON.stringify(v)});students()}catch(e){alert(e.message)}};window.teacherDeleteStudent=async id=>{if(confirm('Delete this student from the register?')){try{await api('/api/students/'+id,{method:'DELETE'});students()}catch(e){alert(e.message)}}}}
async function leave(){const rows=await api('/api/leave-requests');shell('Leave Out Request','Send your leave request to the Director for approval.',`<form id="lf" class="grid"><select id="lt"><option>Annual Leave</option><option>Sick Leave</option><option>Personal Leave</option><option>Emergency Leave</option><option>Other</option></select><input id="ls" type="date" required><input id="le" type="date" required><textarea id="lr" placeholder="Reason for leave" required style="grid-column:1/-1;min-height:90px"></textarea><button>Submit to Director</button></form><h3 style="margin-top:18px">My Leave Requests</h3>${table(['Type','Dates','Status','Director Note','Letter'],rows.map(x=>`<tr><td>${esc(x.leave_type)}</td><td>${esc(x.start_date)} to ${esc(x.end_date)}</td><td>${esc(x.status)}</td><td>${esc(x.director_note||'—')}</td><td>${x.status==='approved'?`<button class="mini" onclick="downloadDoc('/api/documents/leave/${x.id}','approved-leave-out-letter.html')">Download Approved Letter</button>`:'—'}</td></tr>`))}`);lf.onsubmit=async e=>{e.preventDefault();await api('/api/leave-requests',{method:'POST',body:JSON.stringify({leave_type:lt.value,start_date:ls.value,end_date:le.value,reason:lr.value})});alert('Leave request sent to Director.');leave()}}
async function attendance(){const rows=await api('/api/staff-attendance/my');shell('Staff Sign In / Out','Sign in when you arrive and sign out when you leave each school day.',`<div class="actions"><button onclick="checkIn()">✓ Sign In Now</button><button onclick="checkOut()">↪ Sign Out Now</button></div><div style="margin-top:16px">${table(['Date','Sign In','Sign Out'],rows.map(x=>`<tr><td>${esc(x.attendance_date)}</td><td>${x.check_in?new Date(x.check_in).toLocaleTimeString():'—'}</td><td>${x.check_out?new Date(x.check_out).toLocaleTimeString():'—'}</td></tr>`))}</div>`)}async function checkIn(){try{await api('/api/staff-attendance/check-in',{method:'POST'});alert('Signed in successfully.');attendance()}catch(e){alert(e.message)}}async function checkOut(){try{await api('/api/staff-attendance/check-out',{method:'POST'});alert('Signed out successfully.');attendance()}catch(e){alert(e.message)}}
async function myPayroll(){try{const d=await api('/api/payroll/my');const target=typeof shell==='function'?shell:null;if(target){target('My Payroll','View your own live payroll status.',`<div class="card"><h3>${esc(d.staff.full_name)}</h3>${table(['Month','Gross','Deductions','Net','Status','Payslip'],d.entries.map(x=>`<tr><td>${x.payroll_year}-${String(x.payroll_month).padStart(2,'0')}</td><td>KSh ${Number(x.gross_pay||0).toLocaleString()}</td><td>KSh ${Number(x.total_deductions||0).toLocaleString()}</td><td><b>KSh ${Number(x.net_pay||0).toLocaleString()}</b></td><td>${esc(x.status||x.period_status||'—')}</td><td><button onclick="downloadDoc('/api/documents/payslip/${x.id}','my-payslip-${x.payroll_year}-${x.payroll_month}.html')">Download</button></td></tr>`))}</div>`)}else{alert('Payroll module is available from Staff Workspace.')}}catch(e){alert(e.message)}}
</script>
