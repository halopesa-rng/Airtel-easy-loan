<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription & Payment</title><link rel="stylesheet" href="/styles.css"><script src="/tenant-brand.js" defer></script></head><body><main style="max-width:900px;margin:30px auto;padding:20px"><div class="card"><h1>your school Subscription</h1><div id="status">Loading...</div></div><div class="card"><h2>Pay Subscription by M-Pesa</h2><div id="paymentInfo">Loading payment instructions...</div><form id="pay"><input id="amount" type="number" min="1" required placeholder="Amount (KSh)"><input id="phone" required placeholder="Phone used to make M-Pesa payment"><input id="receipt" required maxlength="32" placeholder="M-Pesa transaction code"><input id="reference" readonly placeholder="Invoice reference"><button>Submit Payment</button></form><p id="msg"></p></div><script>const token=localStorage.getItem('gs_token')||localStorage.getItem('token')||'';const api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};let currentInvoice=null;async function load(){const d=await api('/api/subscription/status');const l=d.license;status.innerHTML=l?`<h3>Status: ${l.status}</h3><p>Plan: ${l.plan||'—'}</p><p>Valid until: ${l.valid_until?new Date(l.valid_until).toLocaleDateString():'—'}</p><p>Grace until: ${l.grace_until?new Date(l.grace_until).toLocaleDateString():'—'}</p>${d.developer_portal_url?`<p><a href="${d.developer_portal_url}" target="_blank" rel="noopener">Developer Licensing Portal →</a></p>`:''}`:'<p>Licensing has not been configured for this installation.</p>';const s=await api('/api/subscription/payment-info');currentInvoice=s.invoice||null;if(!currentInvoice){paymentInfo.innerHTML='<p>No unpaid invoice is currently available.</p>';return}amount.value=currentInvoice.amount;reference.value=currentInvoice.invoice_no;const cfg=s.payment||{};paymentInfo.innerHTML=`<p><strong>Invoice:</strong> ${currentInvoice.invoice_no}</p><p><strong>Amount:</strong> KSh ${Number(currentInvoice.amount).toLocaleString()}</p><p><strong>Due:</strong> ${new Date(currentInvoice.due_date).toLocaleDateString()}</p><p><strong>Pay subscription via M-Pesa Till Number:</strong> <strong>${cfg.mpesa_number||'1677484'}</strong>${cfg.account_name?` (${cfg.account_name})`:''}</p><p>After paying, enter the M-Pesa transaction code below. The developer will verify it against the M-Pesa notification/statement before your subscription is renewed.</p>`}pay.onsubmit=async e=>{e.preventDefault();try{if(!currentInvoice)throw Error('No unpaid invoice is available');const d=await api('/api/subscription/payment',{method:'POST',body:JSON.stringify({invoice_id:currentInvoice.id,amount:Number(amount.value),payer_phone:phone.value.trim(),mpesa_receipt:receipt.value.trim(),raw_reference:reference.value,mode:'manual'})});msg.textContent=d.message||'Payment submitted for developer verification.';receipt.value='';phone.value='';await load()}catch(e){msg.textContent=e.message}};load().catch(e=>status.textContent=e.message);</script></main></body></html>
