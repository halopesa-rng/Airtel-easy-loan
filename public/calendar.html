<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>your school — School Calendar</title><style>:root{--g:#087443;--b:#2563eb;--ink:#172033;--muted:#64748b;--bg:#f4f7fb;--line:#e5eaf0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--g),#0a8150);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--b);color:#fff;font-weight:800;cursor:pointer}.light{background:#e7eefc;color:var(--b)}main{max-width:1200px;margin:auto;padding:24px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 7px 25px #102a4309}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:12px;font-weight:800;color:#475569}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:10px;margin-top:5px}.event{padding:15px;border:1px solid var(--line);border-left:5px solid var(--g);border-radius:12px;margin:10px 0;background:#fbfdfc}.muted{color:var(--muted)}@media(max-width:650px){main{padding:14px}.grid{grid-template-columns:1fr}header{padding:14px}.hideMob{display:none}}</style><link rel="stylesheet" href="/ui-polish.css?v=1.3.5"><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><div class="gs-standalone-identity"><img src="/logo.png" alt="your school logo"><div><strong>your school</strong><small>Official School Management System</small></div></div><header><div><b>your school — School Calendar</b><small style="display:block;opacity:.8">Academic, administrative and school events</small></div><div><button class="btn light" onclick="history.length>1?history.back():location.href='/'">← Back</button> <button class="btn" onclick="download()">⬇ Download / Print</button></div></header><main><section class="hero"><h1>Official School Calendar</h1><p class="muted">Keep examinations, meetings, opening/closing dates, activities and important school events in one shared calendar.</p></section><section id="manage" class="card" style="display:none"><h2>Add Calendar Event</h2><form id="form"><div class="grid"><div><label>Title</label><input name="title" required></div><div><label>Date</label><input name="event_date" type="date" required></div><div><label>Start time</label><input name="start_time" type="time"></div><div><label>End time</label><input name="end_time" type="time"></div><div><label>Category</label><select name="category"><option>Academic</option><option>Examination</option><option>Meeting</option><option>School Activity</option><option>Holiday</option><option>Admissions</option><option>Sports</option><option>Other</option></select></div><div><label>Location</label><input name="location"></div></div><label>Description</label><textarea name="description" rows="3"></textarea><br><button class="btn">Save Event</button></form></section><section class="card"><div id="events"></div></section></main><script>const T=localStorage.gs_token,me=JSON.parse(localStorage.gs_user||'null'),editable=['admin','director','principal','secretary'].includes(me?.role);if(!T||!me)location='/';if(editable)document.getElementById('manage').style.display='block';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));async function api(u,o={}){const h={'Authorization':'Bearer '+T};if(o.body){h['Content-Type']='application/json';o.body=JSON.stringify(o.body)}const r=await fetch(u,{...o,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const r=await api('/api/calendar');$('events').innerHTML=r.map(x=>`<div class="event"><b>${new Date(x.event_date).toLocaleDateString()}</b> — <strong>${esc(x.title)}</strong><div class="muted">${esc(x.category||'School')}${x.start_time?' · '+x.start_time:''}${x.end_time?' - '+x.end_time:''}${x.location?' · '+esc(x.location):''}</div>${x.description?`<p>${esc(x.description)}</p>`:''}${editable?`<button class="btn" onclick="del(${x.id})">Delete</button>`:''}</div>`).join('')||'<p class="muted">No calendar events have been added yet.</p>'}catch(e){$('events').innerHTML='<p>'+esc(e.message)+'</p>'}}async function del(id){if(confirm('Delete this calendar event?')){await api('/api/calendar/'+id,{method:'DELETE'});load()}}async function download(){try{const r=await fetch('/api/calendar/pdf',{headers:{Authorization:'Bearer '+T},cache:'no-store'});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Unable to generate the school calendar PDF.')}const type=r.headers.get('content-type')||'';if(!type.includes('application/pdf'))throw Error('The calendar server did not return a valid PDF.');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GreenStar_School_Calendar.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message)}}if(editable)$('form').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/api/calendar',{method:'POST',body:d});e.target.reset();load()}catch(x){alert(x.message)}};load();</script><script src="/ai-assistant.js"></script><script src="/ui-brand.js"></script><script src="/app-navigation.js?v=1.7.5"></script><script src="/navigation-templates.js?v=1.7.5"></script></body></html>
