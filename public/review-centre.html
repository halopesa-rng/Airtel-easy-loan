<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Centre — your school</title><link rel="stylesheet" href="/styles.css?v=1.8.5"><style>body{background:#f4f8f7}.wrap{max-width:1200px;margin:20px auto;padding:0 14px}.card{background:#fff;border:1px solid #dfe7e3;border-radius:14px;padding:16px;margin:14px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{padding:10px 13px;border:0;border-radius:9px;background:#08623d;color:#fff;font-weight:800}.row{border:1px solid #dfe7e3;border-radius:12px;padding:13px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#b42318!important}.warn{background:#b54708!important}.light{background:#eaf3ef!important;color:#075f3c!important}.muted{color:#667085}table{width:100%;border-collapse:collapse}th,td{border:1px solid #dfe7e3;padding:7px;text-align:left;font-size:12px}th{background:#e8f3ee}@media(max-width:700px){table{display:block;overflow:auto;white-space:nowrap}}</style><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Review Centre</b><span id="who"></span><button onclick="location.href='/'">Home</button></header><main class="wrap"><section class="card"><h1>Reports & Approval Centre</h1><p class="muted">Pending teacher submissions, patron reports and approved documents are available here. Admin, Director and Principal can approve/reject; Secretary can review and download.</p><div class="tabs"><button onclick="show('syllabus')">Syllabus Coverage</button><button onclick="show('subject')">Student Reports</button><button onclick="show('exam')">Exam Bank</button><button onclick="show('patron')">Patron Reports</button><button onclick="show('term')">Full Term Report</button></div></section><section id="out" class="card">Loading…</section></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');const mg=['admin','director','principal'].includes(user?.role),staff=['admin','director','principal','secretary'].includes(user?.role);if(!token||!staff)location.href='/';who.textContent=(user.full_name||'')+' ('+user.role+')';
async function api(u,o={}){const r=await fetch(u,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function dl(url,name){try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert(e.message)}}
async function show(type){out.innerHTML='<p>Loading…</p>';try{if(type==='syllabus')return syllabus();if(type==='subject')return subject();if(type==='exam')return exam();if(type==='patron')return patron();return term()}catch(e){out.innerHTML='<p>'+esc(e.message)+'</p>'}}
async function syllabus(){const rows=await api('/api/syllabus-coverage');out.innerHTML='<h2>Syllabus Coverage</h2>'+rows.map(r=>`<article class="row"><b>${esc(r.subject_name)}</b> — ${esc(r.class_name)} · ${esc(r.term)} ${esc(r.academic_year)}<p>Teacher: ${esc(r.teacher_name)} · Coverage: ${Number(r.coverage_percent||0).toFixed(0)}% · <b>${esc(r.status)}</b></p><p>${esc(r.teacher_comment||'')}</p><div class="actions">${mg&&r.status!=='approved'?`<button onclick="review('/api/syllabus-coverage/${r.id}','approved')">Approve</button>`:''}${mg&&r.status!=='rejected'?`<button class="warn" onclick="review('/api/syllabus-coverage/${r.id}','rejected')">Reject</button>`:''}${r.status==='approved'?`<button class="light" onclick="dl('/api/documents/syllabus-coverage/${r.id}?download=1','syllabus-coverage-${r.id}.pdf')">Download PDF</button>`:''}${mg?`<button class="danger" onclick="del('/api/syllabus-coverage/${r.id}')">Delete</button>`:''}</div></article>`).join('')||'<p class="muted">No syllabus reports.</p>'}
async function subject(){const rows=await api('/api/student-subject-reports');out.innerHTML='<h2>Student Subject Reports</h2>'+rows.map(r=>`<article class="row"><b>${esc(r.student_name)}</b> — ${esc(r.subject_name)} · ${esc(r.class_name)} · ${esc(r.term)} ${esc(r.academic_year)}<p>Teacher: ${esc(r.teacher_name)} · <b>${esc(r.status)}</b></p><p>${esc(r.general_comment||'')}</p><div class="actions">${mg&&r.status!=='approved'?`<button onclick="review('/api/student-subject-reports/${r.id}','approved')">Approve</button>`:''}${mg&&r.status!=='rejected'?`<button class="warn" onclick="review('/api/student-subject-reports/${r.id}','rejected')">Reject</button>`:''}${r.status==='approved'?`<button class="light" onclick="dl('/api/documents/student-subject-report/${r.id}?download=1','student-subject-report-${r.id}.pdf')">Download PDF</button>`:''}${mg?`<button class="danger" onclick="del('/api/student-subject-reports/${r.id}')">Delete</button>`:''}</div></article>`).join('')||'<p class="muted">No student reports.</p>'}
async function exam(){const rows=await api('/api/exam-bank');out.innerHTML='<h2>Exam Bank</h2><div class="actions"><button class="light" onclick="dl(\'/api/documents/exam-bank?download=1\',\'GreenStar-Exam-Bank.pdf\')">Download PDF</button></div>'+rows.map(r=>`<article class="row"><b>${esc(r.subject_name)}</b> — ${esc(r.class_name)} · ${esc(r.topic||'—')} · ${esc(r.question_type)}<p>${esc(r.question_text)}</p><p>Submitted by ${esc(r.creator||'')} · ${Number(r.marks||1)} mark(s) · <b>${esc(r.status||'pending')}</b>${r.review_note?' · '+esc(r.review_note):''}</p><div class="actions">${mg&&r.status!=='approved'?`<button onclick="review('/api/exam-bank/${r.id}','approved')">Approve</button>`:''}${mg&&r.status!=='rejected'?`<button class="warn" onclick="review('/api/exam-bank/${r.id}','rejected')">Reject</button>`:''}${mg?`<button class="danger" onclick="del('/api/exam-bank/${r.id}')">Delete</button>`:''}</div></article>`).join('')||'<p class="muted">No exam-bank questions.</p>'}
async function patron(){out.innerHTML=`<h2>Patron Reports</h2><p class="muted">Select dates and download the official PDF reports.</p><div class="card"><label>From <input id="pf" type="date"></label> <label>To <input id="pt" type="date"></label><div class="actions" style="margin-top:10px"><button onclick="dlPatron('attendance')">Download Attendance PDF</button><button onclick="dlPatron('welfare')">Download Welfare PDF</button></div></div><div class="row">Management and Secretary can also open the full Patron Reports module from the notification link.</div>`;const t=new Date().toISOString().slice(0,10);pf.value=t;pt.value=t}
function dlPatron(type){const from=pf.value,to=pt.value;if(!from||!to)return alert('Select From and To dates.');let q=`from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&download=1`;dl('/api/patron/reports/'+type+'?'+q,'boarding-'+type+'-'+from+'-to-'+to+'.pdf')}
async function term(){const students=await api('/api/students');out.innerHTML='<h2>Full Term Report PDF</h2><div class="card"><label>Learner<select id="ts">'+students.map(s=>`<option value="${s.id}">${esc(s.admission_no)} — ${esc(s.full_name)}</option>`).join('')+'</select></label><label>Academic year<input id="ty" type="number" value="${new Date().getFullYear()}"></label><label>Term<select id="tt"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label><button style="margin-top:10px" onclick="downloadTerm()">Download Full Term PDF</button></div>'}
function downloadTerm(){dl(`/api/documents/term-report/${ts.value}?download=html&academic_year=${encodeURIComponent(ty.value)}&term=${encodeURIComponent(tt.value)}`,`full-term-report-${ts.value}-${ty.value}-${tt.value}.html`)}
async function review(url,status){let note='';if(status==='rejected'){note=prompt('Reason for rejection:')||'';if(!note.trim())return}try{await api(url,{method:'PATCH',body:JSON.stringify({status,review_note:note})});show(location.hash.includes('syllabus')?'syllabus':location.hash.includes('subject')?'subject':location.hash.includes('exam')?'exam':'subject')}catch(e){alert(e.message)}}
async function del(url){if(!confirm('Delete this record permanently?'))return;try{await api(url,{method:'DELETE'});location.reload()}catch(e){alert(e.message)}}
show(location.hash.includes('syllabus')?'syllabus':location.hash.includes('subject')?'subject':location.hash.includes('exam')?'exam':location.hash.includes('patron')?'patron':'term');
</script></body></html>
