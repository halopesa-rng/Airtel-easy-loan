<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Classes & Meetings</title><link rel="stylesheet" href="/styles.css?v=1.3.5"><link rel="stylesheet" href="/online-module.css?v=1.7.0"><script src="/tenant-brand.js" defer></script></head><body>
<main class="gs-online-shell">
  <div class="gs-online-head"><div><h1>🎥 Online Classes & Meetings</h1><div class="gs-online-muted" id="welcome">Loading your online centre…</div></div><div class="gs-online-toolbar"><button class="gs-online-btn secondary" id="backBtn">← Dashboard</button></div></div>
  <section id="quickStart" class="gs-online-quick" hidden>
    <div><strong>Start a meeting now</strong><div class="gs-online-muted">One tap. Your school users can join from their Online Classes card. No separate school account is required.</div></div>
    <button class="gs-online-btn gs-online-start" id="instantBtn">▶ Start Meeting Now</button>
  </section>
  <section class="gs-online-grid" id="stats"></section>
  <section id="create" class="gs-online-card" hidden><h2>More options</h2><p class="gs-online-muted">Use this only when you need to schedule a class or meeting in advance.</p><form id="createForm" class="gs-online-form"><label>Type<select name="meeting_kind"><option value="class">Online Class</option><option value="meeting">Meeting</option></select></label><label>Title<input name="title" required placeholder="e.g. Mathematics - Form 2A"></label><label>Subject<select name="subject_id" id="subject"></select></label><label>Class / Group<select name="class_name" id="className"><option value="">Select class</option></select></label><label>Start<input name="scheduled_start" type="datetime-local" required></label><label>End<input name="scheduled_end" type="datetime-local"></label><label class="full">Description<textarea name="description" placeholder="Lesson topic, agenda or instructions"></textarea></label><label>Audience<select name="audience_role"><option value="">Class learners / selected participants</option><option value="teacher">All Teachers</option><option value="ustadh">All Ustadh</option><option value="parent">All Parents</option><option value="worker">All Workers</option><option value="secretary">All Secretaries</option></select></label><label><span>Options</span><span><input type="checkbox" name="recording_enabled"> Allow recording</span><span><input type="checkbox" name="chat_enabled" checked> Enable chat</span></label><div class="full gs-online-actions"><button class="gs-online-btn" type="submit">Schedule</button><button class="gs-online-btn secondary" type="button" id="cancelCreate">Cancel</button></div></form><p id="createMsg" class="gs-online-muted"></p></section>
  <section><div class="gs-online-toolbar"><button class="gs-online-btn secondary filter" data-filter="all">All</button><button class="gs-online-btn secondary filter" data-filter="live">Live Now</button><button class="gs-online-btn secondary filter" data-filter="scheduled">Upcoming</button><button class="gs-online-btn secondary filter" data-filter="completed">History</button><button class="gs-online-btn secondary" id="moreBtn" hidden>Schedule / More Options</button><button class="gs-online-btn secondary" id="refresh">Refresh</button></div><div id="meetingList" class="gs-online-list"></div></section>
</main>
<div id="room" class="gs-online-room"><div class="gs-online-roombar"><div><strong id="roomTitle">Meeting</strong><div id="roomCodeLabel" class="gs-online-roomcode"></div></div><div class="gs-online-actions"><button class="gs-online-btn secondary" id="chatToggle">Chat</button><button class="gs-online-btn danger" id="leaveRoom">Leave</button></div></div><div id="jitsi" class="gs-online-frame"></div><aside id="chatSide" class="gs-online-side"><strong>Meeting Chat</strong><div id="chatList" class="gs-online-chat-list"></div><form id="chatForm" class="gs-online-actions"><input id="chatInput" placeholder="Message" style="flex:1;padding:9px;border:1px solid #ccd8d3;border-radius:8px"><button class="gs-online-btn">Send</button></form></aside></div>
<script>
const token=()=>localStorage.getItem('gs_token')||'';const api=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+token()}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
let me=null,meetings=[],filter='all',current=null,sessionId=null,jitsiApi=null,jitsiConfig=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dashboard(){const r=me?.role||'';return '/'+(r||'index')+'.html'} function fmt(d){return d?new Date(d).toLocaleString():''}
const creatorRoles=['admin','director','principal','teacher','ustadh'];
async function loadMe(){me=await api('/api/me');$('welcome').textContent=`Signed in as ${me.full_name} • ${me.role}`;if(creatorRoles.includes(me.role)){$('quickStart').hidden=false;$('moreBtn').hidden=false}}
async function loadLookup(){const x=await api('/api/online/lookup');$('className').innerHTML='<option value="">Select class</option>'+x.classes.map(v=>`<option>${esc(v)}</option>`).join('');$('subject').innerHTML='<option value="">No subject / general meeting</option>'+x.subjects.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}
function renderStats(){const live=meetings.filter(x=>x.status==='live').length,up=meetings.filter(x=>x.status==='scheduled').length,done=meetings.filter(x=>x.status==='completed').length;const count=meetings.reduce((n,x)=>n+Number(x.participant_count||0),0);$('stats').innerHTML=[['Live now',live],['Upcoming',up],['Completed',done],['Participants',count]].map(x=>`<div class="gs-online-stat"><span class="gs-online-muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function render(){let rows=meetings;if(filter==='live')rows=rows.filter(x=>x.status==='live');if(filter==='scheduled')rows=rows.filter(x=>x.status==='scheduled');if(filter==='completed')rows=rows.filter(x=>x.status==='completed');$('meetingList').innerHTML=rows.length?rows.map(m=>`<article class="gs-online-card ${m.status==='live'?'live':''}"><h3>${esc(m.title)}</h3><div class="gs-online-meta"><span>${m.meeting_kind==='class'?'Class':'Meeting'}</span><span>•</span><span>${esc(m.subject_name||'General')}</span><span>•</span><span>${esc(m.class_name||'School-wide')}</span><span>•</span><span>${fmt(m.scheduled_start)}</span></div><p>${esc(m.description||'')}</p><div class="gs-online-meta"><span>Status: <b>${esc(m.status)}</b></span><span>Participants: ${m.participant_count||0}</span><span>Host: ${esc(m.host_name||'')}</span></div><div class="gs-online-actions">${m.status==='scheduled'||m.status==='live'?`<button class="gs-online-btn" onclick="openMeeting(${m.id})">${m.status==='live'?'Join Now':'Open / Join'}</button>`:''}${creatorRoles.includes(me.role)&&Number(m.host_user_id)===Number(me.id)?`${m.status==='scheduled'?`<button class="gs-online-btn secondary" onclick="startMeeting(${m.id})">Start Now</button>`:''}${m.status==='scheduled'?`<button class="gs-online-btn danger" onclick="cancelMeeting(${m.id})">Cancel</button>`:''}`:''}</div></article>`).join(''):'<div class="gs-online-empty">No meetings in this view.</div>'}
async function load(){try{meetings=await api('/api/online/meetings');renderStats();render()}catch(e){$('meetingList').innerHTML='<div class="gs-online-empty">'+esc(e.message)+'</div>'}}
$('backBtn').onclick=()=>location.href=dashboard();$('refresh').onclick=load;$('moreBtn').onclick=async()=>{if($('create').hidden){$('create').hidden=false;$('moreBtn').textContent='Hide Schedule Options';await loadLookup()}else{$('create').hidden=true;$('moreBtn').textContent='Schedule / More Options'}};$('cancelCreate').onclick=()=>{$('create').hidden=true;$('moreBtn').textContent='Schedule / More Options'};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
$('instantBtn').onclick=async()=>{const b={title:`Instant Meeting - ${me.full_name}`,meeting_kind:'meeting',recording_enabled:false};const btn=$('instantBtn');btn.disabled=true;btn.textContent='Starting…';try{const m=await api('/api/online/meetings/instant',{method:'POST',body:JSON.stringify(b)});await load();await openMeeting(m.id)}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='▶ Start Meeting Now'}};
$('createForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),b=Object.fromEntries(fd.entries());b.recording_enabled=fd.get('recording_enabled')==='on';b.chat_enabled=fd.get('chat_enabled')==='on';b.subject_id=b.subject_id?Number(b.subject_id):null;b.class_name=b.class_name||null;try{await api('/api/online/meetings',{method:'POST',body:JSON.stringify(b)});$('createMsg').textContent='Meeting scheduled successfully.';e.target.reset();$('create').hidden=true;$('moreBtn').textContent='Schedule / More Options';await load()}catch(err){$('createMsg').textContent=err.message}};
window.startMeeting=async id=>{try{await api('/api/online/meetings/'+id+'/start',{method:'POST'});await load();openMeeting(id)}catch(e){alert(e.message)}};window.cancelMeeting=async id=>{if(!confirm('Cancel this meeting?'))return;try{await api('/api/online/meetings/'+id+'/cancel',{method:'POST'});load()}catch(e){alert(e.message)}};
async function loadJitsiApi(){
  if(window.JitsiMeetExternalAPI)return true;
  if(!jitsiConfig)jitsiConfig=await api('/api/online/config');
  await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src=jitsiConfig.baseUrl+'/external_api.js';sc.onload=resolve;sc.onerror=()=>reject(Error('The school meeting server could not be loaded.'));document.head.appendChild(sc)});
  return !!window.JitsiMeetExternalAPI;
}
window.openMeeting=async id=>{try{const d=await api('/api/online/meetings/'+id);current=d;const j=await api('/api/online/meetings/'+id+'/join',{method:'POST',body:'{}'});const jt=await api('/api/online/meetings/'+id+'/token');sessionId=j.sessionId;$('roomTitle').textContent=d.meeting.title;$('roomCodeLabel').textContent='School meeting • '+j.roomCode;$('room').classList.add('open');$('jitsi').innerHTML='<div class="gs-online-loading">Opening your school meeting…</div>';await loadJitsiApi();$('jitsi').innerHTML='';jitsiApi=new JitsiMeetExternalAPI(jt.domain,{roomName:jt.roomCode,parentNode:$('jitsi'),width:'100%',height:'100%',jwt:jt.token,userInfo:{displayName:jt.user.name,email:jt.user.email||undefined},configOverwrite:{prejoinConfig:{enabled:false,hideDisplayName:true}},interfaceConfigOverwrite:{MOBILE_APP_PROMO:false,SHOW_JITSI_WATERMARK:false}});renderChat(d.chat||[])}catch(e){$('room').classList.remove('open');alert(e.message)}};
function renderChat(rows){$('chatList').innerHTML=rows.length?rows.map(x=>`<div class="gs-online-chat-item"><b>${esc(x.sender_name)}</b><br>${esc(x.message)}<div class="gs-online-muted" style="font-size:11px">${fmt(x.created_at)}</div></div>`).join(''):'<div class="gs-online-muted">No messages yet.</div>'}
async function refreshChat(){if(!current)return;const d=await api('/api/online/meetings/'+current.meeting.id);renderChat(d.chat||[])}$('chatToggle').onclick=()=>{$('chatSide').classList.toggle('open');if($('chatSide').classList.contains('open'))refreshChat()};$('chatForm').onsubmit=async e=>{e.preventDefault();const v=$('chatInput').value.trim();if(!v||!current)return;try{await api('/api/online/meetings/'+current.meeting.id+'/chat',{method:'POST',body:JSON.stringify({message:v})});$('chatInput').value='';refreshChat()}catch(err){alert(err.message)}};
async function leaveRoom(){if(!current)return;try{await api('/api/online/meetings/'+current.meeting.id+'/leave',{method:'POST',body:JSON.stringify({session_id:sessionId})})}catch{}if(jitsiApi){try{jitsiApi.dispose()}catch{}}jitsiApi=null;sessionId=null;current=null;$('room').classList.remove('open');$('chatSide').classList.remove('open');load()}$('leaveRoom').onclick=leaveRoom;window.addEventListener('beforeunload',()=>{if(current&&sessionId){fetch('/api/online/meetings/'+current.meeting.id+'/leave',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({session_id:sessionId})}).catch(()=>{})}});
(async()=>{try{await loadMe();await load();}catch(e){$('meetingList').innerHTML='<div class="gs-online-empty">'+esc(e.message)+'</div>'}})();
</script></body></html>
