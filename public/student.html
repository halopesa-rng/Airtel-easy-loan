Portal</h1><p class="muted">Access your school records and approved exam resources.</p></section><section class="card"><h2 style="margin-top:0">My School Records</h2><div class="actions" style="margin-bottom:14px"><button class="blue" onclick="location.href='/tahfidh.html?student_id='+encodeURIComponent(window._student?.s?.id||'')">🕌 Open Tahfidh Programme</button></div><div id="body">Loading...</div></section></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user||user.role!=='student')location.href='/';document.getElementById('user').textContent=user.full_name;
function api(u,o={}){const sep=u.includes('?')?'&':'?';u=u+sep+'_live='+Date.now();o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,{cache:'no-store',...o,headers:o.headers}).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||'Request failed');return d})}
function logout(){localStorage.clear();location.href='/'}
function downloadDoc(url,filename){try{const r=fetch(url,{headers:{Authorization:'Bearer '+token}});r.then(async res=>{if(!res.ok){let msg='Unable to download document';try{const t=await res.text();if(t)msg=t.slice(0,180)}catch(_){}throw Error(msg)}const blob=await res.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename||'school-document.html';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},2000)}).catch(e=>alert(e.message||'Unable to download document'))}catch(e){alert(e.message||'Unable to download document')}}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function requestPurchase(id){
  const student=window._student?.s||{};
  const phones=[];
  if(user.phone)phones.push({label:'My account number',phone:user.phone});
  if(student.parent_phone && student.parent_phone!==user.phone)phones.push({label:'Parent/guardian number',phone:student.parent_phone});
  const modal=document.createElement('div');modal.className='pay-modal';
  const phoneOptions=phones.length?phones.map((x,i)=>`<option value="${esc(x.phone)}">${esc(x.label)} — ${esc(x.phone)}</option>`).join(''):'<option value="">No saved phone number — enter below</option>';
  modal.innerHTML=`<div class="pay-box"><h3>Pay KSh 100 for Exam Resource</h3><p class="muted">Use M-Pesa from the phone number you choose below. Send exactly <b>KSh 100</b> to the school payment number.</p><div class="pay-destination"><b>Send Money To</b><br><span id="schoolPaymentNumber" style="font-size:24px">0724844844</span><br><span class="muted">Amount: KSh 100</span><br><button type="button" class="copy-btn" onclick="copyPaymentDetails()">Copy payment details</button></div><div class="pay-row"><label>Phone number used to make payment</label><select id="payerPhone">${phoneOptions}</select></div><div class="pay-row"><label>Or enter another M-Pesa number</label><input id="otherPayerPhone" inputmode="tel" placeholder="07XXXXXXXX or 01XXXXXXXX"></div><div class="pay-row"><label>M-Pesa transaction code/reference</label><input id="paymentRef" autocomplete="off" placeholder="e.g. QABC123XYZ"></div><div class="pay-row"><label>Paste M-Pesa payment details for verification</label><textarea id="paymentDetails" rows="4" placeholder="Paste the full M-Pesa confirmation message/details here"></textarea></div><p class="muted" style="font-size:13px">After submitting, the school finance officer will verify the payment and approve the download.</p><div class="pay-actions"><button type="button" class="pay-cancel" onclick="this.closest('.pay-modal').remove()">Cancel</button><button type="button" class="pay-submit" onclick="submitPaymentRequest(${id},this)">Send for Verification</button></div></div>`;
  document.body.appendChild(modal);
}
function copyPaymentDetails(){const text='your school Exam Resource Payment\nSend KSh 100 to 0724844844\nAfter payment, copy the M-Pesa transaction details and paste them in the verification field.';navigator.clipboard?.writeText(text).then(()=>alert('Payment details copied.')).catch(()=>prompt('Copy these payment details:',text))}
async function submitPaymentRequest(id,btn){const box=btn.closest('.pay-box');const selected=box.querySelector('#payerPhone').value.trim();const other=box.querySelector('#otherPayerPhone').value.trim();const payerPhone=other||selected;const ref=box.querySelector('#paymentRef').value.trim();const details=box.querySelector('#paymentDetails').value.trim();if(!payerPhone)return alert('Select or enter the phone number used for payment.');if(!ref&&!details)return alert('Enter the M-Pesa transaction code/reference or paste the payment details.');btn.disabled=true;btn.textContent='Submitting…';try{const d=await api('/api/exam-resources/'+id+'/purchase',{method:'POST',body:JSON.stringify({payment_method:'M-Pesa',payer_phone:payerPhone,reference:ref,payment_details:details})});box.closest('.pay-modal').remove();alert(d.message);loadResources()}catch(e){btn.disabled=false;btn.textContent='Send for Verification';alert(e.message)}}
async function downloadResource(id,name){try{const r=await fetch('/api/exam-resources/'+id+'/download?student_id='+encodeURIComponent(window._student?.s?.id||'')+'&_live='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+token}});if(!r.ok){let msg='Download is not available yet';try{const t=await r.text();if(t)msg=t.slice(0,220)}catch(_){}throw Error(msg)}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name||'exam-resource';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},2000)}catch(e){alert(e.message||'Unable to download resource')}}
async function loadResources(){try{const rows=await api('/api/exam-resources');resourceOut.innerHTML=rows.map(x=>{const ps=x.purchase_status||'none';let action='';if(ps==='paid'){action=`<button class="blue" onclick="downloadResource(${x.id})">⬇ Download Exam</button><p style="margin:8px 0 0;color:#166534;font-weight:700">Payment approved — your download is ready.</p>`}else if(ps==='pending'){action=`<button class="blue" disabled>Payment Under Verification</button><p style="margin:8px 0 0;color:#92400e">Your M-Pesa payment is awaiting school approval. This page will check for approval automatically.</p>`}else if(ps==='rejected'){action=`<button class="blue" onclick="requestPurchase(${x.id})">Resubmit Payment / Request Download</button><p style="margin:8px 0 0;color:#b91c1c;font-weight:700">Previous payment request was rejected. Please submit the payment details again.</p>`}else{action=`<button class="blue" onclick="requestPurchase(${x.id})">Pay KSh 100 / Request Download</button>`}return `<div class="resource"><h4>${esc(x.title)}</h4><div class="meta">${esc(x.subject_name)} · ${esc(x.class_name)} · ${esc(x.term||'')} ${x.academic_year||''}</div><p>${esc(x.description||'Exam paper/resource')}</p><b>KSh ${Number(x.price||100).toLocaleString()}</b> <span class="badge">Approved</span><div style="margin-top:10px">${action}</div></div>`}).join('')||'<p class="muted">No approved exam resources are available for your class yet.</p>';startPaymentApprovalPolling(rows)}catch(e){resourceOut.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
let approvalPoll=null;function startPaymentApprovalPolling(rows){clearTimeout(approvalPoll);if(rows.some(x=>x.purchase_status==='pending'))approvalPoll=setTimeout(loadResources,8000)}
async function load(){try{
 const s=await api('/api/my/student');
 const resultsP=api('/api/my/student/results').catch(()=>({exams:[]})), feesP=api('/api/fees/'+s.id).catch(()=>({total_charged:0,total_paid:0,balance:0,charges:[],payments:[]})), commsP=api('/api/communications').catch(()=>[]); const tafhidP=api('/api/my/tafhid?student_id='+encodeURIComponent(s.id)).catch(()=>[]); const [f,r,comms,taf]=await Promise.all([feesP,resultsP,commsP,tafhidP]);
 const e=r.exams||[]; window._student={s,f,e,taf};
 body.innerHTML=`<div id="studentCards" class="gs-dashboard-nav">
 <button class="gs-dashboard-card" onclick="showStudentDetail('profile')"><span class="gs-icon">👤</span><span class="gs-title">My Profile</span><span class="gs-desc">${esc(s.full_name)} • ${esc(s.class_name||'Class not set')}</span><span class="gs-open">Open details →</span></button>
 <button class="gs-dashboard-card" onclick="showStudentDetail('fees')"><span class="gs-icon">💰</span><span class="gs-title">Live School Fees</span><span class="gs-desc">Balance: KSh ${Number(f.balance||0).toLocaleString()}</span><span class="gs-open">View live statement →</span></button>
 <button class="gs-dashboard-card" onclick="showStudentDetail('exams')"><span class="gs-icon">📊</span><span class="gs-title">Live Results</span><span class="gs-desc">${e.length} examination record(s)</span><span class="gs-open">View marks & progress →</span></button>
 <button class="gs-dashboard-card" onclick="showStudentDetail('subject-reports')"><span class="gs-icon">🧑‍🏫</span><span class="gs-title">School Reports</span><span class="gs-desc">Approved subject reports</span><span class="gs-open">Open reports →</span></button>
 <button class="gs-dashboard-card" onclick="showStudentDetail('communication')"><span class="gs-icon">📢</span><span class="gs-title">Communication</span><span class="gs-desc">${comms.length} school message(s)</span><span class="gs-open">View messages →</span></button>
 <button class="gs-dashboard-card" onclick="showStudentDetail('resources')"><span class="gs-icon">📚</span><span class="gs-title">Exam Resources</span><span class="gs-desc">Approved exam papers for your class</span><span class="gs-open">Open resources →</span></button><button class="gs-dashboard-card" onclick="showStudentDetail('tafhid')"><span class="gs-icon">🕌</span><span class="gs-title">Tahfidh Programme</span><span class="gs-desc">Live Qur’an and Tajweed assessments</span><span class="gs-open">View Tahfidh results →</span></button><button class="gs-dashboard-card" onclick="showStudentDetail('exam-bank')"><span class="gs-icon">❓</span><span class="gs-title">Exam Bank Questions</span><span class="gs-desc">Live practice questions for your class</span><span class="gs-open">Open questions →</span></button><button class="gs-dashboard-card" onclick="location.href='/calendar'"><span class="gs-icon">📅</span><span class="gs-title">School Calendar</span><span class="gs-desc">Live school events and dates</span><span class="gs-open">Open calendar →</span></button></div>
 <div id="studentDetail" class="card gs-collapsed"></div>`;
 window._communications=comms; showStudentDetail('profile');
}catch(e){body.innerHTML=`<div class="empty"><b>Unable to load your live school records.</b><p>${esc(e.message)}</p><button onclick="load()">Refresh</button></div>`}}
async function showStudentDetail(type){
 const d=document.getElementById('studentDetail'),cards=document.getElementById('studentCards');
 d.classList.remove('gs-collapsed');if(cards)cards.classList.add('gs-cards-hidden');
 window.scrollTo({top:0,left:0,behavior:'auto'});
 d.innerHTML='<button type="button" class="gs-back" onclick="closeStudentDetail()">← Back</button><p class="muted">Loading live information...</p>';
 let {s,f,e}=window._student||{};
 try{
   s=await api('/api/my/student');
   const promises=[];
   if(type==='fees') promises.push(api('/api/fees/'+s.id).then(v=>f=v));
   if(type==='exams') promises.push(api('/api/my/student/results').then(v=>e=v.exams||[]));
   if(type==='tafhid') promises.push(api('/api/my/tafhid?student_id='+encodeURIComponent(s.id)).then(v=>window._student.taf=v));
   if(type==='communication') promises.push(api('/api/communications').then(v=>window._communications=v));
   await Promise.all(promises);
   window._student={...(window._student||{}),s,f,e};
 }catch(err){
   d.innerHTML='<button type="button" class="gs-back" onclick="closeStudentDetail()">← Back</button><p class="err">'+esc(err.message||'Unable to load live information.')+'</p>';
   return;
 }
 if(type==='profile')d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>My Profile</h3><p><b>Name:</b> ${esc(s.full_name)}</p><p><b>Admission No.:</b> ${esc(s.admission_no||'-')}</p><p><b>Assessment No.:</b> ${esc(s.assessment_number||'-')}</p><p><b>Birth Certificate No.:</b> ${esc(s.birth_certificate_number||'-')}</p><p><b>Class:</b> ${esc(s.class_name||'-')}</p><p><b>Stream:</b> ${esc(s.stream||'-')}</p><p><b>Gender:</b> ${esc(s.gender||'-')}</p><p><b>Date of Birth:</b> ${esc(s.date_of_birth||'-')}</p>`;
 if(type==='fees')d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>Live School Fees</h3><div class="grid"><div class="card"><b>Total Charged</b><div class="stat">KSh ${Number(f.total_charged||0).toLocaleString()}</div></div><div class="card"><b>Total Paid</b><div class="stat">KSh ${Number(f.total_paid||0).toLocaleString()}</div></div><div class="card"><b>Outstanding Balance</b><div class="stat">KSh ${Number(f.balance||0).toLocaleString()}</div></div></div><h4>Charges</h4>${f.charges?.length?f.charges.map(c=>`<div class="card"><b>${esc(c.description||'School fee charge')}</b><br>${esc(c.academic_year||'')} ${esc(c.term||'')} · KSh ${Number(c.amount||0).toLocaleString()}</div>`).join(''):'<p class="muted">No fee charges posted.</p>'}<h4>Payments</h4>${f.payments?.length?f.payments.map(p=>`<div class="card"><b>${esc(p.receipt_no||'Receipt')}</b><br>${esc(p.description||'School fees payment')} · KSh ${Number(p.amount||0).toLocaleString()} · ${esc(p.payment_method||'')}</div>`).join(''):'<p class="muted">No payments recorded.</p>'}<button onclick="downloadDoc('/api/documents/student/${s.id}','${esc(s.full_name)}-fees-statement.html')">Download Fees Statement</button>`;
 if(type==='exams')d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>Live Examination Results</h3><div class="card"><div class="grid"><input id="studentTermYear" type="number" min="2000" max="2100" value="${new Date().getFullYear()}" placeholder="Academic year"><select id="studentTerm"><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select><button onclick="downloadStudentTermReport(${s.id})">Print Full Term Report</button></div><p class="muted" style="margin:8px 0 0">Select a term to print one report containing Opener, Mid and End assessments.</p></div>${e.map(x=>`<div class="card"><b>${esc(x.name)}</b><p class="muted">${esc(x.term||'')} · ${x.academic_year||''}${x.exam_date?' · '+esc(x.exam_date):''}</p><p><b>Average:</b> ${Number(x.average||0).toFixed(2)}% · <b>Total:</b> ${Number(x.total||0)} · <b>Subjects:</b> ${x.subjects}</p>${x.marks?.length?'<div class="gs-list">'+x.marks.map(m=>`<div><b>${esc(m.subject)}</b>: ${m.marks} <span class="muted">(${esc(m.grade||'')})</span>${m.teacher_comment?` — ${esc(m.teacher_comment)}`:''}</div>`).join('')+'</div>':'<p class="muted">No marks have been entered yet.</p>'}<button onclick="downloadDoc('/api/documents/result/${x.id}/${s.id}','${esc(s.full_name)}-${esc(x.name)}-result.html')">Download Result Slip</button></div>`).join('')||'<div class="empty">No examination results are available yet.</div>'}`;
 if(type==='subject-reports')d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>Approved School Reports</h3><div id="studentSubjectReports">Loading...</div>`;
 if(type==='subject-reports')loadStudentSubjectReports();
 if(type==='communication')d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>School Communication</h3>${(window._communications||[]).map(c=>`<div class="card"><b>${esc(c.title)}</b><p class="muted">${new Date(c.created_at).toLocaleString()} · ${esc(c.sender||'School Administration')}</p><p>${esc(c.message).replace(/\n/g,'<br>')}</p></div>`).join('')||'<p class="muted">No school messages yet.</p>'}`;
 if(type==='resources')d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>Exam Resources</h3><p class="muted">Each approved resource costs KSh 100. Send payment to <b>0724844844</b>, then submit the transaction details for verification.</p><div id="resourceOut">Loading approved resources…</div>`;if(type==='resources')loadResources();
 if(type==='tafhid'){d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>🕌 Live Tahfidh Results</h3>${(window._student.taf||[]).length?window._student.taf.map(x=>`<div class="card"><b>${esc(x.assessment_type==='end_term'?'End-Term':'Monthly')} — ${esc(x.period_label||'')}</b><p class="muted">${esc(x.group_name||'')} · ${esc(x.teacher_name||'')} · ${x.academic_year||''}</p><p><b>Juzu:</b> ${esc(x.juzu||'—')} · <b>Q1:</b> ${x.q1||0} · <b>Q2:</b> ${x.q2||0} · <b>Q3:</b> ${x.q3||0} · <b>Tajweed:</b> ${x.tajweed||0} · <b>Total:</b> ${Number(x.total||0)}/100</p><p>${esc(x.teacher_comment||'')}</p></div>`).join(''):'<p class="empty">No Tahfidh assessment has been recorded yet.</p>'}`;}
 if(type==='exam-bank'){d.innerHTML=`<button class="gs-back" onclick="closeStudentDetail()">← Back</button><h3>Live Exam Bank Questions</h3><div id="questionOut">Loading questions...</div>`;loadStudentExamBank();} }
function closeStudentDetail(){
 const d=document.getElementById('studentDetail'),cards=document.getElementById('studentCards');

async function loadStudentSubjectReports(){const el=document.getElementById('studentSubjectReports');try{const rows=await api('/api/my/subject-reports');el.innerHTML=rows.length?rows.map(r=>`<div class="card"><b>${esc(r.subject_name)}</b><p class="muted">${esc(r.term)} ${esc(r.academic_year)} · Teacher: ${esc(r.teacher_name)}</p>${(r.strands||[]).map(z=>`<p><b>${esc(z.strand)}</b> — ${esc(z.rating)}<br><span class="muted">${esc(z.observation||'')}</span></p>`).join('')}<p><b>Strengths:</b> ${esc(r.strengths||'—')}</p><p><b>Areas needing support:</b> ${esc(r.weaknesses||'—')}</p><p><b>Intervention:</b> ${esc(r.recommended_intervention||'—')}</p><p><b>Teacher comment:</b> ${esc(r.general_comment||'—')}</p><button onclick="downloadDoc('/api/documents/student-subject-report/${r.id}','${esc(window._student.s.full_name)}-${esc(r.subject_name)}-subject-report.html')">Download Subject Report</button></div>`).join(''):'<p class="muted">No approved subject reports yet.</p>'}catch(e){el.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
load();

(function(){
 const role=document.body?JSON.parse(localStorage.gs_user||'null')?.role:null;
 if(role!=='student'&&role!=='parent')return;
 const token=localStorage.gs_token;
 async function refreshLiveDocuments(){
   const host=document.getElementById('liveDocuments'); if(!host||!token)return;
   try{
     const r=await fetch('/api/my/documents?_live='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+token}});
     const d=await r.json(); if(!r.ok)throw Error(d.error||'Unable to load documents');
     const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
     const stamp=d.generated_at?new Date(d.generated_at).toLocaleTimeString():'';
     host.innerHTML=`<div class="gs-live-doc-head"><div><h2 style="margin:0">📄 My Live Documents</h2><p class="muted" style="margin:4px 0 0">Documents currently available from the school's records.</p></div><button type="button" onclick="window.refreshMyLiveDocuments()">↻ Refresh</button></div>${d.documents?.length?'<div class="gs-dashboard-nav">'+d.documents.map(x=>`<button type="button" class="gs-dashboard-card gs-live-doc-card" onclick="window.openLiveDocument(${JSON.stringify(x).replace(/</g,'\\u003c')})"><span class="gs-icon">${x.type==='fees'?'💰':x.type==='result'?'📊':x.type==='subject-report'?'🧑‍🏫':x.type==='tafhid'?'🕌':'📚'}</span><span class="gs-title">${esc(x.title)}</span><span class="gs-desc">${esc(x.student_name)} · ${esc(x.description)}</span><span class="gs-open">Open document →</span></button>`).join('')+'</div>':'<div class="empty">No live documents are currently available.</div>'}<p class="muted" style="margin-top:10px">Last checked: ${esc(stamp)} · This list refreshes automatically.</p>`;
   }catch(e){host.innerHTML=`<div class="empty"><b>Unable to load live documents.</b><p>${esc(e.message)}</p><button onclick="window.refreshMyLiveDocuments()">Refresh</button></div>`}
 }
 window.openLiveDocument=function(x){
   const sep=x.url.includes('?')?'&':'?';
   const url=x.url+sep+'_live='+Date.now();
   if(x.type==='exam-resource'){fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error((await r.text())||'Document is not available');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=x.download_name||'exam-resource';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}).catch(e=>alert(e.message));return;}
   fetch(url,{headers:{Authorization:'Bearer '+token},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error((await r.text())||'Document is not available');const b=await r.blob(),u=URL.createObjectURL(b),w=window.open(u,'_blank','noopener');if(!w)alert('Please allow pop-ups for your school School to open the document.');setTimeout(()=>URL.revokeObjectURL(u),60000)}).catch(e=>alert(e.message));
 };
 window.refreshMyLiveDocuments=refreshLiveDocuments;
 refreshLiveDocuments();
 window.setInterval(refreshLiveDocuments,30000);
})();
