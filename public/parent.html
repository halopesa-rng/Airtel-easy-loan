<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Dashboard</title><link rel="stylesheet" href="/styles.css?v=1.8.6"><link rel="stylesheet" href="/ui-polish.css?v=1.8.6"><link rel="stylesheet" href="/dashboard-polish.css?v=1.15.0"><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Parent Portal</b><span id="user"></span><button onclick="logout()">Logout</button></header><main><section id="liveDocuments" class="card" style="margin-bottom:14px">Loading live documents...</section><section class="card gs-page-hero"><h1 style="margin:0">Parent Portal</h1><p class="muted">Select a child to view the relevant school and fee records.</p></section><section class="card"><div class="section-title"><div><h2 style="margin:0">My Children</h2><p class="muted">Your linked learners</p></div></div><div id="body">Loading...</div></section></main><script>const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user||user.role!=='parent')location.href='/';document.getElementById('user').textContent=user.full_name;function api(u,o={}){const sep=u.includes('?')?'&':'?';u=u+sep+'_live='+Date.now();o.headers={...(o.headers||{}),Authorization:'Bearer '+token};if(o.body&&!o.headers['Content-Type'])o.headers['Content-Type']='application/json';return fetch(u,{cache:'no-store',...o,headers:o.headers}).then(async r=>{let d;try{d=await r.json()}catch(_){d={error:'Server returned an invalid response'}}if(!r.ok)throw Error(d.error||'Request failed');return d})}function logout(){localStorage.clear();location.href='/'}async function downloadDoc(url,filename){try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});if(!r.ok){let msg='Unable to download document';try{const t=await r.text();if(t)msg=t.slice(0,180)}catch(_){}throw Error(msg)}const blob=await r.blob();const objectUrl=URL.createObjectURL(blob);const a=document.createElement('a');a.href=objectUrl;a.download=filename||'school-document.html';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(objectUrl);a.remove()},2000)}catch(e){alert(e.message||'Unable to download document')}}function money(v){return 'KSh '+Number(v||0).toLocaleString()}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function requestParentPurchase(resourceId,studentId){const phone=user.phone||prompt('Enter the M-Pesa phone number used for payment:')||'';const reference=prompt('Enter M-Pesa transaction code/reference:')||'';if(!phone||!reference)return alert('Phone number and M-Pesa reference are required.');try{const r=await api('/api/exam-resources/'+resourceId+'/purchase',{method:'POST',body:JSON.stringify({student_id:studentId,payer_phone:phone,reference,payment_details:reference,payment_method:'M-Pesa'})});alert(r.message||'Payment submitted for approval.');openParentRecord(studentId,'resources')}catch(e){alert(e.message)}}
async function downloadResource(resourceId,studentId,name){try{const r=await fetch('/api/exam-resources/'+resourceId+'/download?student_id='+encodeURIComponent(studentId),{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error((await r.text())||'Download not approved yet');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name||'exam-resource';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}catch(e){alert(e.message)}}
async function load(){body.textContent='Loading live learner information...';try{
 const d=await api('/api/my/children'); const comms=await api('/api/communications').catch(()=>[]); window._communications=comms;window._children=d;
 body.innerHTML=`${d.length?`<div id="parentHome"><div class="gs-dashboard-nav">${d.map(x=>`<button class="gs-dashboard-card" onclick="openChild(${x.id})"><span class="gs-icon">🎓</span><span class="gs-title">${esc(x.full_name)}</span><span class="gs-desc">${esc(x.admission_no)} • ${esc(x.class_name||'Class not set')}</span><span class="gs-desc">Charged: ${money(x.charged)} · Paid: ${money(x.paid)} · Balance: ${money(x.balance)}</span><span class="gs-open">View fees & results →</span></button>`).join('')}</div>`:'<div class="empty">No linked children found.</div>'}<div class="card" style="margin-top:14px"><h3>📢 School Communication</h3><div id="communicationBox">${comms.length?comms.map(c=>`<div class="card"><b>${esc(c.title)}</b><p class="muted">${new Date(c.created_at).toLocaleString()} · ${esc(c.sender||'School Administration')}</p><p>${esc(c.message).replace(/\n/g,'<br>')}</p></div>`).join(''):'<p class="muted">No school messages yet.</p>'}</div></div><div id="childDetail" class="card gs-collapsed"></div>`;
}catch(e){body.innerHTML=`<div class="empty"><b>Unable to load live learner information.</b><p>${esc(e.message)}</p><button onclick="load()">Refresh</button></div>`}}
async function openChild(id){
 let x=(window._children||[]).find(v=>Number(v.id)===Number(id));
 if(!x)return;
 try{
   const liveChildren=await api('/api/my/children');
   if(Array.isArray(liveChildren)){window._children=liveChildren;x=liveChildren.find(v=>Number(v.id)===Number(id))||x;}
 }catch(_){}
 window.scrollTo({top:0,left:0,behavior:'auto'});const el=document.getElementById('childDetail'),home=document.getElementById('parentHome'),comm=document.getElementById('communicationBox');el.classList.remove('gs-collapsed');home?.classList.add('gs-cards-hidden');comm?.classList.add('gs-cards-hidden');el.innerHTML=`<button class="gs-back" onclick="closeChild()">← Back to children</button><h3>${esc(x.full_name)}</h3><p class="muted">${esc(x.admission_no)} • ${esc(x.class_name||'Class not set')}</p><div id="parentRecordCards" class="gs-dashboard-nav"><button class="gs-dashboard-card" onclick="openParentRecord(${x.id},'fees')"><span class="gs-icon">💰</span><span class="gs-title">Live Fees</span><span class="gs-desc">Charged: ${money(x.charged)} · Paid: ${money(x.paid)} · Balance: ${money(x.balance)}</span><span class="gs-open">Open fee statement →</span></button><button class="gs-dashboard-card" onclick="openParentRecord(${x.id},'results')"><span class="gs-icon">📊</span><span class="gs-title">Live Results</span><span class="gs-desc">Examination marks and progress</span><span class="gs-open">Open results →</span></button><button class="gs-dashboard-card" onclick="openParentRecord(${x.id},'tafhid')"><span class="gs-icon">🕌</span><span class="gs-title">Tahfidh</span><span class="gs-desc">Qur’an and Tajweed assessments</span><span class="gs-open">Open Tahfidh →</span></button><button class="gs-dashboard-card" onclick="openParentRecord(${x.id},'reports')"><span class="gs-icon">🧑‍🏫</span><span class="gs-title">School Reports</span><span class="gs-desc">Approved subject reports</span><span class="gs-open">Open reports →</span></button><button class="gs-dashboard-card" onclick="openParentRecord(${x.id},'questions')"><span class="gs-icon">❓</span><span class="gs-title">Exam Bank Questions</span><span class="gs-desc">Live questions for ${esc(x.class_name||'your class')}</span><span class="gs-open">Open question bank →</span></button><button class="gs-dashboard-card" onclick="openParentRecord(${x.id},'resources')"><span class="gs-icon">📚</span><span class="gs-title">Exam Resources</span><span class="gs-desc">Approved papers; download after payment approval</span><span class="gs-open">Open paid downloads →</span></button></div><div id="parentRecordDetail" class="card gs-collapsed"></div>`;loadChildData(x.id)}
function closeChild(){document.getElementById('childDetail')?.classList.add('gs-collapsed');document.getElementById('parentHome')?.classList.remove('gs-cards-hidden');document.getElementById('communicationBox')?.classList.remove('gs-cards-hidden')}
async function openParentRecord(id,type){const d=document.getElementById('parentRecordDetail');if(!d)return;d.classList.remove('gs-collapsed');document.getElementById('parentRecordCards')?.classList.add('gs-cards-hidden');const x=(window._children||[]).find(v=>Number(v.id)===Number(id));d.innerHTML=`<button class="gs-back" onclick="d.classList.add('gs-collapsed');document.getElementById('parentRecordCards')?.classList.remove('gs-cards-hidden')">← Back to ${esc(x?.full_name||'records')}</button><h3>${type==='fees'?'Live Fees':type==='results'?'Live Results':type==='tafhid'?'Tahfidh':type==='reports'?'School Reports':type==='questions'?'Exam Bank Questions':'Exam Resources'}</h3><div id="parentRecordContent">Loading live data...</div>`;const c=document.getElementById('parentRecordContent');try{if(type==='fees'){const fee=await api('/api/fees/'+id);c.innerHTML=`<div class="grid"><div class="card"><b>Total Charged</b><div class="stat">${money(fee.total_charged)}</div></div><div class="card"><b>Total Paid</b><div class="stat">${money(fee.total_paid)}</div></div><div class="card"><b>Outstanding</b><div class="stat">${money(fee.balance)}</div></div></div><button onclick="downloadDoc('/api/documents/student/${id}','${esc(x.full_name)}-fees-statement.html')">Download Fees Statement</button><h4>Charges</h4>${fee.charges?.length?fee.charges.map(q=>`<div class="card"><b>${esc(q.description||'School fee charge')}</b><br>${esc(q.academic_year||'')} ${esc(q.term||'')} · ${money(q.amount)}</div>`).join(''):'<p class="muted">No charges posted.</p>'}<h4>Payments</h4>${fee.payments?.length?fee.payments.map(q=>`<div class="card"><b>${esc(q.receipt_no||'Receipt')}</b><br>${esc(q.description||'School fees payment')} · ${money(q.amount)} · ${esc(q.payment_method||'')}</div>`).join(''):'<p class="muted">No payments recorded.</p>'}`}else if(type==='results'){const r=await api('/api/my/children/'+id+'/results');c.innerHTML=`<div class="card"><div class="grid"><input id="parentTermYear" type="number" min="2000" max="2100" value="${new Date().getFullYear()}" placeholder="Academic year"><select id="parentTerm"><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select><button onclick="downloadParentTermReport(${id})">Print Full Term Report</button></div><p class="muted" style="margin:8px 0 0">Choose the term to print a report containing Opener, Mid and End assessments.</p></div>`+(r.exams?.length?r.exams.map(e=>`<div class="card"><b>${esc(e.name)}</b><p class="muted">${esc(e.term||'')} · ${e.academic_year||''}</p><p><b>Average:</b> ${Number(e.average||0).toFixed(2)}% · <b>Total:</b> ${Number(e.total||0)} · <b>Subjects:</b> ${e.subjects}</p>${e.marks?.length?e.marks.map(m=>`<div><b>${esc(m.subject)}</b>: ${m.marks} (${esc(m.grade||'')})</div>`).join(''):'<p class="muted">No marks entered yet.</p>'}<button onclick="downloadDoc('/api/documents/result/${e.id}/${id}','${esc(r.student.full_name)}-${esc(e.name)}-result.html')">Download Result Slip</button></div>`).join(''):'<p class="empty">No examination results available yet.</p>')}else if(type==='tafhid'){const rows=await api('/api/my/tafhid?student_id='+encodeURIComponent(id));c.innerHTML=rows.length?rows.map(r=>`<div class="card"><b>${esc(r.assessment_type==='end_term'?'End-Term':'Monthly')} — ${esc(r.period_label||'')}</b><p class="muted">${esc(r.group_name||'')} · ${esc(r.teacher_name||'')} · ${r.academic_year||''}</p><p><b>Juzu:</b> ${esc(r.juzu||'—')} · <b>Q1:</b> ${r.q1||0} · <b>Q2:</b> ${r.q2||0} · <b>Q3:</b> ${r.q3||0} · <b>Tajweed:</b> ${r.tajweed||0} · <b>Total:</b> ${Number(r.total||0)}/100</p><p>${esc(r.teacher_comment||'')}</p><button onclick="downloadDoc('/api/documents/tafhid-assessment/${r.id}','${esc(x.full_name)}-Tahfidh.html')">Download Tahfidh Record</button></div>`).join(''):'<p class="empty">No Tahfidh assessments recorded yet.</p>'}else if(type==='reports'){const rows=(await api('/api/my/subject-reports')).filter(r=>Number(r.student_id)===Number(id));c.innerHTML=rows.length?rows.map(r=>`<div class="card"><b>${esc(r.subject_name)}</b><p class="muted">${esc(r.term)} ${esc(r.academic_year)} · Teacher: ${esc(r.teacher_name)}</p><p><b>Strengths:</b> ${esc(r.strengths||'—')}</p><p><b>Areas needing support:</b> ${esc(r.weaknesses||'—')}</p><p><b>Intervention:</b> ${esc(r.recommended_intervention||'—')}</p><p><b>Teacher comment:</b> ${esc(r.general_comment||'—')}</p><button onclick="downloadDoc('/api/documents/student-subject-report/${r.id}','subject-report.html')">Download Subject Report</button></div>`).join(''):'<p class="empty">No approved subject reports yet.</p>'}else if(type==='questions'){const rows=await api('/api/my/children/'+id+'/exam-bank');c.innerHTML=rows.length?rows.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.subject_name)}${q.topic?' — '+esc(q.topic):''}</b><p>${esc(q.question_text)}</p>${q.option_a||q.option_b||q.option_c||q.option_d?`<ol type="A"><li>${esc(q.option_a||'')}</li><li>${esc(q.option_b||'')}</li><li>${esc(q.option_c||'')}</li><li>${esc(q.option_d||'')}</li></ol>`:''}<small class="muted">${esc(q.question_type||'Question')} · ${Number(q.marks||1)} mark(s)</small></div>`).join(''):'<p class="empty">No exam-bank questions published for this class yet.</p>'}else{const rows=await api('/api/exam-resources?student_id='+encodeURIComponent(id));const own=rows; c.innerHTML=own.length?own.map(q=>{const st=q.purchase_status||'none';const action=st==='paid'?`<button onclick="downloadResource(${q.id},${id},'${esc(q.original_filename||q.title)}')">⬇ Download Exam</button><b style="color:#166534"> Payment approved</b>`:st==='pending'?'<button disabled>Payment Under Verification</button>':`<button onclick="requestParentPurchase(${q.id},${id})">Pay / Request Download</button>`;return `<div class="card"><b>${esc(q.title)}</b><p class="muted">${esc(q.subject_name)} · ${esc(q.class_name||'')} · ${esc(q.term||'')} ${q.academic_year||''}</p><p>${esc(q.description||'Exam paper/resource')}</p>${action}</div>`}).join(''):'<p class="empty">No approved exam resources are available.</p>'}}catch(e){c.innerHTML=`<div class="err">Unable to load live ${esc(type)}: ${esc(e.message)}</div><button onclick="openParentRecord(${id},'${type}')">Refresh</button>`}}
function downloadParentTermReport(studentId,yearId='parentTermYear',termId='parentTerm'){const y=document.getElementById(yearId)?.value,t=document.getElementById(termId)?.value;if(!y||!t)return alert('Select an academic year and term first.');downloadDoc('/api/documents/term-report/'+studentId+'?download=html&academic_year='+encodeURIComponent(y)+'&term='+encodeURIComponent(t)+'&download_token='+encodeURIComponent(token),'parent-'+t.replace(/\s+/g,'-').toLowerCase()+'-term-report.html')}
async function loadChildData(id){
 const feeBox=document.getElementById('feeBox'),resultsBox=document.getElementById('resultsBox'),subjectReportsBox=document.getElementById('subjectReportsBox'),tafhidBox=document.getElementById('tafhidBox'),parentExamBankBox=document.getElementById('parentExamBankBox');

 }catch(e){feeBox.innerHTML=`<p class="error">Unable to load live fee details. ${esc(e.message)}</p><button onclick="loadChildData(${id})">Refresh</button>`}
 try{
   const results=await api('/api/my/children/'+id+'/results');
   resultsBox.innerHTML=`<div class="card"><div class="grid"><input id="parentDashTermYear" type="number" min="2000" max="2100" value="${new Date().getFullYear()}" placeholder="Academic year"><select id="parentDashTerm"><option value="Term 1">Term 1</option><option value="Term 2">Term 2</option><option value="Term 3">Term 3</option></select><button onclick="downloadParentTermReport(${id},'parentDashTermYear','parentDashTerm')">Print Full Term Report</button></div></div>`+(results.exams?.length?results.exams.map(e=>`<div class="card"><b>${esc(e.name)}</b><div class="muted">${esc(e.term||'')} · ${e.academic_year||''}</div><p><b>Average:</b> ${Number(e.average||0).toFixed(2)}% · <b>Total:</b> ${Number(e.total||0)} · <b>Subjects:</b> ${e.subjects}</p>${e.marks?.length?'<div class="gs-list">'+e.marks.map(m=>`<div><b>${esc(m.subject)}</b>: ${m.marks} <span class="muted">(${esc(m.grade||'')})</span></div>`).join('')+'</div>':'<p class="muted">No marks have been entered for this examination.</p>'}<button onclick="downloadDoc('/api/documents/result/${e.id}/${id}','${esc(results.student.full_name)}-${e.name}-result.html')">Download result</button></div>`).join(''):'<p class="muted">No examination results have been entered for this learner yet.</p>');
 }catch(e){resultsBox.innerHTML=`<p class="error">Unable to load academic results. ${esc(e.message)}</p><button onclick="loadChildData(${id})">Refresh</button>`}
 try{const taf=await api('/api/my/tafhid?student_id='+encodeURIComponent(id));tafhidBox.innerHTML=taf.length?taf.map(r=>`<div class="card"><b>${esc(r.assessment_type==='end_term'?'End-Term':'Monthly')} — ${esc(r.period_label)} ${r.academic_year}</b><p class="muted">Halaqah: ${esc(r.group_name)} · Ustadh: ${esc(r.teacher_name)}</p><p><b>Juzu:</b> ${esc(r.juzu||'—')} · <b>Q1:</b> ${r.q1} · <b>Q2:</b> ${r.q2} · <b>Q3:</b> ${r.q3} · <b>Tajweed:</b> ${r.tajweed} · <b>Total:</b> ${Number(r.total||0).toFixed(0)}/100</p><p>${esc(r.teacher_comment||'')}</p><button onclick="downloadDoc('/api/documents/tafhid-assessment/${r.id}','${esc(results.student.full_name)}-Tahfidh-${esc(r.period_label)}.html')">Download Tahfidh Record</button></div>`).join(''):'<p class="muted">No Tahfidh assessments have been recorded for this learner yet.</p>'}catch(e){tafhidBox.innerHTML=`<p class="error">Unable to load live Tahfidh records. ${esc(e.message)}</p>`}
 try{const qs=await api('/api/my/children/'+id+'/exam-bank');parentExamBankBox.innerHTML=qs.length?qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.subject_name)}${q.topic?' — '+esc(q.topic):''}</b><p>${esc(q.question_text)}</p>${q.option_a||q.option_b||q.option_c||q.option_d?`<ol type="A"><li>${esc(q.option_a||'')}</li><li>${esc(q.option_b||'')}</li><li>${esc(q.option_c||'')}</li><li>${esc(q.option_d||'')}</li></ol>`:''}</div>`).join(''):'<p class="muted">No exam-bank questions for this class yet.</p>'}catch(e){parentExamBankBox.innerHTML=`<p class="error">Unable to load exam-bank questions. ${esc(e.message)}</p>`}
 try{const reports=await api('/api/my/subject-reports');const rows=reports.filter(r=>Number(r.student_id)===Number(id));subjectReportsBox.innerHTML=rows.length?rows.map(r=>`<div class="card"><b>${esc(r.subject_name)}</b><p class="muted">${esc(r.term)} ${esc(r.academic_year)} · Teacher: ${esc(r.teacher_name)}</p>${(r.strands||[]).map(z=>`<p><b>${esc(z.strand)}</b> — ${esc(z.rating)}<br><span class="muted">${esc(z.observation||'')}</span></p>`).join('')}<p><b>Strengths:</b> ${esc(r.strengths||'—')}</p><p><b>Areas needing support:</b> ${esc(r.weaknesses||'—')}</p><p><b>Intervention:</b> ${esc(r.recommended_intervention||'—')}</p><p><b>Teacher comment:</b> ${esc(r.general_comment||'—')}</p><button onclick="downloadDoc('/api/documents/student-subject-report/${r.id}','subject-report.html')">Download Subject Report</button></div>`).join(''):'<p class="muted">No approved subject reports yet.</p>'}catch(e){subjectReportsBox.innerHTML=`<p class="error">Unable to load subject reports. ${esc(e.message)}</p><button onclick="loadChildData(${id})">Refresh</button>`}
}

(function(){
 const role=document.body?JSON.parse(localStorage.gs_user||'null')?.role:null;
 if(role!=='student'&&role!=='parent')return;
 const token=localStorage.gs_token;
 async function refreshLiveDocuments(){
   const host=document.getElementById('liveDocuments'); if(!host||!token)return;
   try{
     const r=await fetch('/api/my/documents?_live='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+token}});
     const d=await r.json(); if(!r.ok)throw Error(d.error||'Unable to load documents');
     const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
     const stamp=d.generated_at?new Date(d.generated_at).toLocaleTimeString():'';
     host.innerHTML=`<div class="gs-live-doc-head"><div><h2 style="margin:0">📄 My Live Documents</h2><p class="muted" style="margin:4px 0 0">Documents currently available from the school's records.</p></div><button type="button" onclick="window.refreshMyLiveDocuments()">↻ Refresh</button></div>${d.documents?.length?'<div class="gs-dashboard-nav">'+d.documents.map(x=>`<button type="button" class="gs-dashboard-card gs-live-doc-card" onclick="window.openLiveDocument(${JSON.stringify(x).replace(/</g,'\\u003c')})"><span class="gs-icon">${x.type==='fees'?'💰':x.type==='result'?'📊':x.type==='subject-report'?'🧑‍🏫':x.type==='tafhid'?'🕌':'📚'}</span><span class="gs-title">${esc(x.title)}</span><span class="gs-desc">${esc(x.student_name)} · ${esc(x.description)}</span><span class="gs-open">Open document →</span></button>`).join('')+'</div>':'<div class="empty">No live documents are currently available.</div>'}<p class="muted" style="margin-top:10px">Last checked: ${esc(stamp)} · This list refreshes automatically.</p>`;
   }catch(e){host.innerHTML=`<div class="empty"><b>Unable to load live documents.</b><p>${esc(e.message)}</p><button onclick="window.refreshMyLiveDocuments()">Refresh</button></div>`}
 }
 window.openLiveDocument=function(x){
