<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Subject Reports — your school</title><link rel="stylesheet" href="/styles.css?v=1.3.8"><link rel="stylesheet" href="/ui-polish.css?v=1.3.8"><link rel="stylesheet" href="/dashboard-polish.css?v=1.15.0"><style>
:root{--g:#087a4b;--ink:#172033;--muted:#667085;--line:#dce7e2;--soft:#f4faf7}body{background:linear-gradient(180deg,#f4f8f7,#eef3f7)}main{max-width:1180px;margin:22px auto;padding:0 16px}.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .full{grid-column:1/-1}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.strand{border:1px solid #dce7e2;background:#f9fcfb;border-radius:13px;padding:13px;margin:10px 0}.strand-head{display:grid;grid-template-columns:1.2fr .7fr auto;gap:10px;align-items:end}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--g);color:#fff}.btn.light{background:#e8f4ee;color:#075f3c}.btn.danger{background:#b42318}.btn.warn{background:#9a6700}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.pending{background:#fff4cc;color:#8a5a00}.approved{background:#dff5e8;color:#075f3c}.rejected{background:#fee4e2;color:#b42318}.report-card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff;margin:12px 0}.report-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.muted{color:var(--muted)}textarea{min-height:90px}small.hint{color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.strand-head{grid-template-columns:1fr}.grid .full{grid-column:auto}}
/* Surgical UI polish: teacher report-writing area only */
.report-builder{border-top:4px solid #087443}
.form-section{border:1px solid #e2ebe7;border-radius:14px;padding:16px;margin-top:14px;background:#fbfdfc}
.form-section h3{margin:0 0 6px;color:#12352a}
.section-kicker{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#087443;margin-bottom:4px}
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.report-grid .full{grid-column:1/-1}
.field-help{font-size:12px;color:#667085;margin-top:4px}
.submit-bar{position:sticky;bottom:10px;z-index:5;background:rgba(255,255,255,.96);border:1px solid #dce8e2;border-radius:14px;padding:10px;box-shadow:0 8px 25px rgba(16,24,40,.10)}
.strand-empty{padding:14px;border:1px dashed #cbd8d2;border-radius:12px;background:#fff;color:#667085}
@media(max-width:700px){.report-grid{grid-template-columns:1fr}.report-grid .full{grid-column:auto}}

</style><link rel="stylesheet" href="/app-navigation.css?v=1.7.5"><script src="/tenant-brand.js" defer></script></head><body><header><b>your school — Student Subject Reports</b><span id="user"></span><button onclick="logout()">Logout</button></header><main><section class="card hero"><div><h1 style="margin:0">Student Subject Reports</h1><p class="muted" id="intro">Strand-based learner observations and professional review.</p></div><button class="btn light" onclick="goBack()">← Back to dashboard</button></section><section id="content"></section></main><script>
const token=localStorage.gs_token,user=JSON.parse(localStorage.gs_user||'null');if(!token||!user)location.href='/';document.getElementById('user').textContent=user.full_name+' ('+user.role+')';
function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(u,o).then(async r=>{let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.error||'Request failed');return d})}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function logout(){localStorage.clear();location.href='/'}function goBack(){history.length>1?history.back():(location.href='/')}
async function downloadReport(id,name){try{const r=await fetch('/api/documents/student-subject-report/'+id+'?download=1',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(await r.text()||'Download failed');const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name||'student-subject-report.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){alert(e.message)}}
const levelOptions=`<option value="strength">Strength</option><option value="developing" selected>Developing</option><option value="needs_support">Needs Support</option>`;
function statusBadge(s){return `<span class="status ${esc(s)}">${esc(s)}</span>`}
async function teacherView(){document.getElementById('intro').textContent='Write reports only for your assigned learning areas and classes.';const [as,reports]=await Promise.all([api('/api/student-subject-reports/assignments'),api('/api/student-subject-reports')]);content.innerHTML=`<section class="panel report-builder"><div class="section-kicker">Subject Teacher Report</div><h2 style="margin:0 0 6px">Write a Learner Report</h2><p class="muted">Record evidence from the learner’s strands, highlight strengths and weaknesses, and submit the report for administration review.</p>
<div class="form-section"><div class="section-kicker">1 · Learner & Assessment</div><h3>Identify the learner</h3><div class="report-grid"><label>Assigned learning area / class<select id="assignment"><option value="">Select assignment</option>${as.map(a=>`<option value="${a.id}" data-subject="${a.subject_id}">${esc(a.subject_name)} — ${esc(a.class_name)}</option>`).join('')}</select><div class="field-help">Only your assigned learning areas and classes are available.</div></label><label>Learner<select id="learner" disabled><option>Select assignment first</option></select><div class="field-help">Choose the individual learner you are reporting on.</div></label><label>Term<input id="term" placeholder="e.g. Term 2"></label><label>Academic year<input id="year" type="number" value="${new Date().getFullYear()}"></label></div></div>
<div class="form-section"><div class="section-kicker">2 · Strand Evidence</div><h3>Strand-by-strand observation</h3><p class="muted">Add the relevant strands and record the learner’s current level with clear evidence.</p><div id="strands"></div><button type="button" class="btn light" onclick="addStrand()">＋ Add another strand</button></div>
<div class="form-section"><div class="section-kicker">3 · Professional Summary</div><h3>Strengths, needs & support</h3><div class="report-grid"><label class="full">Strengths<textarea id="strengths" placeholder="What does the learner do well? Mention specific skills, progress or positive behaviours."></textarea></label><label class="full">Weaknesses / areas needing support<textarea id="weaknesses" placeholder="Identify specific strands, skills or learning areas that need support."></textarea></label><label class="full">Recommended intervention<textarea id="intervention" placeholder="Suggest practical support, practice, remediation or follow-up."></textarea></label><label class="full">Overall subject teacher comment<textarea id="comment" placeholder="Give a concise professional summary of the learner’s progress and next steps."></textarea></label></div></div>
<div class="submit-bar"><div class="actions"><button class="btn" onclick="submitReport()">Submit Report for Review</button><span class="muted">The report will be sent to the school administration review process.</span></div></div></section></section><section class="panel"><h2>My submitted reports</h2><div id="myReports">${reportList(reports,true)}</div></section>`;assignment.onchange=loadLearners;addStrand()}
async function loadLearners(){learner.disabled=true;learner.innerHTML='<option>Loading learners…</option>';if(!assignment.value)return;try{const d=await api('/api/student-subject-reports/learners?assignment_id='+assignment.value);learner.innerHTML='<option value="">Select learner</option>'+d.learners.map(x=>`<option value="${x.id}">${esc(x.admission_no)} — ${esc(x.full_name)}</option>`).join('');learner.disabled=false}catch(e){learner.innerHTML='<option>'+esc(e.message)+'</option>'}}
function addStrand(){const id='st'+Date.now()+Math.random().toString(16).slice(2);const el=document.createElement('div');el.className='strand';el.dataset.id=id;el.innerHTML=`<div class="strand-head"><label>Strand / skill<input class="strand-name" placeholder="e.g. Reading fluency"></label><label>Current level<select class="strand-level">${levelOptions}</select></label><button type="button" class="btn danger" onclick="this.closest('.strand').remove()">Remove</button></div><label style="display:block;margin-top:10px">Observation / evidence<textarea class="strand-observation" placeholder="Describe the evidence observed, progress made, or difficulty noted."></textarea></label>`;strands.appendChild(el)}
async function submitReport(){try{const arr=[...document.querySelectorAll('.strand')].map(x=>({strand:x.querySelector('.strand-name').value,rating:x.querySelector('.strand-level').value,observation:x.querySelector('.strand-observation').value})).filter(x=>x.strand.trim());if(!assignment.value||!learner.value)return alert('Select the assigned subject/class and learner.');if(!arr.length)return alert('Add at least one strand.');await api('/api/student-subject-reports',{method:'POST',body:JSON.stringify({assignment_id:Number(assignment.value),student_id:Number(learner.value),term:term.value,academic_year:year.value,strengths:strengths.value,weaknesses:weaknesses.value,recommended_intervention:intervention.value,general_comment:comment.value,strands:arr})});alert('Report submitted to Administration for review.');teacherView()}catch(e){alert(e.message)}}
function reportList(rows,teacher){if(!rows?.length)return '<p class="muted">No reports submitted yet.</p>';return rows.map(r=>`<article class="report-card"><div class="report-top"><div><h3 style="margin:0">${esc(r.student_name)}</h3><p class="muted" style="margin:5px 0">${esc(r.subject_name)} · ${esc(r.class_name)} · ${esc(r.term)} ${esc(r.academic_year)}</p><p style="margin:0">Teacher: ${esc(r.teacher_name)}</p></div><div>${statusBadge(r.status)}</div></div>${r.review_note?`<p><b>Review note:</b> ${esc(r.review_note)}</p>`:''}<div class="actions" style="margin-top:10px">${r.status==='approved'?`<button class="btn" onclick="downloadReport(${r.id},'${esc(r.student_name)}-${esc(r.subject_name)}-subject-report.pdf')">⬇ Download Report</button>`:''}${teacher&&r.status==='rejected'?'<span class="muted">Correct the report and resubmit.</span>':''}</div></article>`).join('')}
async function adminView(){document.getElementById('intro').textContent='All submitted reports are routed here. Admin, Director and Principal may approve, reject or delete.';const rows=await api('/api/student-subject-reports');content.innerHTML=`<section class="panel"><div class="actions"><h2 style="margin-right:auto">Administration Review</h2><button class="btn light" onclick="adminView()">Refresh</button></div><div id="adminList">${adminList(rows)}</div></section>`}
function adminList(rows){if(!rows.length)return '<p class="muted">No subject reports have been submitted yet.</p>';return rows.map(r=>`<article class="report-card"><div class="report-top"><div><h3 style="margin:0">${esc(r.student_name)}</h3><p class="muted">${esc(r.subject_name)} · ${esc(r.class_name)} · ${esc(r.term)} ${esc(r.academic_year)}</p><p><b>Teacher:</b> ${esc(r.teacher_name)}</p></div><div>${statusBadge(r.status)}</div></div><details style="margin-top:10px"><summary>View report details</summary><p><b>Strengths:</b> ${esc(r.strengths||'—')}</p><p><b>Areas needing support:</b> ${esc(r.weaknesses||'—')}</p><p><b>Intervention:</b> ${esc(r.recommended_intervention||'—')}</p><p><b>Overall comment:</b> ${esc(r.general_comment||'—')}</p><table><tr><th>Strand</th><th>Level</th><th>Observation</th></tr>${(r.strands||[]).map(x=>`<tr><td>${esc(x.strand)}</td><td>${esc(x.rating)}</td><td>${esc(x.observation||'')}</td></tr>`).join('')}</table></details>${r.review_note?`<p><b>Review note:</b> ${esc(r.review_note)}</p>`:''}<div class="actions" style="margin-top:10px">${['admin','director','principal'].includes(user.role)&&r.status!=='approved'?`<button class="btn" onclick="review(${r.id},'approved')">Approve</button>`:''}${['admin','director','principal'].includes(user.role)&&r.status!=='rejected'?`<button class="btn warn" onclick="review(${r.id},'rejected')">Reject</button>`:''}${r.status==='approved'?`<button class="btn light" onclick="downloadReport(${r.id},'${esc(r.student_name)}-subject-report.pdf')">⬇ Download</button>`:''}${['admin','director','principal'].includes(user.role)?`<button class="btn danger" onclick="deleteReport(${r.id})">Delete</button>`:''}</div></article>`).join('')}
async function review(id,status){let note='';if(status==='rejected'){note=prompt('Reason for rejection (required):')||'';if(!note.trim())return alert('A rejection reason is required.')}try{await api('/api/student-subject-reports/'+id,{method:'PATCH',body:JSON.stringify({status,review_note:note})});adminView()}catch(e){alert(e.message)}}async function deleteReport(id){if(confirm('Delete this subject report permanently?')){await api('/api/student-subject-reports/'+id,{method:'DELETE'});adminView()}}
async function familyView(){const sid=Number(new URLSearchParams(location.search).get('student_id'));if(!sid)return content.innerHTML='<section class="panel"><p>No learner selected.</p></section>';const rows=await api('/api/student-subject-reports?student_id='+sid);document.getElementById('intro').textContent='Approved subject reports for this learner.';content.innerHTML=`<section class="panel"><h2>Approved Subject Reports</h2>${reportList(rows,false)}</section>`}
async function init(){try{if(user.role==='teacher')return teacherView();if(['admin','director','principal','secretary'].includes(user.role))return adminView();if(user.role==='parent'||user.role==='student')return familyView();location.href='/'}catch(e){content.innerHTML='<section class="panel"><p class="err">'+esc(e.message)+'</p><button class="btn light" onclick="init()">Refresh</button></section>'}}
init();
</script><script src="/app-navigation.js?v=1.7.5"></script><script src="/navigation-templates.js?v=1.7.5"></script></body></html>
